  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  .match-meta{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n  .match-crest{width:36px;height:36px;font-size:10px;flex-shrink:0;border-radius:12px;}\n  .scoreboard{padding:5px 10px;min-width:70px;gap:4px;flex-shrink:0;}\n  .scoreboard .digit{font-size:24px;min-width:18px;}\n  .scoreboard .sep{font-size:14px;}\n  .match-score{font-size:26px;}\n\n  .pitch{height:340px;}\n  .pdot .circ{width:27px;height:27px;font-size:11px;}\n  .pdot .lbl{font-size:8px;}\n\n  .modal-overlay{padding:0;align-items:flex-end;}\n  .modal{max-width:100%;width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding:22px 18px 26px;}\n\n  .toast-container{top:16px;left:12px;right:12px;bottom:auto;max-width:none;align-items:center;}\n  .toast-item{font-size:12.5px;width:100%;max-width:380px;}\n\n  .start-menu-overlay{align-items:flex-start;padding:14px 10px;}\n  .start-menu-card{padding:20px 16px;border-radius:18px;margin:6px auto;}\n  .start-menu-card h1{font-size:19px;}\n  .start-menu-card p.hint{font-size:12px;}\n  .start-club-grid{grid-template-columns:1fr;gap:10px;margin-top:16px;}\n  .start-club-card{padding:14px 14px;}\n  .start-club-card .crest{width:44px;height:44px;font-size:12px;margin-bottom:8px;}\n  .start-club-card h3{font-size:14px;margin-bottom:10px;}\n\n  .goal-card{padding:22px 20px 20px;max-width:280px;}\n  .goal-field{width:190px;height:260px;}\n}\n<\/style>\n<\/head>\n<body>\n\n\n\n<div class=\"start-menu-overlay\" id=\"startMenuOverlay\">\n  <div class=\"start-menu-card\">\n    <h1>Choisissez votre club<\/h1>\n    <p class=\"hint\" style=\"margin-top:0;\">Choisissez un pays et une division, puis comparez le niveau moyen de l'effectif et le style de jeu du coach des 3 clubs proposés.<\/p>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;\">\n      <div style=\"flex:1;min-width:180px;\">\n        <span class=\"field-label\">Pays<\/span>\n        <select id=\"startCountrySelect\" onchange=\"onStartCountryChange()\"><\/select>\n      <\/div>\n      <div style=\"flex:1;min-width:180px;\">\n        <span class=\"field-label\">Division<\/span>\n        <select id=\"startDivisionSelect\" onchange=\"onStartDivisionChange()\"><\/select>\n      <\/div>\n    <\/div>\n    <div class=\"start-club-grid\" id=\"startClubGrid\"><\/div>\n  <\/div>\n<\/div>\n\n<div class=\"app\">\n  <!-- SIDEBAR -->\n  <aside class=\"sidebar\">\n    <div class=\"club-id\">\n      <div class=\"crest\" id=\"sidebarCrest\">G38<\/div>\n      <div>\n        <div class=\"name\" id=\"sidebarClubName\">SC Chamassonay<\/div>\n        <div class=\"league\" id=\"sidebarLeague\">Division Excellence<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"mini-next\" id=\"sidebarNext\">Prochain match<br><b>—<\/b><\/div>\n\n    <div class=\"mini-next\" id=\"sidebarWeek\" style=\"text-align:center;\">\n      <div style=\"margin-bottom:8px;\">Semaine <b id=\"sidebarWeekNum\">1<\/b> \/ 52<\/div>\n      <button class=\"btn btn-accent btn-sm\" style=\"width:100%;margin-bottom:6px;\" onclick=\"goToNextWeek()\">⏭ Semaine suivante<\/button>\n    <\/div>\n\n    <div class=\"mobile-week-bar\" id=\"mobileWeekBar\">\n      <div class=\"mobile-week-info\" id=\"mobileNextMatch\">Prochain match<br><b>—<\/b><\/div>\n      <button class=\"mobile-week-next-btn\" onclick=\"goToNextWeek()\" title=\"Semaine suivante\">»<\/button>\n    <\/div>\n\n    <nav class=\"navlist\">\n      <button data-view=\"dashboard\" class=\"active\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 4l9 6.5\"><\/path><path d=\"M5 9.5V19a1 1 0 0 0 1 1h3v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5h3a1 1 0 0 0 1-1V9.5\"><\/path><\/svg><\/span><span class=\"nav-label\">Accueil<\/span><\/button>\n      <button data-view=\"match\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 8.8 15 11 13.9 14.6 10.1 14.6 9 11Z\"><\/path><\/svg><\/span><span class=\"nav-label\">Match<\/span><\/button>\n      <button data-view=\"classement\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 4h10v4a5 5 0 0 1-10 0z\"><\/path><path d=\"M7 5H4a3 3 0 0 0 3 4M17 5h3a3 3 0 0 1-3 4\"><\/path><path d=\"M12 13v3M9 20h6M10 20v-3h4v3\"><\/path><\/svg><\/span><span class=\"nav-label\">Classement<\/span><\/button>\n      <button data-view=\"recrutement\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M15 9l-4 2-2 4 4-2z\"><\/path><\/svg><\/span><span class=\"nav-label\">Recrutement<\/span><\/button>\n      <button data-view=\"effectif\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\/circle><path d=\"M3.5 20a5.5 5.5 0 0 1 11 0\"><\/path><circle cx=\"17\" cy=\"9\" r=\"2.2\"><\/circle><path d=\"M15.2 13.8A4.8 4.8 0 0 1 20.5 18\"><\/path><\/svg><\/span><span class=\"nav-label\">Effectif<\/span><\/button>\n      <button data-view=\"composition\"><span class=\"ic\"><svg class=\"ic-svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 4.5h3.2v1.7a1.3 1.3 0 1 0 2.6 0V4.5H18v3.2h-1.7a1.3 1.3 0 1 0 0 2.6H18V13h-3.2v-1.7a1.3 1.3 0 1 0-2.6 0V13H9V9.8H7.3a1.3 1.3 0 1 1 0-2.6H9z\"><\/path><\/svg><\/span><span class=\"nav-label\">Composition<\/span><\/button>\n      <button data-view=\"coach\"><span class=\"ic\"><sv sor:pointer;\" onclick=\"goToTab('composition')\" title=\"Voir la composition\"><span class=\"hint\">Niveau de l'équipe (onze actuel)<\/span><div class=\"value\" id=\"rNiveauEquipe\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToTab('effectif')\" title=\"Voir l'effectif\"><span class=\"hint\">Potentiel de l'équipe<\/span><div class=\"value\" id=\"rPotentielEquipe\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToTab('effectif')\" title=\"Voir l'effectif\"><span class=\"hint\">Âge de l'équipe<\/span><div class=\"value\" id=\"rAgeEquipe\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToTab('effectif')\" title=\"Voir l'effectif\"><span class=\"hint\">Valeur de l'effectif<\/span><div class=\"value\" id=\"rValeurEffectif\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"setEffectifView('moral');goToTab('effectif')\" title=\"Voir la vue moral\"><span class=\"hint\">Moral de l'effectif<\/span><div class=\"value\" id=\"rMoralEffectif\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToClassement()\" title=\"Aller au Classement\"><span class=\"hint\">Forme récente (5 derniers)<\/span><div class=\"value\" id=\"rFormeRecente\" style=\"font-size:20px;\">—<\/div><\/div>\n      <\/div>\n\n      <!-- Ligne 3 : R8, R9, R12, R11 -->\n      <div class=\"grid cols-4\" style=\"margin-top:16px;\">\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToTab('recrutement')\" title=\"Aller au Recrutement\"><span class=\"hint\">Budget transfert restant<\/span><div class=\"value\" id=\"rBudgetTransfert\">—<\/div><\/div>\n        <div class=\"stat-card\" style=\"cursor:pointer;\" onclick=\"goToTab('recrutement')\" title=\"Aller au Recrutement\"><span class=\"hint\">Marge salariale<\/span><div class=\"value\" id=\"rMargeSalariale\">—<\/div><\/div>\n        <div class=\"stat-card\" id=\"rMeilleurPasseurCard\" style=\"cursor:pointer;\" title=\"Voir sa fiche\"><span class=\"hint\">Meilleur passeur<\/span><div class=\"value\" id=\"rMeilleurPasseur\" style=\"font-size:16px;\">—<\/div><\/div>\n        <div class=\"stat-card\" id=\"rMeilleurButeurCard\" style=\"cursor:pointer;\" title=\"Voir sa fiche\"><span class=\"hint\">Meilleur buteur<\/span><div class=\"value\" id=\"rMeilleurButeur\" style=\"font-size:16px;\">—<\/div><\/div>\n      <\/div>\n\n      <!-- Ligne 4 : R13 (Alertes) -->\n      <div class=\"section-title\" style=\"margin-top:16px;\"><h2>Alertes<\/h2><\/div>\n      <div class=\"card\">\n        <div class=\"rel-row\" style=\"cursor:pointer;\" onclick=\"setEffectifView('forme');goToTab('effectif')\" title=\"Voir la vue forme\"><span>Blessés en cours<\/span><b id=\"rAlertBlesses\">—<\/b><\/div>\n        <div class=\"rel-row\" style=\"cursor:pointer;\" onclick=\"setEffectifView('contrat');goToTab('effectif')\" title=\"Voir la vue contrat\"><span>Contrats arrivant à échéance dans l'année<\/span><b id=\"rAlertContrats\">—<\/b><\/div>\n        <div class=\"rel-row\" style=\"cursor:pointer;\" onclick=\"goToTab('recrutement')\" title=\"Aller au Recrutement\"><span>Offres en attente de réponse<\/span><b id=\"rAlertOffres\">—<\/b><\/div>\n        <div class=\"rel-row\" style=\"cursor:pointer;\" onclick=\"goToTab('recrutement')\" title=\"Aller au Recrutement\"><span>Options d'achat en attente<\/span><b id=\"rAlertOptions\">—<\/b><\/div>\n      <\/div>\n\n      <div class=\"section-title\" style=\"margin-top:16px;\"><h2>Coupe de France<\/h2><\/div>\n      <div class=\"card\">\n        <p class=\"hint\" style=\"margin-top:0;\" id=\"rCupStatus\">—<\/p>\n      <\/div>\n\n      <\/section>\n\n    <section id=\"match\" class=\"view\">\n      <div class=\"topbar\">\n        <div><h1>Match<\/h1><div class=\"sub\" id=\"matchMeta\">Division Excellence<\/div><\/div>\n      <\/div>\n\n      <div class=\"card\" id=\"matchActionBar\" style=\"margin-bot \/div>\n\n        <span class=\"field-label\">Style de jeu<\/span>\n        <div class=\"tactic-detail\" id=\"coachCurrentStyle\" style=\"max-width:520px;\"><\/div>\n\n        <div class=\"divider\"><\/div>\n\n        <span class=\"field-label\">Affinité ADN<\/span>\n        <div class=\"chip-group\" id=\"coachAdnAffinity\" style=\"margin-bottom:16px;\"><\/div>\n\n        <span class=\"field-label\">Incompatibilité ADN<\/span>\n        <div class=\"chip-group\" id=\"coachAdnIncompatibility\"><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- ============ MON COMPTE (sauvegarde) ============ -->\n    <section id=\"compte\" class=\"view\">\n      <div class=\"topbar\">\n        <div><h1>Mon compte<\/h1><div class=\"sub\">Enregistrez et reprenez votre progression<\/div><\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <h3>Sauvegarde locale<\/h3>\n        <p class=\"hint\" style=\"margin-top:0;\">Votre progression est enregistrée dans ce navigateur. Une sauvegarde automatique se fait aussi à chaque changement de semaine, en plus de la sauvegarde manuelle.<\/p>\n        <div class=\"kv-grid\">\n          <div class=\"k\">Dernière sauvegarde<\/div><div class=\"v\" id=\"lastSaveLabel\">Aucune sauvegarde<\/div>\n        <\/div>\n        <div style=\"display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;\">\n          <button class=\"btn btn-accent\" onclick=\"saveGameManual()\">💾 Sauvegarder maintenant<\/button>\n          <button class=\"btn btn-primary\" id=\"loadGameBtn\" onclick=\"loadGameManual()\">📂 Charger la sauvegarde<\/button>\n          <button class=\"btn btn-danger\" id=\"deleteSaveBtn\" onclick=\"deleteSaveGame()\">🗑️ Supprimer la sauvegarde<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"section-title\" style=\"margin-top:20px;\"><h2>Exporter \/ importer un fichier<\/h2><\/div>\n      <div class=\"card\">\n        <p class=\"hint\" style=\"margin-top:0;\">Pour transférer votre progression vers un autre navigateur ou appareil, expor iv><span>Nationalité<\/span><b id=\"alertNat\">—<\/b><\/div>\n    <\/div>\n    <p class=\"player-alert-desc\" id=\"alertDesc\"><\/p>\n    <button class=\"btn btn-primary\" style=\"width:100%;max-width:280px;\" onclick=\"dismissCurrentToast()\">OK<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"ceremony-overlay\" id=\"ceremonyOverlay\">\n  <div class=\"ceremony-card\">\n    <h2 style=\"text-align:center;margin-bottom:4px;\">🏆 Cérémonie de fin de saison<\/h2>\n    <p class=\"hint\" style=\"text-align:center;margin-top:0;margin-bottom:20px;\" id=\"ceremonySeasonLabel\"><\/p>\n    <div id=\"ceremonyAwards\"><\/div>\n    <button class=\"btn btn-primary\" style=\"width:100%;margin-top:12px;\" onclick=\"closeCeremony()\">Continuer<\/button>\n  <\/div>\n<\/div>\n\n<div class=\"goal-overlay\" id=\"goalOverlay\">\n  <div class=\"goal-card\">\n    <div class=\"goal-field\">\n      <div class=\"goal-box\"><\/div>\n      <div class=\"goal-net\"><\/div>\n      <div class=\"goal-ball\" id=\"goalBall\">⚽<\/div>\n    <\/div>\n    <h2 id=\"goalScorerName\">—<\/h2>\n    <div class=\"goal-assist\" id=\"goalAssistName\"><\/div><div class=\"goal-adn-line\" id=\"goalAdnLine\"><\/div>\n    <span class=\"goal-buteur-tag\" id=\"goalTag\">BUT !<\/span>\n  <\/div>\n<\/div>\n\n<script>\n\/* ============================================================\n   CONSTANTES & DONNÉES\n   ============================================================ *\/\nlet CLUB_NAME = \"Club Fantôme\"; \/\/ valeur temporaire, remplacée dès le choix du club de départ\n\nconst ADN_EFFECTS = {\n  \"Rugueux\":\"+10% de cartons jaunes, −5% de buts marqués dans le match.\",\n  \"Rapide\":\"+5 si l'équipe joue en Jeu Direct.\",\n  \"Lent\":\"−5 si l'équipe joue en Jeu Direct.\",\n  \"Vista\":\"+10% de passes décisives, +5% de buts dans le match.\",\n  \"Technique\":\"+5% de possession pour son équipe.\",\n  \"Endurant\":\"+5 en prolongations, +1 en 2ᵉ partie de saison.\",\n  \"Prolifique\":\"+15% de chances de marquer un but.\", \n  const def = defLineFor(v.def);\n  return { def, mid:v.mid, att:v.att, flat:[\"GB\",...def,...v.mid,...v.att] };\n}\n\nconst OPP_SLOTS = [\n  {x:50,y:8,label:\"GB\"},{x:82,y:26,label:\"DD\"},{x:62,y:22,label:\"DC\"},{x:38,y:22,label:\"DC\"},{x:18,y:26,label:\"DG\"},\n  {x:80,y:42,label:\"MD\"},{x:60,y:40,label:\"MC\"},{x:40,y:40,label:\"MC\"},{x:20,y:42,label:\"MG\"},\n  {x:40,y:54,label:\"BU\"},{x:60,y:54,label:\"BU\"}\n];\n\n\/* ---------- Montée \/ relégation entre 3 divisions ---------- *\/\nconst L2_POOL = [\"SC Ferbrégmont\",\"Stade Brisercysec\",\"Olympique de Solrangé\",\"US Gartellbourg\",\"Racing Montivierx\",\"US Auburacol\",\"Racing Beronvalies\",\"FC Correuilac\",\"SC Chamassonay\",\"AS Montandonsec\",\"SM Vereraccourt\",\"Olympique de Ferreuilay\",\"US Aubrangsec\",\"US Solreuilsec\",\"Stade Valtelland\",\"RC Vertellx\",\"Olympique de Prevessanol\"];\nconst L1_POOL = [\"US Monteracsec\",\"AS Laurangville\",\"RC Vaubrégville\",\"RC Preveracac\",\"SM Chamignolsec\",\"CA Gartellbourg\",\"EA Chamassonay\",\"SC Auburacol\",\"US Cormoubourg\",\"CA Bereracay\",\"US Aubcressin\",\"Olympique de Vauombreeix\",\"ES Lauoisies\",\"SC Cormoubourg\",\"SM Laurangville\",\"Olympique de Correuilac\",\"SC Briscressville\"];\nconst NATIONAL_POOL = [\"Olympique de Belessyac\",\"FC Beltellville\",\"EA Vereraccourt\",\"FC Brisombreand\",\"EA Valmouies\",\"SC Beronvalies\",\"SM Briscressville\",\"SC Rouuracay\",\"ES Brisercysec\",\"CA Ferombrein\",\"AS Valtelland\",\"SM Coriviersec\",\"CA Ferignolies\",\"ES Montandonsec\",\"ES Cortellé\",\"SC Tourombresec\",\"US Valbrégin\"];const N1_POOL = [\"Stade Ferombreies\",\"US Lauoisies\",\"Racing Rouuracay\",\"CA Vaubrégville\",\"AS Chamassonay\",\"Racing Beloisbourg\",\"US Bereracay\",\"SM Solrangé\",\"CA Veruraceix\",\"US Beroisand\",\"RC Beltellville\",\"SC Correuilac\",\"ES Auburacol\",\"RC Tourombresec\",\"EA Montandonan\",\"Stade Bereracay\",\"CA Preveracac\"];const N2_POOL = [\"CA Ferbrégmont\",\"Stade Brisombreand\",\"SC T n: \"Championnat National Suisse\", baseLevel: 60, pool: [\"FC Bellsingen\",\"FC Montsingenen\",\"BSC Rapsingenen\",\"BSC Niederwil\",\"FC Oberdorf\",\"BSC Montsingenen\",\"BSC Zofsingenen\",\"BSC Rapperswilen\",\"FC Montperswilen\",\"BSC Oberdorf\",\"FC Belldorf\",\"FC Lugegg\",\"FC Niederwil\",\"BSC Rapeggen\",\"BSC Oberwil\",\"FC Oberwil\",\"BSC Belllingenen\"] },\n  \"Portugal\": { division: \"Championnat National Portugais\", baseLevel: 65, pool: [\"Sporting Coredondoa\",\"CD Seradelaa\",\"FC Penedondoa\",\"FC Braadelaa\",\"FC Lagangueiraa\",\"CD Alvangueirao\",\"SC Castadela\",\"SC Penelos\",\"FC Penelos\",\"Sporting Monangueiraa\",\"FC Feradelao\",\"Sporting Vilforte\",\"Sporting Alvadelao\",\"SC Alvangueirao\",\"SC Braadelaa\",\"SC Correiraa\",\"CD Correiraa\"] },\n  \"Brésil\": { division: \"Championnat National Brésilien\", baseLevel: 72, pool: [\"Montefundo Alegre EC\",\"Novofundo Alegre AC\",\"Belareal AC\",\"Serrareal Alegre FC\",\"Belareal EC\",\"Portofundo Alegre AC\",\"Novofundo Alegre FC\",\"Altodourado AC\",\"Altogrande Alegre EC\",\"Novofundo Alegre EC\",\"Portoverde Alegre EC\",\"Campodourado AC\",\"Portoverde Alegre AC\",\"Portogrande FC\",\"Monteverde EC\",\"Campoclaro FC\",\"Belagrande Alegre AC\"] },\n  \"Argentine\": { division: \"Championnat National Argentin\", baseLevel: 68, pool: [\"CA Santaesperanza\",\"Club Santaesperanza\",\"Club Puertoalegre del Valle\",\"CA Villarosa del Valle\",\"Club Puertomartín\",\"Club Nuevarosa del Valle\",\"CA Colonalegre del Valle\",\"CA Santapalma del Valle\",\"CA Sanfuerte del Valle\",\"CA Losesperanza del Valle\",\"CA Sanpalma del Valle\",\"CA Lospalma del Valle\",\"Club Sanfuerte del Valle\",\"CA Puertopalma del Valle\",\"Club Puertoesperanza del Valle\",\"CA Lascruz del Valle\",\"Club Rioalegre del Valle\"] },\n  \"Belgique\": { division: \"Championnat National Belge\", baseLevel: 63, pool: [\"RSC Braineberg\",\"RSC Brainehout\",\"KV Tervauxe\",\"KV Villain\",\"RSC Terhout\",\"RSC Terberg\",\"RSC Terlaine\",\"Union Braineberg\",\"KV Brainelain\",\"RSC Vilhoute\",\"Union Terlaine\",\"KV Wallain\",\"KV Everlain\",\"RSC Villain\",\"KV Braineleze\",\"RSC Tervauxe\",\"Union Vilhoute\"] },\n  \"Maroc\": { division: \"Championnat National Marocain\", baseLevel: 52, pool: [\"Raja OuedchabSultan\",\"AS SidielSultan\",\"Raja AinelKacem\",\"Chabab SidichabAlaoui\",\"AS BabelKacem\",\"Chabab Babzid\",\"Wydad AinelKacem\",\"Wydad DarelKacem\",\"AS OuedchabAlaoui\",\"AS AinelKacem\",\"Wydad BabouanAlaoui\",\"Raja SidielSultan\",\"Raja DarelKacem\",\"Chabab DarelKacem\",\"Raja DarkirAlaoui\",\"Chabab BabzidSultan\",\"Wydad SidiouanMansour\"] },\n  \"Tunisie\": { division: \"Championnat National Tunisien\", baseLevel: 50, pool: [\"US Benzid\",\"AS Bensouk\",\"AS BenmansourEnnour\",\"ES Rasmansour\",\"AS Babkef\",\"AS RaszidEnnour\",\"AS BenjerbaElyes\",\"AS SidimansourEnnour\",\"ES DarjerbaEnnour\",\"ES BenmansourElyes\",\"ES Benzid\",\"ES Babmansour\",\"ES BabkefElyes\",\"AS BensoukElyes\",\"AS Darkef\",\"AS Rasmansour\",\"US Darmansour\"] },\n  \"Algérie\": { division: \"Championnat National Algérien\", baseLevel: 50, pool: [\"JS SouktlemOuled\",\"CR BordjkserChergui\",\"JS SiditlemChergui\",\"CR SidihammaOuled\",\"MC Bordjhamma\",\"USM Souktlem\",\"MC BordjhammaChergui\",\"CR Bordjhamma\",\"JS BordjhammaChergui\",\"CR BenihammaOuled\",\"CR Sididraa\",\"MC BenikserOuled\",\"MC SouktlemOuled\",\"USM BordjtlemOuled\",\"USM SoukhammaChergui\",\"JS Benitlem\",\"CR Ainghir\"] },\n  \"Sénégal\": { division: \"Championnat National Sénégalais\", baseLevel: 45, pool: [\"Jaraaf Kaffrindia\",\"US Diourindiae\",\"ASC Kaolindia\",\"US Kaffrassane\",\"ASC Kaolassanee\",\"US Kaolambonee\",\"US Kaolaroyee\",\"ASC Ndarambone\",\"ASC Thiindiae\",\"ASC Kafframbonee\",\"Jaraaf Diouraroye\",\"ASC Kaolindiae\",\"Jaraaf Diouraroyee\",\"Jaraaf Kaolambonee\",\"ASC Diouraroye\",\"US Kafframbone\",\"ASC Kaolambonee\"] },\n};\n\nlet LEAGUE_TEAMS = [CLUB_NAME, ...NATIONAL_POOL]; \/\/ on démarre désormais en Division Honneur (National)\nlet CLUB_STRENGTH = {\n  \/\/ Division Élite 2026-2027 (base ~62 ± 7)\n  \"ES Lauoisies\":79,\"CA Bereracay\":77,\"US Aubcressin\":75,\"US Cormoubourg\":73,\"EA Chamassonay\":70,\"CA Gartellbourg\":68,\"RC Vaubrégville\":66,\"SC Cormoubourg\":64,\"RC Preveracac\":62,\"Olympique de Vauombreeix\":60,\"AS Laurangville\":58,\"SM Laurangville\":56,\"US Monteracsec\":54,\"SC Briscressville\":51,\"Olympique de Correuilac\":49,\"SC Auburacol\":47,\"SM Chamignolsec\":45,\n  \/\/ Division Excellence 2026-2027 (base ~48 ± 7)\n  \"Stade Valtelland\":65,\"Olympique de Solrangé\":63,\"Racing Montivierx\":61,\"US Solreuilsec\":59,\"US Aubrangsec\":56,\"SC Ferbrégmont\":54,\"AS Montandonsec\":52,\"FC Correuilac\":50,\"Racing Beronvalies\":48,\"US Gartellbourg\":46,\"US Auburacol\":44,\"Olympique de Prevessanol\":42,\"Stade Brisercysec\":40,\"RC Vertellx\":37,\"Olympique de Ferreuilay\":35,\"SC Chamassonay\":33,\"SM Vereraccourt\":31,\n  \/\/ Division Honneur 2026-2027 (ex-National, base ~40 ± 7)\n  \"CA Ferombrein\":57,\"Olympique de Belessyac\":55,\"AS Valtelland\":53,\"ES Cortellé\":51,\"CA Ferignolies\":48,\"SM Briscressville\":46,\"ES Montandonsec\":44,\"FC Brisombreand\":42,\"SC Rouuracay\":40,\"US Valbrégin\":38,\"EA Valmouies\":36,\"FC Beltellville\":34,\"EA Vereraccourt\":32,\"SC Beronvalies\":29,\"ES Brisercysec\":27,\"SM Coriviersec\":25,\"SC Tourombresec\":23\n};\n\/* Enregistre chaque pays étranger comme sa propre \"division\" à plateau unique (pas de montée\/\n   descente, contrairement aux 3 vraies divisions françaises) : niveau de force réparti autour\n   du niveau cible du championnat, jamais deux fois la même clé que les clubs déjà connus. *\/\nObject.entries(FOREIGN_COUNTRIES).forEach(([country, info])=>{\n  DIVISION_NAMES[country] = info.division;\n  DIVISION_POOLS[country] = info.pool;\n  DIVISION_HOME_COUNTRY[country] = country;\n  DIVISION_HOME_CHANCE[country] = 0.5;\n  info.pool.forEach((club,i)=>{\n    if(CLUB_STRENGTH[club]===undefined){\n      const spread = Math.round(((info.pool.length-1)\/2 - i) * (36\/info.pool.length));\n      CLUB_STRENGTH[club] = info.baseLevel + spread;\n    }\n  });\n});\nconst DIVISION_ABOVE = { N2:'N1', N1:'N', N:'L2', L2:'L1', L1:null };\nconst DIVISION_BELOW = { L1:'L2', L2:'N', N:'N1', N1:'N2', N2:null };\nfunction getFinalStandingsRanking(){\n  return LEAGUE_TEAMS.map(name=>({name, ...(standings[name]||{pts:0,bp:0,bc:0})}))\n    .sort((a,b)=> b.pts-a.pts || (b.bp-b.bc)-(a.bp-a.bc) || b.bp-a.bp);\n}\n\/* Détermine, à partir du classement final de la division en cours, la montée\/relégation\n   du club du DS (3 premiers montent, 3 derniers descendent), et renouvelle le plateau\n   des 18 clubs de la division où il évoluera la saison suivante. *\/\n\/* Mémoire persistante : quelle division occupe actuellement chaque club des pools fixes.\n   Indispensable pour que la montée\/relégation reste cohérente d'une saison à l'autre — sans\n   ça, un club relégué par le mécanisme de maintien pouvait \"réapparaître\" dans son ancienne\n   division simplement parce qu'on y reconstruisait le plateau depuis le pool statique complet. *\/\nfunction initClubDivisions(){\n  state.clubDivisions = {};\n  L1_POOL.forEach(n=>state.clubDivisions[n]='L1');\n  L2_POOL.forEach(n=>state.clubDivisions[n]='L2');\n  NATIONAL_POOL.forEach(n=>state.clubDivisions[n]='N');\n  Object.entries(FOREIGN_COUNTRIES).forEach(([country,info])=>{\n    info.pool.forEach(n=>{ state.clubDivisions[n] = country; });\n  });\n}\n\/* S'assure qu'exactement 17 clubs sont actuellement assignés à `division`, en faisant\n   remonter\/descendre des clubs vers les divisions voisines si besoin (jamais en piochant au\n   hasard dans le pool statique tant que l'historique connaît déjà assez de clubs). *\/\nfunction ensureDivisionRoster(division, protectedNames){\n  protectedNames = protectedNames || [];\n  const belowDiv = DIVISION_BELOW[division], aboveDiv = DIVISION_ABOVE[division];\n  let current = Object.keys(state.clubDivisions).filter(n=>state.clubDivisions[n]===division);\n  while(current.length>17){\n    const removable = current.filter(n=>!protectedNames.includes(n));\n    if(!removable.length) break;\n    const out = removable[Math.floor(Math.random()*removable.length)];\n    current = current.filter(n=>n!==out);\n    const dest = Math.random()<0.5 ? (belowDiv||aboveDiv||division) : (aboveDiv||belowDiv||division);\n    state.clubDivisions[out] = dest;\n  }\n  while(current.length<17){\n    const fromBelow = belowDiv ? Object.keys(state.clubDivisions).filter(n=>state.clubDivisions[n]===belowDiv && !protectedNames.includes(n)) : [];\n    const fromAbove = aboveDiv ? Object.keys(state.clubDivisions).filter(n=>state.clubDivisions[n]===aboveDiv && !protectedNames.includes(n)) : [];\n    const pool = [...fromBelow, ...fromAbove];\n    let pick;\n    if(pool.length){ pick = pool[Math.floor(Math.random()*pool.length)]; }\n    else {\n      const staticCandidates = DIVISION_POOLS[division].filter(n=>!current.includes(n) && !protectedNames.includes(n));\n      if(!staticCandidates.length) break;\n      pick = staticCandidates[Math.floor(Math.random()*staticCandidates.length)];\n    }\n    state.clubDivisions[pick] = division;\n    current.push(pick);\n  }\n  return current;\n}\n\/* ============================================================\n   LE PRÉSIDENT — GESTION FINANCIÈRE AUTONOME DU CLUB\n   ============================================================\n   Le président gère seul plusieurs leviers, sans intervention du DS : le DS ne fait qu'observer\n   les décisions et s'adapter. Vérifié une fois par saison, à la bascule de fin de saison. *\/\nfunction processPresidentDecisions(){\n  \/\/ 1) Part des ventes reversée au budget transfert (60\/80\/100%) — change occasionnellement.\n  if(Math.random() < 0.2){\n    const options = [60, 80, 100];\n    const newPct = options[Math.floor(Math.random()*options.length)];\n    if(newPct !== state.presidentSaleSharePct){\n      state.presidentSaleSharePct = newPct;\n      toast(`🏛️ Le président ajuste la part des ventes reversée au budget transfert : désormais ${newPct}%.`);\n    }\n  }\n  \/\/ 2) Amélioration du centre de formation — relève durablement le niveau des jeunes prospects.\n  if(Math.random() < 0.12 && state.academyQualityBonus < 12){\n    state.academyQualityBonus += 2;\n    toast(`🏛️ Le président investit dans le centre de formation : les jeunes prospects seront de meilleure qualité.`);\n  } else if(state.academyQualityBonus > 0 && Math.random() < 0.08){ state.academyQualityBonus -= 2; toast(`🏛️ Faute d'un entretien suffisant, le centre de formation régresse : les prospects seront de moins bonne qualité.`); }\n  \/\/ 3) Amélioration de la cellule de recrutement — réduit la marge d'erreur du scouting.\n  if(Math.random() < 0.12 && state.scoutingErrorMargin > 1){\n    state.scoutingErrorMargin -= 1;\n    toast(`🏛️ Le président modernise la cellule de recrutement : les estimations de niveau sont désormais plus fiables (±${state.scoutingErrorMargin}).`);\n  } else if(state.scoutingErrorMargin < 4 && Math.random() < 0.08){ state.scoutingErrorMargin += 1; toast(`🏛️ Le président néglige la cellule de recrutement : les estimations redeviennent moins fiables (±${state.scoutingErrorMargin}).`); }\n  \/\/ 4) Budget salaires : augmentation ou baisse, décidée indépendamment du DS.\n  if(Math.random() < 0.2){\n    const delta = Math.round(Math.random()*50-18); \/\/ entre -18 et +32 k€\/mois, légèrement biaisé positif\n    if(delta!==0){\n      state.salaryCap = Math.max(30, state.salaryCap + delta);\n      toast(`🏛️ Le président ${delta>0?'augmente':'réduit'} le plafond salarial de ${formatSalaryK(Math.abs(delta))}.`);\n    }\n  }\n  \/\/ 5) Budget transfert : augmentation ou baisse, décidée indépendamment du DS.\n  if(Math.random() < 0.2){\n    const delta = +(Math.random()*1.2-0.4).toFixed(2); \/\/ entre -0.4 et +0.8 M€\n    if(Math.abs(delta)>=0.05){\n      state.transferBudget = Math.max(0, +(state.transferBudget+delta).toFixed(2));\n      toast(`🏛️ Le président ${delta>0?'injecte':'retire'} ${formatValueM(Math.abs(delta))} ${delta>0?'au':'du'} budget transfert.`);\n    }\n  }\n  \/\/ 6) Licenciement du coach en cas de mauvais résultats (fréquence moyenne tous les 3-4 ans).\n  const ranking = getFinalStandingsRanking();\n  const ourRank = ranking.findIndex(t=>t.name===CLUB_NAME)+1;\n  const poorResults = ourRank > ranking.length*0.7;\n  if(poorResults && Math.random() < 0.38){\n    coach = generateCoach();\n    toast(`🏛️ Le président licencie le coach suite aux mauvais résultats de la saison et nomme un remplaçant.`);\n  }\n  \/\/ 7) Agrandissement du stade : coûte de l'argent pendant 3 saisons, puis revenus durables.\n  const st = state.stadiumExpansion;\n  if(st.active){\n    const cost = 0.25;\n    state.transferBudget = Math.max(0, +(state.transferBudget-cost).toFixed(2));\n    st.yearsRemaining--;\n    if(st.yearsRemaining<=0){\n      st.active = false; st.expanded = true;\n      toast(`🏛️ Travaux d'agrandissement du stade terminés ! Les recettes de billetterie augmentent durablement chaque fin de saison.`);\n    } else {\n      toast(`🏗️ Travaux d'agrandissement du stade en cours (encore ${st.yearsRemaining} saison${st.yearsRemaining>1?'s':''}) — coût : ${formatValueM(cost)}.`);\n    }\n  } else if(st.expanded){\n    const bonus = 0.6;\n    state.transferBudget = +(state.transferBudget+bonus).toFixed(2);\n    toast(`🎟️ Recettes de billetterie du stade agrandi : +${formatValueM(bonus)}.`);\n  } else if(Math.random() < 0.06){\n    st.active = true; st.yearsRemaining = 3;\n    toast(`🏛️ Le président lance l'agrandissement du stade : travaux prévus sur 3 saisons.`);\n  }\n}\nfunction handlePromotionRelegation(){\n  const ranking = getFinalStandingsRanking();\n  const top3 = ranking.slice(0,3).map(t=>t.name);\n  const bottom3 = ranking.slice(-3).map(t=>t.name);\n  const ourRank = ranking.findIndex(t=>t.name===CLUB_NAME)+1;\n  const ord = ourRank===1 ? 'er' : 'ème';\n\n  \/\/ Qualification européenne pour la saison prochaine, basée sur ce classement final (change\n  \/\/ donc chaque année en fonction des résultats réels de la saison écoulée). Seule l'élite d'un\n  \/\/ pays dispute les coupes d'Europe : en France, uniquement la Division Élite (jamais L2 ni Division Honneur) ;\n  \/\/ pour un pays étranger, sa division unique fait office d'élite par construction.\n  const isTopFlight = state.division==='L1' || (state.division!=='L2' && state.division!=='N' && !!FOREIGN_COUNTRIES[state.division]);\n  if(!isTopFlight) state.nextSeasonEuroCompetition = null;\n  else if(ourRank>=1 && ourRank<=3) state.nextSeasonEuroCompetition = 'UCL';\n  else if(ourRank>=4 && ourRank<=6) state.nextSeasonEuroCompetition = 'UEL';\n  else state.nextSeasonEuroCompetition = null;\n\n  \/\/ Prime de classement : versée à chaque fin de saison, proportionnelle à la position finale\n  \/\/ (1er = prime maximale, dernier = une fraction résiduelle), calibrée selon le niveau de la\n  \/\/ division (une prime de champion de L1 vaut bien plus qu'une prime de champion de Division Honneur).\n  const rankingPrizeMax = { L1:8, L2:3, N:1, N1:0.6, N2:0.4 }[state.division] ?? (FOREIGN_COUNTRIES[state.division] ? 1.5 : 1);\n  const rankingPrize = +(rankingPrizeMax * (ranking.length-ourRank+1) \/ ranking.length).toFixed(2);\n  state.transferBudget = +(state.transferBudget + rankingPrize).toFixed(2);\n\n  const promotedUp = top3.includes(CLUB_NAME) && DIVISION_ABOVE[state.division];\n  const relegatedDown = bottom3.includes(CLUB_NAME) && DIVISION_BELOW[state.division];\n  const oldDiv = state.division;\n\n  let message;\n  if(promotedUp || relegatedDown){\n    const newDiv = promotedUp ? DIVISION_ABOVE[oldDiv] : DIVISION_BELOW[oldDiv];\n    const others = (promotedUp?top3:bottom3).filter(n=>n!==CLUB_NAME); \/\/ les autres clubs qui bougent avec nous\n    others.forEach(n=>{ state.clubDivisions[n] = newDiv; });\n    ensureDivisionRoster(newDiv, others);\n    let newDivClubs = Object.keys(state.clubDivisions).filter(n=>state.clubDivisions[n]===newDiv);\n    while(newDivClubs.length>17){\n      const removable = newDivClubs.filter(n=>!others.includes(n));\n      if(!removable.length) break;\n      const out = removable[Math.floor(Math.random()*removable.length)];\n      const dest = promotedUp ? DIVISION_BELOW[newDiv] : DIVISION_ABOVE[newDiv];\n      state.clubDivisions[out] = dest || newDiv;\n      newDivClubs = newDivClubs.filter(n=>n!==out);\n    }\n    LEAGUE_TEAMS = [CLUB_NAME, ...newDivClubs.filter(n=>n!==CLUB_NAME)];\n    state.division = newDiv;\n    message = promotedUp\n      ? `🏆 Promotion ! ${CLUB_NAME} termine ${ourRank}${ord} et monte en ${DIVISION_NAMES[newDiv]} la saison prochaine ! Prime de classement : +${formatValueM(rankingPrize)}.`\n      : `⬇️ Relégation... ${CLUB_NAME} termine ${ourRank}${ord} et descend en ${DIVISION_NAMES[newDiv]} la saison prochaine. Prime de classement : +${formatValueM(rankingPrize)}.`;\n    ensureDivisionRoster(oldDiv, newDivClubs); \/\/ notre ancienne division se recomplète, sans piocher dans notre nouveau plateau\n  } else {\n    \/\/ Maintien : les autres montées\/descentes de NOTRE division se règlent normalement, le reste\n    \/\/ du monde (autres divisions) reste inchangé tant qu'on ne les revisite pas.\n    top3.filter(n=>n!==CLUB_NAME).forEach(n=>{ if(DIVISION_ABOVE[state.division]) state.clubDivisions[n]=DIVISION_ABOVE[state.division]; });\n    bottom3.filter(n=>n!==CLUB_NAME).forEach(n=>{ if(DIVISION_BELOW[state.division]) state.clubDivisions[n]=DIVISION_BELOW[state.division]; });\n    ensureDivisionRoster(state.division);\n    const currentDivClubs = Object.keys(state.clubDivisions).filter(n=>state.clubDivisions[n]===state.division);\n    LEAGUE_TEAMS = [CLUB_NAME, ...currentDivClubs.filter(n=>n!==CLUB_NAME)];\n    message = `📊 ${CLUB_NAME} termine ${ourRank}${ord} de ${DIVISION_NAMES[state.division]} et se maintient pour la saison prochaine. Prime de classement : +${formatValueM(rankingPrize)}.`;\n  }\n\n  SCHEDULE = generateRoundRobin(LEAGUE_TEAMS);\n  LEAGUE_TEAMS.forEach(name=>{\n    if(name!==CLUB_NAME && CLUB_STRENGTH[name]===undefined){\n      const base = state.division==='L1' ? 62 : state.division==='N' ? 40 : 48;\n      CLUB_STRENGTH[name] = base + Math.floor(Math.random()*36)-18;\n    }\n  });\n  toast(message);\n}\n\n\/* ============================================================\n   GENERATION PROCEDURALE DES JOUEURS - D1 a D10\n   Certaines rubriques du cahier des charges (D3 Niveau, D5 Nationalite)\n   ne precisaient pas de formule : les choix ci-dessous sont des valeurs\n   par defaut raisonnables, clairement isolees dans des constantes.\n   ============================================================ *\/\n\n\/* ---- D1 : Postes (coefficients d'apparition + adjacence \"limitrophe\") ---- *\/\nconst POSITION_WEIGHTS = { DD:2, DC:1, DG:1, MDC:1, MC:2, MOC:1, MD:0.75, MG:0.75, AiD:1, AiG:1, BU:1 };\nconst POSITION_ADJACENCY = {\n  DG:[\"DC\",\"MG\"], DC:[\"DG\",\"DD\",\"MDC\"], DD:[\"DC\",\"MD\"],\n  MG:[\"DG\",\"MDC\",\"AiG\"], MDC:[\"DC\",\"MG\",\"MC\",\"MD\"], MC:[\"MDC\",\"MOC\",\"MG\",\"MD\"], MD:[\"DD\",\"MDC\",\"AiD\"],\n  MOC:[\"MC\",\"AiG\",\"AiD\",\"BU\"], AiG:[\"MG\",\"MOC\",\"BU\"], AiD:[\"MD\",\"MOC\",\"BU\"], BU:[\"MOC\",\"AiG\",\"AiD\"]\n};\nfunction weightedPick(weightsObj){\n  const entries = Object.entries(weightsObj);\n  const total = entries.reduce((s,e)=>s+e[1],0);\n  let r = Math.random()*total;\n  for(const e of entries){ r-=e[1]; if(r<=0) return e[0]; }\n  return entries[entries.length-1][0];\n}\nfunction generatePositionsFrom(initialPos){\n  if(initialPos===\"GB\") return { pos:\"GB\", mainPos:[\"GB\"], sec:[] };\n  let mainPos=[initialPos];\n  while(Math.random()<0.25){\n    const cand=new Set();\n    mainPos.forEach(p=>(POSITION_ADJACENCY[p]||[]).forEach(a=>{ if(!mainPos.includes(a)) cand.add(a); }));\n    if(cand.size===0) break;\n    const arr=[...cand]; mainPos.push(arr[Math.floor(Math.random()*arr.length)]);\n  }\n  let sec=[];\n  if(Math.random()>=0.5){\n    do{\n      const owned=[...mainPos,...sec];\n      const cand=new Set();\n      owned.forEach(p=>(POSITION_ADJACENCY[p]||[]).forEach(a=>{ if(!owned.includes(a)) cand.add(a); }));\n      if(cand.size===0) break;\n      const arr=[...cand]; sec.push(arr[Math.floor(Math.random()*arr.length)]);\n    }while(Math.random()<0.5);\n  }\n  return { pos:mainPos[0], mainPos, sec };\n}\nfunction generatePositions(forceGB){\n  if(forceGB) return { pos:\"GB\", mainPos:[\"GB\"], sec:[] };\n  return generatePositionsFrom(weightedPick(POSITION_WEIGHTS));\n}\n\n\/* ---- D2 : Age & retraite ---- *\/\nfunction generateAge(isYouth){ return isYouth ? 15+Math.floor(Math.random()*4) : 18+Math.floor(Math.random()*20); }\nfunction generateRetirementAge(pos){ return pos===\"GB\" ? 37+Math.floor(Math.random()*6) : 34+Math.floor(Math.random()*6); }\n\n\/* ---- D3\/D4 : Niveau, Potentiel, Vrai Potentiel (potentiel max atteint a 29 ans) ---- *\/\n\/* Niveau de référence (plafond) d'une division : calibré sur les valeurs de CLUB_STRENGTH de\n   chaque division, pour que l'effectif généré corresponde réellement au niveau du championnat. *\/\nfunction divisionLevelCeiling(division){\n  if(division==='L1') return 69;\n  if(division==='L2') return 55;\n  if(division==='N') return 47; if(division==='N1') return 40; if(division==='N2') return 34;\n  if(FOREIGN_COUNTRIES[division]) return FOREIGN_COUNTRIES[division].baseLevel + 8;\n  return 60; \/\/ repli par défaut\n}\nfunction generatePotentialAndLevel(age, adnNames, ceiling){\n  ceiling = ceiling || 60;\n  const floor = Math.max(25, ceiling-20);\n  const potential = clamp(Math.round(floor+6+Math.random()*(ceiling-floor-6)), floor, ceiling); \/\/ la plupart entre floor+6 et ceiling\n  let truePotential = clamp(Math.round(potential - Math.random()*(potential-floor)*0.35), floor, potential);\n  if(adnNames && adnNames.includes('Fainéant')) truePotential = Math.round(floor*0.85+truePotential*0.15);\n  if(adnNames && adnNames.includes('Bosseur')) truePotential = Math.round(truePotential*0.15+potential*0.85);\n  const factor = age<=24 ? (0.78 + (Math.min(age,24)-16)\/8*0.22) : Math.max(0.75, 0.98-(age-24)*0.015);\n  const level = clamp(Math.round(truePotential*clamp(factor,0.75,1) + (Math.random()*6-3)), floor-2, Math.min(ceiling, truePotential));\n  return { potential, truePotential, level };\n}\n\n\/* ---- D5 : Nationalite (pool non specifie dans le cahier des charges) ---- *\/\nconst NATIONALITY_POOL = [\"France\",\"France\",\"France\",\"France\",\"France\",\"Portugal\",\"Algérie\",\"Maroc\",\"Tunisie\",\"Sénégal\",\"Mali\",\"Côte d'Ivoire\",\"Cameroun\",\"Italie\",\"Espagne\",\"Belgique\",\"Pays-Bas\",\"Nigéria\",\"RD Congo\",\"Brésil\",\"Argentine\",\"Suède\",\"Guinée\",\"Angleterre\",\"Allemagne\",\"Suisse\"];\n\/* Probabilité qu'un joueur soit \"du pays\" de sa division, et pays concerné (extensible : d'autres\n   pays de division pourront s'ajouter plus tard, pour l'instant tout est en France). *\/\nfunction generateNationality(division){\n  if(!division) return NATIONALITY_POOL[Math.floor(Math.random()*NATIONALITY_POOL.length)]; \/\/ comportement par défaut (ex. coach)\n  const homeChance = DIVISION_HOME_CHANCE[division]!==undefined ? DIVISION_HOME_CHANCE[division] : 0.5;\n  const homeCountry = DIVISION_HOME_COUNTRY[division] || \"France\";\n  if(Math.random() < homeChance) return homeCountry;\n  const foreignPool = NATIONALITY_POOL.filter(n=>n!==homeCountry);\n  return foreignPool[Math.floor(Math.random()*foreignPool.length)];\n}\nconst NATION_FLAGS = {\n  \"France\":\"🇫🇷\",\"Portugal\":\"🇵🇹\",\"Algérie\":\"🇩🇿\",\"Maroc\":\"🇲🇦\",\"Tunisie\":\"🇹🇳\",\"Sénégal\":\"🇸🇳\",\"Mali\":\"🇲🇱\",\n  \"Côte d'Ivoire\":\"🇨🇮\",\"Cameroun\":\"🇨🇲\",\"Italie\":\"🇮🇹\",\"Espagne\":\"🇪🇸\",\"Belgique\":\"🇧🇪\",\"Pays-Bas\":\"🇳🇱\",\n  \"Nigéria\":\"🇳🇬\",\"RD Congo\":\"🇨🇩\",\"Brésil\":\"🇧🇷\",\"Argentine\":\"🇦🇷\",\"Suède\":\"🇸🇪\",\"Guinée\":\"🇬🇳\",\n  \"Allemagne\":\"🇩🇪\",\"Angleterre\":\"🏴\",\"Ghana\":\"🇬🇭\",\"Suisse\":\"🇨🇭\"\n};\nfunction nationFlag(nat){\n  const first = (nat||\"\").split('\/')[0].trim();\n  return NATION_FLAGS[first] || \"🏳️\";\n}\n\n\/* ---- D6 : Valeur & D7 : Salaire ---- *\/\nconst VALUE_SCALE = 0.005;   \/\/ constante d'échelle, recalibrée pour la formule exponentielle\nconst VALUE_EXP_RATE = 0.1;  \/\/ taux de croissance exponentiel par point de niveau\nconst SALARY_SCALE = 0.22;\n\/* D6 : Valeur — croissance EXPONENTIELLE selon le niveau (pas seulement au cube) : chaque point\n   de niveau supplémentaire multiplie la valeur par un même facteur (e^0,1 ≈ +10,5%), donc l'écart\n   de prix entre un bon joueur et un joueur d'élite explose au lieu de simplement grandir. Intègre\n   aussi le Potentiel AFFICHÉ (pas le Vrai Potentiel caché) : un jeune prometteur avec une marge de\n   progression visible vaut une prime, comme sur le vrai marché des transferts. Formule de base :\n   V = e^(0,1 x N) x max(0,1 ; (35-A)\/10) x [1 + 0,03 x (P-N)] x VALUE_SCALE\n   Repères (âge 24, potentiel = niveau) : N=40 -> ~0,27 M€ | N=60 -> ~2,0 M€ | N=80 -> ~14,9 M€ | N=99 -> ~99,6 M€\n\n   Au-dessus de cette base, une VARIATION vient faire monter ou baisser la valeur, uniquement pour\n   un joueur déjà dans l'effectif (stats et contrat fournis — un candidat scouté n'a pas encore\n   d'historique chez nous, donc reste sur la valeur de base) :\n   1) Performance (stats de la saison) : une bonne note moyenne et une bonne contribution\n      offensive (buts + passes par match) font monter la valeur ; une mauvaise saison la fait\n      baisser.\n        FacteurPerformance = [1 + 0,04 x (NoteMoyenne - 6)] x [1 + min(0,3 ; (Buts+Passes)\/Matchs x 0,4)]\n   2) Nombre de matchs joués (cette saison) : un joueur peu utilisé reste une valeur incertaine\n      (léger malus), un joueur qui a fait ses preuves sur beaucoup de matchs inspire confiance\n      (léger bonus, plafonné).\n        FacteurExpérience = clamp(0,9 + 0,004 x Matchs ; 0,9 ; 1,15)\n   3) Années de contrat restantes : plus la fin de contrat approche, moins le club vendeur a de\n      pouvoir de négociation (le joueur pourrait partir libre) — la valeur chute nettement ; à\n      l'inverse, un contrat long donne au club tout loisir d'exiger un gros chèque.\n        FacteurContrat = 0,6 (≤1 an) | 0,8 (2 ans) | 0,95 (3 ans) | 1,1 (4 ans et +)\n   V_finale = V x FacteurPerformance x FacteurExpérience x FacteurContrat *\/\n\/* ============================================================\n   FORMATAGE MONÉTAIRE UNIFORME (3 chiffres significatifs)\n   ============================================================\n   < 1 000 €      : entier + €          (ex. 800€)\n   1 000-99 999 € : 1 décimale + k€     (ex. 1,8k€ \/ 21,8k€)\n   100 000-999 999 € : entier + k€      (ex. 521k€)\n   1 M-99,9 M €   : 1 décimale + M      (ex. 1,5M \/ 11,5M)\n   ≥ 100 M €      : entier + M          (ex. 111M) *\/\nfunction formatMoney(amountInEuros){\n  const n = Math.max(0, amountInEuros); const trimZero = (s) => isMobileViewport() ? s.replace(',0','') : s;\n  if(n < 1000) return Math.round(n)+'€';\n  if(n < 100000) return trimZero((n\/1000).toFixed(1).replace('.',','))+'k€';\n  if(n < 1000000) return Math.round(n\/1000)+'k€';\n  if(n < 100000000) return trimZero((n\/1000000).toFixed(1).replace('.',','))+'M';\n  return Math.round(n\/1000000)+'M';\n}\nfunction formatSalaryDisplay(kAmount){ return formatSalaryK(kAmount) + (isMobileViewport() ? '' : '\/mois'); } function formatSalaryK(kAmount){ return formatMoney((kAmount||0)*1000); } \/\/ p.salary est stocké en k€\nfunction formatValueM(mAmount){ return formatMoney((mAmount||0)*1000000); } \/\/ valeurs\/prix stockés en M€\nfunction playerValue(level, age, potential, stats, years){\n  const pot = potential!==undefined ? potential : level; \/\/ repli neutre si le potentiel n'est pas fourni\n  const potentialBonus = 1 + 0.03 * Math.max(0, pot-level);\n  let variation = 1;\n  if(stats){\n    const avgNote = stats.noteCount ? stats.noteSum\/stats.noteCount : 6; \/\/ 6\/10 = neutre si pas encore noté\n    const outputPerMatch = stats.m>0 ? (stats.g+stats.a)\/stats.m : 0;\n    const performanceFactor = (1 + 0.04*(avgNote-6)) * (1 + Math.min(0.3, outputPerMatch*0.4));\n    const experienceFactor = clamp(0.9 + 0.004*stats.m, 0.9, 1.15);\n    variation *= performanceFactor * experienceFactor;\n  }\n  if(years!==undefined){\n    const contractFactor = years<=1 ? 0.6 : years===2 ? 0.8 : years===3 ? 0.95 : 1.1;\n    variation *= contractFactor;\n  }\n  return +((Math.exp(VALUE_EXP_RATE*level) * Math.max(0.1,(35-age)\/10) * potentialBonus * variation) * VALUE_SCALE).toFixed(2);\n}\n\/* Niveau maximal (donc valeur maximale) accessible au scouting, en fonction du budget transfert\n   disponible : plus le budget est élevé, plus le marché propose des joueurs chers et de haut\n   niveau. Le plafond de valeur visé est budget x 1,1 (ex. 2 M€ -> jusqu'à 2,2 M€ ; 10 M€ ->\n   jusqu'à 11 M€), inversé via la formule de valeur exponentielle pour un âge de référence proche\n   du pic (24 ans) : N = ln(V \/ (VALUE_SCALE x ageMult)) \/ VALUE_EXP_RATE *\/\n\/* Un club mal classé attire moins les bons joueurs : réduit le plafond de niveau accessible au\n   scouting jusqu'à -15% pour le dernier de la ligue (aucune réduction pour le premier, ni tant\n   que le championnat n'a pas encore commencé). *\/\nfunction computeRankingScoutFactor(){\n  try{\n    if(!LEAGUE_TEAMS || !LEAGUE_TEAMS.length || !standings[CLUB_NAME]) return 1;\n  const totalMatches = LEAGUE_TEAMS.reduce((s,n)=>s+((standings[n]&&standings[n].j)||0),0);\n  if(totalMatches===0) return 1; \/\/ championnat pas encore commencé : aucun classement significatif\n  const ranking = LEAGUE_TEAMS.slice().sort((a,b)=>((standings[b]&&standings[b].pts)||0)-((standings[a]&&standings[a].pts)||0));\n  const ourRank = ranking.indexOf(CLUB_NAME)+1;\n  const total = ranking.length;\n  if(total<=1) return 1;\n  const relativePos = (ourRank-1)\/(total-1); \/\/ 0 = premier, 1 = dernier\n  return 1 - relativePos*0.15;\n  }catch(e){ return 1; } \/\/ variables pas encore initialisées (ex. avant le tout premier choix de club)\n}\nfunction budgetLevelCeiling(){\n  const maxValue = Math.max(0.15, state.transferBudget * 1.1);\n  const refAge = 24;\n  const ageMult = Math.max(0.1, (35-refAge)\/10);\n  const ratio = maxValue \/ (VALUE_SCALE * ageMult);\n  return Math.max(20, Math.log(ratio) \/ VALUE_EXP_RATE); \/\/ théorique, non plafonné (le plafonnage du niveau de jeu se fait séparément)\n}\nfunction playerSalaryK(level, age){\n  const Ma = age<32 ? age\/25 : (32\/25)*(1-(age-32)*0.05);\n  \/\/ Composante linéaire ajoutée à la croissance cubique (au lieu d'un plancher brut) : évite\n  \/\/ que plusieurs niveaux distincts, une fois arrondis, ne s'écrasent tous sur la même valeur\n  \/\/ plancher — en particulier chez les jeunes joueurs à faible niveau.\n  const raw = (Math.pow(level\/20,3)*2 + level*0.15) * Ma * SALARY_SCALE;\n  return Math.max(1, Math.round(raw));\n}\n\n\/* ---- D10 : ADN visible \/ invisible ---- *\/\nconst VISIBLE_ADN = { Rapide:0.12, Lent:0.08, Grand:0.12, Petit:0.10 };\nconst VISIBLE_PAIRS = [[\"Grand\",\"Petit\"],[\"Lent\",\"Rapide\"]];\nconst INVISIBLE_ADN = { Rugueux:0.08, Vista:0.08, Technique:0.08, Endurant:0.08, Prolifique:0.08, \"Tireur de CPA\":0.08, Physique:0.08, Fragile:0.06, Solide:0.06, Leader:0.08, \"Fainéant\":0.06, Bosseur:0.06, \"Irrégulier\":0.06, Sanguin:0.08, Polyvalent:0.08, \"Chouchou du coach\":0.06, Mentor:0.06, \"Joueur de l'ombre\":0.06, \"Fort contre les forts\":0.06, \"Fort contre les faibles\":0.06 , \"Déconcentré\":0.06 };\nconst INVISIBLE_PAIRS = [[\"Fragile\",\"Solide\"],[\"Fainéant\",\"Bosseur\"],[\"Fort contre les faibles\",\"Fort contre les forts\"]];\nfunction rollADNSet(pool, pairs){\n  let chosen = Object.entries(pool).filter(e=>Math.random()<e[1]).map(e=>e[0]);\n  pairs.forEach(pair=>{\n    if(chosen.includes(pair[0]) && chosen.includes(pair[1])){\n      const toRemove = Math.random()<0.5 ? pair[1] : pair[0];\n      chosen = chosen.filter(x=>x!==toRemove);\n    }\n  });\n  return chosen;\n}\nfunction generateADN(){\n  const visible = rollADNSet(VISIBLE_ADN, VISIBLE_PAIRS);\n  const hidden = rollADNSet(INVISIBLE_ADN, INVISIBLE_PAIRS).map(name=>({name, revealed:false}));\n  return { visible, hidden };\n}\nfunction knownADN(p){ return [...p.adnVisible, ...p.adnHidden.filter(h=>h.revealed).map(h=>h.name)]; }\nfunction actualADN(p){ return [...p.adnVisible, ...p.adnHidden.map(h=>h.name)]; } \/\/ ADN réel, y compris non révélé (effets cachés du coach)\n\/* ADN Mentor (D10) : chaque porteur (ADN réel, révélé ou non) est lié à un jeune du club (−21\n   ans) tiré au sort. Le mentoré reçoit une fois +10 Potentiel\/+10 Vrai Potentiel ; sa progression\n   est accélérée de 50% (cf. scheduleSeasonProgression). Si le mentoré dépasse 20 ans ou quitte le\n   club, le mentor se voit attribuer un nouveau mentoré. Appelée à chaque bascule de saison, une\n   fois l'effectif de la saison à venir stabilisé (cf. simulerSaison). *\/\nfunction maintainMentorLinks(){\n  players.forEach(mentor=>{\n    if(!actualADN(mentor).includes('Mentor')){ mentor.menteeId = null; return; }\n    let mentee = mentor.menteeId ? players.find(q=>q.id===mentor.menteeId) : null;\n    if(mentee && mentee.age>20) mentee = null;\n    if(!mentee){\n      const takenIds = new Set(players.filter(m=>m.menteeId && m.id!==mentor.id).map(m=>m.menteeId));\n      let candidates = players.filter(q=>q.id!==mentor.id && q.age<21 && !takenIds.has(q.id));\n      if(!candidates.length) candidates = players.filter(q=>q.id!==mentor.id && q.age<21);\n      if(candidates.length){\n        const chosen = candidates[Math.floor(Math.random()*candidates.length)];\n        mentor.menteeId = chosen.id;\n        chosen.pot = Math.min(99, Math.round(chosen.pot+10));\n        chosen.truePot = Math.min(chosen.pot, Math.round(chosen.truePot+10));\n      } else {\n        mentor.menteeId = null;\n      }\n    }\n  });\n}\n\n\/* ============================================================\n   H - LES BLESSURES\n   ============================================================ *\/\n\/* H1 : formule de risque, identique pour l'entraînement et le match (seul le déclencheur change) *\/\nfunction injuryAgeMult(age){ return age<29 ? 1.0 : 1.0 + ((age-29)\/10); }\nfunction injuryAdnMult(p){\n  const adn = actualADN(p); \/\/ effet caché, s'applique même si l'ADN n'est pas révélé\n  if(adn.includes('Fragile')) return 1.8;\n  if(adn.includes('Solide')) return 0.2;\n  return 1;\n}\nfunction injuryProbability(p){ return 0.01 * injuryAgeMult(p.age) * injuryAdnMult(p); }\n\n\/* H2 : la roue de l'infirmerie — 4 paliers de gravité pondérés *\/\nconst INJURY_TIERS = [\n  {tier:1, icon:'🩹', label:'Micro-blessure', desc:'Coup, fatigue musculaire.', chance:0.60, minWeeks:1, maxWeeks:2},\n  {tier:2, icon:'🚑', label:'Blessure moyenne', desc:'Entorse, élongation.', chance:0.25, minWeeks:3, maxWeeks:5},\n  {tier:3, icon:'🏥', label:'Blessure grave', desc:'Déchirure, fracture de fatigue.', chance:0.12, minWeeks:8, maxWeeks:16},\n  {tier:4, icon:'💀', label:'Fin de saison', desc:'Rupture des ligaments croisés.', chance:0.03, minWeeks:26, maxWeeks:39}\n];\nfunction rollInjuryTier(){\n  const total = INJURY_TIERS.reduce((s,t)=>s+t.chance,0);\n  let r = Math.random()*total;\n  for(const t of INJURY_TIERS){ r-=t.chance; if(r<=0) return t; }\n  return INJURY_TIERS[INJURY_TIERS.length-1];\n}\n\/* H3 : déclenche une blessure sur un joueur sain ; renvoie {tier, weeks} ou null *\/\nfunction tryInjure(p){\n  if(p.injuryWeeksLeft>0) return null; \/\/ déjà blessé\n  if(Math.random() >= injuryProbability(p)) return null;\n  const tier = rollInjuryTier();\n  const weeks = tier.minWeeks + Math.floor(Math.random()*(tier.maxWeeks-tier.minWeeks+1));\n  p.injuryWeeksLeft = weeks;\n  p.injuryTier = tier;\n  p.injuryWeeksTotal = weeks; \/\/ durée totale d'origine, conservée pour le seuil d'alerte au retour\n  return {tier, weeks};\n}\nfunction injuryIconHTML(p){\n  if(!p.injuryWeeksLeft || !p.injuryTier) return '';\n  return ` <span title=\"${p.injuryTier.label} — ${p.injuryWeeksLeft} semaine(s) restante(s)\">${p.injuryTier.icon}<\/span>`;\n}\n\/* S - Capitanat : symbole de brassard à côté du nom du capitaine officiel du club. *\/\nfunction captainIconHTML(p){\n  if(state.captainId && p.id===state.captainId) return ' <span title=\"Capitaine\" style=\"font-size:12px;\">🎖️<\/span>';\n  return '';\n}\n\/* Badge visuel pour un joueur en prêt, afin de le distinguer clairement d'un joueur possédé. *\/\nfunction loanIconHTML(p){\n  if(!p.isLoan) return '';\n  return ` <span class=\"badge locked\" title=\"En prêt${p.loanClub?' de '+p.loanClub:''}\" style=\"font-size:10px;\">PRÊT<\/span>`;\n}\n\/* Fait avancer les blessures en cours d'une semaine, puis tente de nouvelles blessures.\n   isMatchWeek + startersWhoPlayed : applique en plus le risque \"match\" (H1) à ceux qui ont joué. *\/\n\/* ============================================================\n   I - LA FORME\n   ============================================================ *\/\n\/* I1 : malus de retour de blessure (décroît d'1 point chaque semaine, jusqu'à 0) —\n   stocké sur p.i1Malus, initialisé à -tier au moment de la reprise (cf. processWeeklyInjuries).\n   I3 : malus d'intégration dans l'équipe (démarre à -2 à l'arrivée, 1 chance sur 2 par semaine\n   de remonter d'1 point, jusqu'à 0) — stocké sur p.i3Malus. *\/\n\/* Cumule chaque semaine la part du salaire mensuel non utilisée (salaryCap - masse salariale\n   actuelle), pour l'ajouter au budget transfert en fin de saison (12 mois cumulés sur l'année). *\/\nfunction processWeeklyUnusedSalary(){\n  const monthlyMargin = Math.max(0, salaryCapRemaining()); \/\/ k€ \/ mois, scouts compris comme partout ailleurs\n  state.unusedSalaryAccum += monthlyMargin * (12\/52); \/\/ conversion en équivalent hebdomadaire sur l'année\n}\nfunction processWeeklyForm(){\n  players.forEach(p=>{\n    if(p.i1Malus===undefined) p.i1Malus = 0;\n    if(p.i1Malus<0) p.i1Malus = Math.min(0, p.i1Malus+1);\n    if(p.i3Malus===undefined) p.i3Malus = 0;\n    if(p.i3Malus<0 && Math.random()<0.5) p.i3Malus = Math.min(0, p.i3Malus+1);\n  });\n}\n\/* I2 : forme de l'équipe (-2 à +2), basée sur les résultats récents (même historique pondéré que D8) *\/\nfunction computeTeamFormI2(){\n  const score = computeResultsScore(); \/\/ 0-100\n  if(score<20) return -2;\n  if(score<40) return -1;\n  if(score<60) return 0;\n  if(score<80) return 1;\n  return 2;\n}\n\/* I4 : effet du moral (D8) sur la forme (-2 à +2) *\/\nfunction computeI4(moral){\n  if(moral<25) return -2;\n  if(moral<40) return -1;\n  if(moral<60) return 0;\n  if(moral<=80) return 1;\n  return 2;\n}\nfunction processWeeklyInjuries(startersWhoPlayed){\n  const newInjuries = [];\n  \/\/ 1) les blessures en cours avancent d'une semaine\n  players.forEach(p=>{\n    if(p.injuryWeeksLeft>0){\n      p.injuryWeeksLeft--;\n      if(p.injuryWeeksLeft<=0){\n        const recoveredTier = p.injuryTier;\n        const recoveredWeeksTotal = p.injuryWeeksTotal;\n        p.injuryWeeksLeft=0; p.injuryTier=null; p.injuryWeeksTotal=0;\n        p.i1Malus = -recoveredTier.tier; \/\/ I1 : malus de retour de blessure, décroissant ensuite semaine après semaine\n        newInjuries.push({player:p, recovered:true, recoveredTier, recoveredWeeksTotal});\n      }\n    }\n  });\n  \/\/ 2) risque \"entraînement\" pour tout l'effectif sain\n  players.forEach(p=>{\n    if(p.injuryWeeksLeft>0) return;\n    const res = tryInjure(p);\n    if(res) newInjuries.push({player:p, tier:res.tier, weeks:res.weeks});\n  });\n  \/\/ 3) risque \"match\" additionnel pour les titulaires qui ont joué\n  if(startersWhoPlayed){\n    startersWhoPlayed.forEach(p=>{\n      if(p.injuryWeeksLeft>0) return;\n      const res = tryInjure(p);\n      if(res) newInjuries.push({player:p, tier:res.tier, weeks:res.weeks});\n    });\n  }\n  \/\/ Notifications échelonnées (icône + durée d'indisponibilité)\n  let delay = 700;\n  newInjuries.forEach(n=>{\n    const totalWeeks = n.recovered ? n.recoveredWeeksTotal : n.weeks;\n    if(totalWeeks < 10) return; \/\/ pas d'alerte pour une blessure de moins de 10 semaines\n    setTimeout(()=>{\n      if(n.recovered){\n        toastPlayer(`Est de retour de blessure et redevient sélectionnable.`, n.player, '✅');\n      } else {\n        toastPlayer(`Se blesse — ${n.tier.label} : indisponible ${n.weeks} semaine(s).`, n.player, n.tier.icon);\n      }\n    }, delay);\n    delay += 1400;\n  });\n  if(newInjuries.length){\n    \/\/ le rafraîchissement des vues est déjà assuré par l'appelant (endMatch \/ advanceWeek)\n  }\n  fillEmptyPositionGaps(delay); \/\/ appelle un jeune du centre de formation si un poste ne peut plus être comblé\n}\n\/* Repère, pour la meilleure tactique connue du coach, les postes qu'aucun joueur sain ne peut\n   plus occuper (ex : tous les gardiens blessés) et fait monter un jeune du centre de formation\n   (16 ou 17 ans, niveau très bas) pour combler chaque poste vide. *\/\nfunction fillEmptyPositionGaps(startDelay){\n  \/\/ 1) Le coach essaie d'abord TOUTES ses tactiques connues (principales ET secondaires) :\n  \/\/    si l'une d'elles reste jouable avec l'effectif sain actuel, aucun jeune n'est nécessaire.\n  const candidates = [...coach.primaryTactiques, ...coach.secondaryTactiques];\n  let anyFeasible = false;\n  for(const fam of candidates){\n    for(const v of Object.keys(TACTIQUES[fam].variants)){\n      const shape = buildShape(fam, v);\n      if(assignStartersToShape(players, shape.flat).feasible){ anyFeasible = true; break; }\n    }\n    if(anyFeasible) break;\n  }\n  if(anyFeasible) return [];\n\n  \/\/ 2) Aucune tactique connue (même secondaire) n'est jouable : on comble les postes vides\n  \/\/    de la tactique principale en faisant monter un jeune du centre de formation.\n  const family = coach.primaryTactiques[0];\n  const variantName = Object.keys(TACTIQUES[family].variants)[0];\n  const shape = buildShape(family, variantName);\n  const added = [];\n  shape.flat.forEach(slotPos=>{\n    const hasCandidate = players.some(p=>p.injuryWeeksLeft===0 && fitScore(p, slotPos) > -Infinity);\n    if(!hasCandidate){\n      const youth = generatePlayer({isYouth:true, forcePos: slotPos==='GB'?undefined:slotPos, forceGB: slotPos==='GB', division:state.division});\n      youth.age = 16 + Math.floor(Math.random()*2); \/\/ 16 ou 17 ans\n      youth.level = clamp(15 + Math.floor(Math.random()*8), 10, youth.truePot); \/\/ niveau très bas\n      youth.salary = playerSalaryK(youth.level, youth.age);\n      youth.retirementAge = generateRetirementAge(youth.pos);\n      players.push(youth);\n      added.push(youth);\n    }\n  });\n  if(added.length){\n    let delay = (startDelay||700);\n    added.forEach(y=>{\n      setTimeout(()=>toastPlayer(`Poste vide, aucun joueur disponible : monte du centre de formation !`, y, '🌱'), delay);\n      delay += 1400;\n    });\n  }\n  return added;\n}\n\n\n\/* ---- Noms & axes de progression ---- *\/\nconst FIRST_NAMES = [\"Lucas\",\"Enzo\",\"Yanis\",\"Karim\",\"Baptiste\",\"Théo\",\"Maxime\",\"Noa\",\"Yannick\",\"Sofiane\",\"Adrien\",\"Junior\",\"Hugo\",\"Anthony\",\"Rayan\",\"Jonas\",\"Marco\",\"Mathis\",\"Nathan\",\"Léo\",\"Amir\",\"Bilal\",\"Kylian\",\"Rayane\",\"Ismaël\",\"Diego\",\"Sacha\",\"Ilyes\",\"Younes\",\"Malik\",\"Paul\",\"Idris\"]; \/\/ secours pour les nationalités sans banque dédiée\nconst LAST_NAMES = [\"Ferreira\",\"Picard\",\"Traoré\",\"Belaïd\",\"Créac'h\",\"Vasseur\",\"Ferrand\",\"Kacem\",\"Obi\",\"Rahmani\",\"Salou\",\"Marchetti\",\"Mbemba\",\"Lindqvist\",\"Roux\",\"Bertin\",\"Diakité\",\"Guarneri\",\"Cissé\",\"Weber\",\"Bellandi\",\"Da Silva\",\"N'Guessan\",\"Camara\",\"Benali\",\"Petit\",\"Lemoine\",\"Aubert\",\"Nkoulou\",\"Costa\",\"Diallo\",\"Perrin\"]; \/\/ secours pour les nationalités sans banque dédiée\n\/* Banque de noms réalistes par nationalité (issue de la base Google Sheets \"BDD NOMS + PRENOMS\"),\n   noms de famille et prénoms dédupliqués, listes complètes (pas de plafond). Tirage au sort\n   indépendant parmi TOUS les prénoms puis TOUS les noms de famille — aucun lien entre eux. *\/\nconst NAME_BANK = {\n  \"France\": { surnames: [\"Abadie\",\"Abanda\",\"Abdallah\",\"Abella\",\"Abidi\",\"Aboubakar\",\"Acosta\",\"Adam\",\"Adamou\",\"Adjei\",\"Adriano\",\"Afonso\",\"Agostini\",\"Akli\",\"Albertini\",\"Alcaraz\",\"Allain\",\"Allard\",\"Almeida\",\"Alves\",\"Amara\",\"Amaral\",\"Ambrosio\",\"Amrani\",\"Andrade\",\"Andreani\",\"Andreu\",\"André\",\"Angeli\",\"Antunes\",\"Aouar\",\"Aranda\",\"Arfaoui\",\"Armand\",\"Arnaud\",\"Arnaudon\",\"Arrighi\",\"Assane\",\"Atangana\",\"Aubert\",\"Aubin\",\"Aubry\",\"Azzouz\",\"Aït-Ali\",\"Aït-Mohamed\",\"Babacar\",\"Bakayoko\",\"Bamba\",\"Baraka\",\"Barbe\",\"Barbeau\",\"Barbet\",\"Barbier\",\"Baron\",\"Baroni\",\"Barre\",\"Barré\",\"Barthez\",\"Barès\",\"Basset\",\"Batista\",\"Battaglia\",\"Baudry\",\"Bayle\",\"Bayo\",\"Bazin\",\"Beaudoin\",\"Beaumont\",\"Bechet\",\"Belhanda\",\"Belkacem\",\"Bellanger\",\"Bellini\",\"Ben Ali\",\"Ben Amar\",\"Ben Brahim\",\"Ben Cheikh\",\"Ben Haddou\",\"Ben Salem\",\"Ben Saïd\",\"Benali\",\"Benamar\",\"Benard\",\"Benatia\",\"Bencheikh\",\"Benitez\",\"Benkacem\",\"Benoist\",\"Benoît\",\"Bensaïd\",\"Bentahar\",\"Benyahia\",\"Berardi\",\"Berger\",\"Bernard\",\"Bernardini\",\"Bernier\",\"Berthelot\",\"Bertin\",\"Bertoni\",\"Bertrand\",\"Besnard\",\"Besson\",\"Beugnet\",\"Bianchi\",\"Bianco\",\"Binet\",\"Bissouma\",\"Blanc\",\"Blanchard\",\"Blayac\",\"Blin\",\"Boga\",\"Boivin\",\"Bonhomme\",\"Bonilla\",\"Bonnet\",\"Bonneton\",\"Bonnety\",\"Borges\",\"Bosquet\",\"Bouafia\",\"Bouazza\",\"Boucher\",\"Bouchet\",\"Boudjemaa\",\"Boufal\",\"Boukary\",\"Boulanger\",\"Boumediene\",\"Bounedjah\",\"Boura\",\"Bourdin\",\"Bourgeois\",\"Bourhis\",\"Boyamba\",\"Boyer\",\"Brahimi\",\"Braithwaite\",\"Brandão\",\"Breton\",\"Briand\",\"Brice\",\"Brisset\",\"Brière\",\"Brochard\",\"Brun\",\"Bruneau\"
