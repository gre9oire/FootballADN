1); \/\/ aligné sur les tranches de 100k€\n  if(amount < 0.1){ toast('Montant minimum de conversion : 100k€.'); return; }\n  if(amount > state.transferBudget + 0.001){ toast('Montant supérieur au budget transfert disponible.'); return; }\n  const gain = Math.round(amount*70);\n  state.transferBudget = +(state.transferBudget - amount).toFixed(2);\n  state.salaryCap += gain;\n  range.value = 0;\n  toast(`💱 ${formatValueM(amount)} de budget transfert convertis en +${gain} k€\/mois de plafond salarial, de façon permanente.`);\n  renderRecrutHeader();\n}\n\/* Affiche\/masque les panneaux de conversion (un seul visible à la fois), cachés par défaut pour\n   ne pas encombrer la page Recrutement. *\/\nfunction toggleConvertPanel(which){\n  const toSalary = document.getElementById('convertPanelToSalary');\n  const toTransfer = document.getElementById('convertPanelToTransfer');\n  if(which==='toSalary'){\n    const willShow = toSalary.style.display==='none';\n    toSalary.style.display = willShow ? 'block' : 'none';\n    toTransfer.style.display = 'none';\n  } else {\n    const willShow = toTransfer.style.display==='none';\n    toTransfer.style.display = willShow ? 'block' : 'none';\n    toSalary.style.display = 'none';\n  }\n}\nfunction updateConvertReversePreview(value){\n  const amount = parseFloat(value) || 0;\n  const amountEl = document.getElementById('convertReverseAmountLabel');\n  const gainEl = document.getElementById('convertReverseGainLabel');\n  if(amountEl) amountEl.textContent = formatSalaryK(Math.round(amount));\n  if(gainEl) gainEl.textContent = '+'+formatValueM(amount\/200);\n}\n\/* Conversion inverse : abandonner du plafond salarial (jamais plus que la marge actuellement\n   inutilisée, pour ne jamais mettre le club en violation de sa propre masse salariale) contre du\n   budget transfert immédiat, à un taux tout aussi défavorable que le sens inverse. *\/\nfunction confirmConvertSalaryToTransfer(){\n  const range = document.getElementById('convertRangeReverse');\n  const amount = parseFloat(range.value) || 0;\n  if(amount<=0){ toast('Choisissez un montant à abandonner supérieur à 0.'); return; }\n  if(amount > salaryCapRemaining() + 0.001){ toast('Montant supérieur à la marge salariale actuellement disponible.'); return; }\n  const gain = +(amount\/200).toFixed(2);\n  state.salaryCap -= amount;\n  state.transferBudget = +(state.transferBudget + gain).toFixed(2);\n  range.value = 0;\n  toast(`💱 ${formatSalaryK(Math.round(amount))} de plafond salarial abandonnés, convertis en +${formatValueM(gain)} de budget transfert.`);\n  renderRecrutHeader();\n}\n\n\/* ============================================================\n   DÉPARTS\n   ============================================================ *\/\nlet receivedOffers = [];\nlet nextOfferId = 1;\nconst OFFER_TYPE_LABELS = { transfert:'Transfert', pretSec:'Prêt sec', pretOA:\"Prêt avec OA\" };\n\/* Chaque semaine (mercato ouvert), les joueurs listés par le DS peuvent recevoir une offre\n   d'un autre club, correspondant à l'un des types sur lesquels ils sont inscrits. *\/\n\/* Chaque offre reçue en attente a 50% de chance de disparaître en passant une semaine (le club\n   qui l'a formulée se lasse ou se tourne vers une autre cible). *\/\n\/* Alerte un joueur dont le contrat se termine à la fin de la saison (years===1, donc tombera à\n   0 et provoquera son départ à la bascule de saison), exactement 4 semaines avant l'échéance —\n   une seule fois par saison, pour ne pas répéter l'alerte chaque semaine. *\/\nfunction checkRetirementAlerts(){ if(state.week !== 26) return; players.forEach(p=>{ if(!p.retirementAlertShown && (p.age+1)>=p.retirementAge){ p.retirementAlertShown = true; toastPlayer(`Approche de la retraite : mettra un terme à sa carrière en fin de saison.`, p, '👋'); } }); } function checkContractDepartureAlerts(){\n  players.forEach(p=>{ p.weeksAtClub = (p.weeksAtClub||0) + 1; }); \/\/ ancienneté au club, incrémentée chaque semaine\n  if(state.week !== WEEKS_TOTAL-3) return; \/\/ 4 semaines avant la fin de saison (49 sur 52)\n  players.forEach(p=>{\n    if(p.years===1 && !p.isLoan && !p.departureAlertShown){\n      p.departureAlertShown = true;\n      toastPlayer(`Son contrat se termine dans 4 semaines — quittera ${CLUB_NAME} libre de tout engagement en fin de saison, sauf prolongation.`, p, '⏳');\n    }\n  });\n}\nfunction expireReceivedOffers(){\n  const expiring = receivedOffers.filter(()=>Math.random()<0.5);\n  if(!expiring.length) return;\n  expiring.forEach(o=>{\n    const p = players.find(x=>x.id===o.playerId);\n    if(p) toastPlayer(`L'offre de ${o.club} (${formatValueM(o.price)}) a expiré.`, p, '⌛');\n  });\n  receivedOffers = receivedOffers.filter(o=>!expiring.includes(o));\n  renderOffers();\n}\nfunction generateWeeklyReceivedOffers(){\n  if(!isMercatoOpen()) return;\n  if(receivedOffers.length>=6) return; \/\/ on évite d'inonder l'écran d'offres\n  \/\/ Un joueur en prêt ne nous appartient pas : aucune offre ne peut jamais le concerner.\n  \/\/ Un joueur arrivé il y a moins de 6 mois (26 semaines) n'attire pas encore d'offres non plus.\n  \/\/ Un joueur blessé pour plus de 4 semaines n'intéresse pas non plus les clubs acheteurs.\n  const eligible = players.filter(p => !p.isLoan && p.weeksAtClub>=26 && p.injuryWeeksLeft<=4 && !receivedOffers.some(o=>o.playerId===p.id));\n  for(const p of eligible){\n    if(receivedOffers.length>=6) break;\n    const isListed = p.listedTransfer || p.listedPretSec || p.listedPretOA;\n    \/\/ Un joueur listé attire davantage l'attention ; mais même non listé, un club peut\n    \/\/ spontanément s'intéresser à un joueur (offre non sollicitée, transfert uniquement).\n    \/\/ Plus la fin de contrat approche, plus les clubs tentent leur chance (joueur bientôt libre).\n    const yearsFactor = p.years<=1 ? 1.8 : p.years<=2 ? 1.35 : 1.0;\n    \/\/ Un jeune joueur (21 ans ou moins) intéresse davantage les clubs pour un prêt : moyen\n    \/\/ peu risqué d'évaluer ou de faire progresser un talent prometteur.\n    const isYoung = p.age<=21;\n    const youngLoanBoost = (isYoung && (p.listedPretSec || p.listedPretOA)) ? 1.7 : 1.0;\n    const chance = (isListed ? 0.10 : 0.03) * yearsFactor * youngLoanBoost;\n    if(Math.random() >= chance) continue;\n    let type;\n    if(isListed){\n      const types = [];\n      if(p.listedTransfer) types.push('transfert');\n      \/\/ Pour un jeune joueur, les types de prêt pèsent deux fois plus dans le tirage —\n      \/\/ les clubs préfèrent nettement le prêt au transfert sec pour un talent en formation.\n      if(p.listedPretSec) types.push('pretSec', ...(isYoung ? ['pretSec'] : []));\n      if(p.listedPretOA) types.push('pretOA', ...(isYoung ? ['pretOA'] : []));\n      type = types[Math.floor(Math.random()*types.length)];\n    } else {\n      type = 'transfert';\n    }\n    const baseValue = playerValue(p.level, p.age, p.pot, p.stats, p.years);\n    let price;\n    if(type==='pretSec') price = +(baseValue*0.15).toFixed(2);\n    else price = +(baseValue*(0.5+Math.random()*1.0)).toFixed(2); \/\/ entre 0,5x et 1,5x la valeur du joueur\n    const club = pickOfferingClub(p.level);\n    receivedOffers.push({ id: nextOfferId++, playerId:p.id, club, type, price, negotiating:false });\n    const spontLabel = isListed ? '' : ' (offre spontanée, non sollicitée)';\n    setTimeout(()=>toastPlayer(`Offre reçue de ${club} : ${formatValueM(price)} (${OFFER_TYPE_LABELS[type]})${spontLabel}.`, p, '📨'), 900);\n  }\n}\n\/* Depuis les Offres reçues : clique sur un joueur pour aller dans l'Effectif et le repérer,\n   surligné pendant 1 seconde. *\/\nfunction goToPlayerInEffectif(playerId){\n  goToTab('effectif');\n  setTimeout(()=>{\n    const row = document.getElementById('effRow-'+playerId);\n    if(row){\n      row.scrollIntoView({block:'center', behavior:'smooth'});\n      row.classList.add('row-highlight');\n      setTimeout(()=>row.classList.remove('row-highlight'), 1000);\n    }\n  }, 60);\n}\nfunction renderOffers(){\n  const tbody = document.getElementById('offersTable'); if(!tbody) return;\n  tbody.innerHTML = \"\";\n  const emptyHint = document.getElementById('offersEmptyHint');\n  if(emptyHint) emptyHint.style.display = receivedOffers.length ? 'none' : 'block';\n  const open = isMercatoOpen();\n  receivedOffers.forEach(o=>{\n    const p = players.find(x=>x.id===o.playerId);\n    if(!p){ receivedOffers = receivedOffers.filter(x=>x.id!==o.id); return; }\n    const tr = document.createElement('tr');\n    if(o.negotiating){\n      tr.innerHTML = `\n        <td colspan=\"8\">\n          <div class=\"neg-panel\" style=\"display:block;\">\n            <div class=\"neg-row\"><span>${p.name} — ${o.club} (${OFFER_TYPE_LABELS[o.type]})<\/span><span id=\"offerNegLabel-${o.id}\">${formatValueM((o.price*1.2))}<\/span><\/div>\n            <input type=\"range\" min=\"${Math.round(o.price*105)}\" max=\"${Math.round(o.price*170)}\" value=\"${Math.round(o.price*120)}\" oninput=\"document.getElementById('offerNegLabel-${o.id}').textContent=formatValueM(this.value\/100)\" id=\"offerNegRange-${o.id}\">\n            <div style=\"display:flex;gap:8px;margin-top:8px;\">\n              <button class=\"btn btn-accent btn-sm\" onclick=\"confirmNegotiation(${o.id})\">Envoyer la contre-offre<\/button>\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"cancelNegotiation(${o.id})\">Annuler<\/button>\n            <\/div>\n          <\/div>\n        <\/td>`;\n    } else {\n      tr.innerHTML = `\n        <td><div class=\"player-name\" style=\"cursor:pointer;\" onclick=\"goToPlayerInEffectif(${p.id})\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div><\/td>\n        <td>${p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')}<\/td>\n        <td><b>${p.level}<\/b><\/td>\n        <td>${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}<\/td>\n        <td>${o.club}<\/td>\n        <td><span class=\"badge locked\">${OFFER_TYPE_LABELS[o.type]}<\/span><\/td>\n        <td>${formatValueM(o.price)}<\/td>\n        <td style=\"text-align:right;white-space:nowrap;\">\n          <button class=\"btn btn-accent btn-sm\" onclick=\"acceptOffer(${o.id})\" ${open?'':'disabled'}>Accepter<\/button>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"toggleNegotiateOffer(${o.id})\" ${open?'':'disabled'}>Négocier<\/button>\n          <button class=\"btn btn-danger btn-sm\" onclick=\"refuseOffer(${o.id})\" ${open?'':'disabled'}>Refuser<\/button>\n        <\/td>`;\n    }\n    tbody.appendChild(tr);\n  });\n}\n\/* Le joueur part au montant de l'offre : remplacé par un jeune du centre de formation, comme\n   pour tout autre départ (retraite, fin de contrat). *\/\nlet pendingLoanOptions = [];\nlet nextLoanOptionId = 1;\n\/* Le prêt avec OA ne coûte rien à l'acheteur au moment du transfert : le joueur part\n   immédiatement, mais le prix n'est encaissé que si le club lève l'option, un an plus tard. *\/\nfunction departPlayerViaOffer(o){\n  const p = players.find(x=>x.id===o.playerId);\n  if(!p) return;\n  if(p.isLoan){ toast(`🚫 ${p.name} est en prêt — cette offre est invalide, il ne vous appartient pas.`); receivedOffers = receivedOffers.filter(x=>x.id!==o.id); renderOffers(); return; }\n  if(o.type==='pretSec' || o.type==='pretOA'){\n    \/\/ Historique de la saison : garde une trace du joueur avant sa suppression de l'effectif.\n    state.loanedOutThisSeason.push({ name:p.name, mainPos:p.mainPos.slice(), age:p.age, level:p.level, club:o.club, type:o.type, optionPrice: o.type==='pretOA' ? o.price : null });\n  }\n  if(o.type==='pretOA'){\n    pendingLoanOptions.push({ id: nextLoanOptionId++, playerName:p.name, playerAge:p.age, playerLevel:p.level, playerNat:p.nat, playerSalary:p.salary, club:o.club, price:o.price, weeksLeft:52 });\n  } else {\n    const clubShare = +(o.price * state.presidentSaleSharePct\/100).toFixed(2);\n    state.transferBudget = +(state.transferBudget + clubShare).toFixed(2);\n    if(o.type==='transfert') state.salaryCap += p.salary; \/\/ vente ferme : le salaire libéré est récupéré à 100% dans le plafond\n  }\n  players = players.filter(x=>x.id!==p.id);\n  receivedOffers = receivedOffers.filter(x=>x.playerId!==p.id); \/\/ les autres offres sur ce joueur tombent\n  if(o.type==='pretOA'){\n    toast(`✅ ${p.name} part en prêt avec option d'achat à ${o.club} (${formatValueM(o.price)} si l'option est levée dans 1 an).`);\n  } else {\n    toast(`✅ ${p.name} quitte ${CLUB_NAME} pour ${o.club} (${OFFER_TYPE_LABELS[o.type]}, ${formatValueM(o.price)}).`);\n  }\n  renderEffectif(); renderComposition(); renderCoachTab(); renderRecrutHeader(); renderDashboard(); renderFinances();\n}\n\/* Chaque semaine, les options d'achat en attente se rapprochent de leur échéance (1 an).\n   À l'échéance, le club acheteur lève ou non l'option (65% de chance de la lever). *\/\n\/* Décompte la durée réelle d'un prêt en semaines (52 semaines pleines depuis la signature,\n   indépendamment des bascules de saison) — un prêt signé en semaine 49 dure donc bien jusqu'à\n   la semaine 49 de la saison suivante, pas seulement jusqu'à la fin de la saison en cours. *\/\nfunction processLoanReturns(){\n  const returning = [];\n  players.forEach(p=>{\n    if(p.isLoan && p.loanWeeksLeft!==undefined){\n      p.loanWeeksLeft--;\n      if(p.loanWeeksLeft<=0) returning.push(p.id);\n    }\n  });\n  if(returning.length){\n    returning.forEach(id=>{\n      const p = players.find(x=>x.id===id);\n      toastPlayer(`Fin de prêt (52 semaines) : retourne à ${p.loanClub||'son club'}.`, p, '↩️');\n    });\n    players = players.filter(p=>!returning.includes(p.id));\n    renderEffectif(); renderComposition(); renderCoachTab(); renderRecrutHeader();\n  }\n}\nfunction processLoanOptions(){\n  const resolved = [];\n  pendingLoanOptions.forEach(o=>{\n    o.weeksLeft--;\n    if(o.weeksLeft<=0) resolved.push(o);\n  });\n  resolved.forEach(o=>{\n    if(Math.random()<0.65){\n      const clubShare = +(o.price * state.presidentSaleSharePct\/100).toFixed(2);\n      state.transferBudget = +(state.transferBudget + clubShare).toFixed(2);\n      state.salaryCap += o.playerSalary||0; \/\/ la vente devient ferme : salaire libéré récupéré à 100%\n      setTimeout(()=>toastPlayer(`${o.club} lève l'option d'achat : +${formatValueM(clubShare)} (${state.presidentSaleSharePct}% reversés par le président).`, {name:o.playerName, age:o.playerAge, level:o.playerLevel, nat:o.playerNat}, '💰'), 900);\n    } else {\n      setTimeout(()=>toastPlayer(`${o.club} ne lève pas l'option d'achat — le prêt se termine sans indemnité.`, {name:o.playerName, age:o.playerAge, level:o.playerLevel, nat:o.playerNat}, '↩️'), 900);\n    }\n  });\n  pendingLoanOptions = pendingLoanOptions.filter(o=>o.weeksLeft>0);\n}\nfunction renderLoanOptions(){\n  const tbody = document.getElementById('loanOptionsTable'); if(!tbody) return;\n  tbody.innerHTML = \"\";\n  const emptyHint = document.getElementById('loanOptionsEmptyHint');\n  if(emptyHint) emptyHint.style.display = pendingLoanOptions.length ? 'none' : 'block';\n  pendingLoanOptions.forEach(o=>{\n    const tr = document.createElement('tr');\n    tr.innerHTML = `<td>${o.playerName}<\/td><td>${o.club}<\/td><td>${formatValueM(o.price)}<\/td><td>${o.weeksLeft} semaine(s)<\/td>`;\n    tbody.appendChild(tr);\n  });\n}\nfunction acceptOffer(id){\n  if(!isMercatoOpen()){ toast(`🔒 Le mercato est fermé.`); return; }\n  const o = receivedOffers.find(x=>x.id===id); if(!o) return;\n  departPlayerViaOffer(o);\n}\nfunction refuseOffer(id){\n  const o = receivedOffers.find(x=>x.id===id); if(!o) return;\n  const p = players.find(x=>x.id===o.playerId);\n  receivedOffers = receivedOffers.filter(x=>x.id!==id);\n  toast(`${p?p.name:'Le joueur'} reste à ${CLUB_NAME} — offre refusée.`);\n  renderRecrutHeader();\n}\nfunction toggleNegotiateOffer(id){\n  receivedOffers.forEach(o=>{ o.negotiating = (o.id===id) ? !o.negotiating : false; });\n  renderOffers();\n}\nfunction cancelNegotiation(id){\n  const o = receivedOffers.find(x=>x.id===id); if(o) o.negotiating=false;\n  renderOffers();\n}\nfunction confirmNegotiation(id){\n  const o = receivedOffers.find(x=>x.id===id); if(!o) return;\n  const p = players.find(x=>x.id===o.playerId);\n  const range = document.getElementById('offerNegRange-'+id);\n  const asked = range ? parseFloat(range.value)\/100 : o.price*1.2;\n  const surcote = asked\/o.price; \/\/ plus on demande au-dessus de l'offre initiale, moins l'autre club accepte\n  const chance = clamp(0.75 - (surcote-1)*1.1, 0.05, 0.85);\n  if(Math.random() < chance){\n    departPlayerViaOffer({...o, price:+asked.toFixed(2)});\n  } else {\n    receivedOffers = receivedOffers.filter(x=>x.id!==id); \/\/ fin des négociations\n    toast(`❌ ${o.club} refuse la contre-offre pour ${p?p.name:'ce joueur'} — fin des négociations.`);\n    renderOffers();\n  }\n}\n\/* Le DS liste\/retire un joueur du marché depuis sa fiche (onglet Action) *\/\n\/* Lève l'option d'achat d'un joueur en prêt avec OA actuellement au club : peut se faire à\n   tout moment (pas d'échéance), tant que le budget transfert le permet. Le joueur devient\n   possédé normalement, avec un contrat classique. *\/\nfunction confirmExercerOptionAchat(playerId){\n  const p = players.find(x=>x.id===playerId);\n  if(!p || !p.isLoan || !p.withOption) return;\n  if(p.oaBlockedUntilWeek && absoluteWeek() < p.oaBlockedUntilWeek){ toast(`🚫 ${p.name} a rompu les négociations — patientez encore ${p.oaBlockedUntilWeek-absoluteWeek()} semaine(s) avant de retenter.`); return; }\n  if(p.optionPrice > state.transferBudget){ toast(`🚫 Budget transfert insuffisant pour lever l'option (${formatValueM(p.optionPrice)} nécessaires, ${formatValueM(state.transferBudget)} disponibles).`); return; }\n  const marketSalary = playerSalaryK(p.level, p.age);\n  const salaryRange = document.getElementById('oaSalaryRange-'+playerId);\n  const proposedSalary = salaryRange ? parseInt(salaryRange.value) : marketSalary;\n  const yearsRange = document.getElementById('oaYearsRange-'+playerId);\n  const contractYears = yearsRange ? parseInt(yearsRange.value) : 3;\n  if(proposedSalary > salaryCapRemaining() + p.salary){ toast(`🚫 Masse salariale insuffisante pour ce salaire proposé (${formatSalaryK(proposedSalary)}).`); return; }\n  const salaryChance = salaryNegotiationChance(proposedSalary, marketSalary);\n  if(Math.random() >= salaryChance){\n    if(Math.random() < 1\/3){\n      p.oaBlockedUntilWeek = absoluteWeek() + 2;\n      toast(`❌ ${p.name} rompt les négociations, vexé par l'offre — il faudra patienter 2 semaines avant de retenter.`);\n    } else {\n      toast(`💬 ${p.name} refuse le nouveau salaire proposé (${formatSalaryK(proposedSalary)}) pour rester définitivement — tentez une proposition plus généreuse.`);\n    }\n    return;\n  }\n  state.transferBudget = +(state.transferBudget - p.optionPrice).toFixed(2);\n  const formerClub = p.loanClub;\n  p.isLoan = false; p.withOption = false; p.loanClub = null;\n  p.salary = proposedSalary;\n  p.years = contractYears;\n  p.lastContractWeek = absoluteWeek();\n  oaNegOpenId = null;\n  toastPlayer(`Option d'achat levée pour ${formatValueM(p.optionPrice)} : rejoint définitivement ${CLUB_NAME}${formerClub?' (ex-'+formerClub+')':''} !`, p, '💰');\n  renderEffectif(); renderComposition(); renderRecrutHeader(); renderFinances(); renderDashboard();\n}\nfunction toggleListing(playerId, kind){\n  const p = players.find(x=>x.id===playerId); if(!p) return;\n  if(p.isLoan){ toast(`🚫 ${p.name} est en prêt — impossible de le lister, il ne vous appartient pas.`); return; }\n  const field = kind==='transfert' ? 'listedTransfer' : kind==='pretSec' ? 'listedPretSec' : 'listedPretOA';\n  p[field] = !p[field];\n  toast(p[field] ? `${p.name} est désormais listé : ${OFFER_TYPE_LABELS[kind]}.` : `${p.name} retiré de la liste ${OFFER_TYPE_LABELS[kind]}.`);\n  \/\/ Mise à jour ciblée du seul bouton concerné : la fiche reste ouverte, sur le même onglet,\n  \/\/ pour permettre d'enchaîner plusieurs choix (transfert + prêt sec + prêt OA...) à la suite.\n  const btn = document.getElementById(`listBtn-${kind}-${playerId}`);\n  if(btn){\n    btn.className = 'btn '+(p[field]?'btn-danger':'btn-ghost')+' btn-sm';\n    const labels = {\n      transfert: p[field]?'Retirer de la liste des transferts':'Mettre sur la liste des transferts',\n      pretSec: p[field]?'Retirer de la liste des prêts secs':'Mettre sur la liste des prêts secs',\n      pretOA: p[field]?\"Retirer de la liste des prêts avec OA\":\"Mettre sur la liste des prêts avec OA\"\n    };\n    btn.textContent = labels[kind];\n  }\n  \/\/ Idem pour le bouton compact de la Vue transferts (libellés courts, distincts de la fiche joueur).\n  const shortBtn = document.getElementById(`listBtnShort-${kind}-${playerId}`);\n  if(shortBtn){\n    shortBtn.className = 'btn '+(p[field]?'btn-danger':'btn-ghost')+' btn-sm';\n    const shortLabels = { transfert: p[field]?'Retirer':'Vendre', pretSec: p[field]?'Retirer':'Prêter', pretOA: p[field]?'Retirer':'Prêter avec OA' };\n    shortBtn.textContent = shortLabels[kind];\n  }\n}\n\/* ============================================================\n   EFFECTIF (titulaires \/ remplaçants)\n   ============================================================ *\/\nfunction contractEndDate(p){ return `Juin ${2025+state.season+p.years}`; }\nfunction moralBarColor(v){ v=Math.max(0,Math.min(100,v)); var t=v\/100; var c1=[126,58,242], c2=[182,244,92]; var r=Math.round(c1[0]+(c2[0]-c1[0])*t), g=Math.round(c1[1]+(c2[1]-c1[1])*t), b=Math.round(c1[2]+(c2[2]-c1[2])*t); return 'rgb('+r+','+g+','+b+')'; } function miniGauge(value, color, bold){\n  const c = color || moralBarColor(value); return `<span style=\"white-space:nowrap;\"><span class=\"mini-bar\"><div style=\"width:${value}%;${c?'background:'+c+';':''}\"><\/div><\/span>${bold?`<b>${value}<\/b>`:value}<\/span>`;\n}\n\/* D9 : totaux carrière d'un joueur — cumul de toutes les saisons archivées + la saison en cours. *\/\nfunction careerTotals(p){\n  const totals = {m:0,g:0,a:0,jc:0,rc:0,cs:0,noteSum:0,noteCount:0};\n  (p.statsHistory||[]).forEach(h=>{ totals.m+=h.m; totals.g+=h.g; totals.a+=h.a; totals.jc+=h.jc; totals.rc+=h.rc; totals.cs+=h.cs; totals.noteSum+=h.noteSum; totals.noteCount+=h.noteCount; });\n  totals.m+=p.stats.m; totals.g+=p.stats.g; totals.a+=p.stats.a; totals.jc+=p.stats.jc; totals.rc+=p.stats.rc; totals.cs+=p.stats.cs; totals.noteSum+=p.stats.noteSum; totals.noteCount+=p.stats.noteCount;\n  return totals;\n}\nconst EFFECTIF_VIEWS = {\n  simple: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Nationalité', get:p=>p.nat, cell:p=>isMobileViewport() ? nationFlag(p.nat) : `${nationFlag(p.nat)} ${p.nat}`},\n    {label:'Âge', get:p=>p.age, cell:p=>p.age},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'Niveau', get:p=>p.level, cell:p=>`<b>${p.level}<\/b>`},\n    {label:'Salaire', get:p=>p.salary, cell:p=>`${formatSalaryDisplay(p.salary)}`},\n    {label:'Valeur', get:p=>playerValue(p.level,p.age,p.pot,p.stats,p.years), cell:p=>`${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}`},\n    {label:'Satisfaction', get:p=>p.moral, cell:p=>`<span class=\"badge ${moralClass(p.moral)}\">${p.moral}%<\/span>`}\n  ],\n  stats: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Poste', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>`<span class=\"badge ${posClass(p.mainPos[0])}\">${displayPosLabel(p.mainPos[0])}<\/span>`},\n    {label:'Matchs joués', get:p=>p.stats.m, cell:p=>p.stats.m},\n    {label:'Buts', get:p=>p.stats.g, cell:p=>p.stats.g},\n    {label:'Passes déc.', get:p=>p.stats.a, cell:p=>p.stats.a},\n    {label:'Cartons rouges', get:p=>p.stats.rc, cell:p=>p.stats.rc},\n    {label:'Erreur', get:p=>p.stats.e, cell:p=>p.stats.e}, {label:'Clean Sheet', get:p=>p.stats.cs, cell:p=>p.stats.cs},\n    {label:'Note Moyenne', get:p=>p.stats.noteCount?(p.stats.noteSum\/p.stats.noteCount):0, cell:p=>p.stats.noteCount?(p.stats.noteSum\/p.stats.noteCount).toFixed(2):'—'}\n  ],\n  historique: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Poste', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>`<span class=\"badge ${posClass(p.mainPos[0])}\">${displayPosLabel(p.mainPos[0])}<\/span>`},\n    {label:'Saisons', get:p=>(p.statsHistory||[]).length+1, cell:p=>(p.statsHistory||[]).length+1},\n    {label:'Matchs joués', get:p=>careerTotals(p).m, cell:p=>careerTotals(p).m},\n    {label:'Buts', get:p=>careerTotals(p).g, cell:p=>careerTotals(p).g},\n    {label:'Passes déc.', get:p=>careerTotals(p).a, cell:p=>careerTotals(p).a},\n    {label:'Cartons rouges', get:p=>careerTotals(p).rc, cell:p=>careerTotals(p).rc},\n    {label:'Clean Sheet', get:p=>careerTotals(p).cs, cell:p=>careerTotals(p).cs},\n    {label:'Note Moyenne', get:p=>{const t=careerTotals(p); return t.noteCount?t.noteSum\/t.noteCount:0;}, cell:p=>{const t=careerTotals(p); return t.noteCount?(t.noteSum\/t.noteCount).toFixed(2):'—';}}\n  ],\n  contrat: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'Âge', get:p=>p.age, cell:p=>p.age},\n    {label:'Niveau', get:p=>p.level, cell:p=>`<b>${p.level}<\/b>`},\n    {label:'Salaire', get:p=>p.salary, cell:p=>`${formatSalaryDisplay(p.salary)}`},\n    {label:'Fin de contrat', get:p=>p.years, cell:p=>contractEndDate(p)},\n    {label:'Valeur', get:p=>playerValue(p.level,p.age,p.pot,p.stats,p.years), cell:p=>`${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}`}\n  ],\n  transferts: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'Âge', get:p=>p.age, cell:p=>p.age},\n    {label:'Niveau', get:p=>p.level, cell:p=>`<b>${p.level}<\/b>`},\n    {label:'Fin de contrat', get:p=>p.years, cell:p=>contractEndDate(p)},\n    {label:'Salaire', get:p=>p.salary, cell:p=>`${formatSalaryDisplay(p.salary)}`},\n    {label:'Valeur', get:p=>playerValue(p.level,p.age,p.pot,p.stats,p.years), cell:p=>`${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}`},\n    {label:'Actions', sortable:false, cell:p=>p.isLoan ? '<span class=\"hint\">En prêt — indisponible<\/span>' : `\n      <div style=\"display:flex;gap:6px;flex-wrap:${isMobileViewport()?'nowrap':'wrap'};\">\n        <button class=\"btn ${p.listedTransfer?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtnShort-transfert-${p.id}\" onclick=\"event.stopPropagation();toggleListing(${p.id},'transfert')\">${p.listedTransfer?'Retirer':'Vendre'}<\/button>\n        <button class=\"btn ${p.listedPretSec?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtnShort-pretSec-${p.id}\" onclick=\"event.stopPropagation();toggleListing(${p.id},'pretSec')\">${p.listedPretSec?'Retirer':'Prêter'}<\/button>\n        <button class=\"btn ${p.listedPretOA?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtnShort-pretOA-${p.id}\" onclick=\"event.stopPropagation();toggleListing(${p.id},'pretOA')\">${p.listedPretOA?'Retirer':(isMobileViewport()?'Prêt+OA':'Prêter avec OA')}<\/button>\n      <\/div>`}\n  ],\n  sport: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'Postes secondaires', get:p=>p.sec.length, cell:p=>p.sec.length?p.sec.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge sec-pos\">${displayPosLabel(c)}<\/span>`).join(' '):'<span class=\"hint\">—<\/span>'},\n    {label:'Âge', get:p=>p.age, cell:p=>p.age},\n    {label:'Niveau', get:p=>p.level, cell:p=>`<b>${p.level}<\/b>`},\n    {label:'Potentiel', get:p=>p.pot, cell:p=>p.pot},\n    {label:'Satisfaction', get:p=>p.moral, cell:p=>`<span class=\"badge ${moralClass(p.moral)}\">${p.moral}%<\/span>`},\n    {label:'ADN', get:p=>knownADN(p).length?knownADN(p).slice().sort().join(', '):'\\uffff', cell:p=>renderADNBadges(p)}\n  ],\n  moral: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'Satisfaction Salaire', get:p=>computeSatisfactionBreakdown(p).noteSalaire, cell:p=>miniGauge(Math.round(computeSatisfactionBreakdown(p).noteSalaire))},\n    {label:'Satisfaction Temps de jeu', get:p=>computeSatisfactionBreakdown(p).noteTemps, cell:p=>miniGauge(Math.round(computeSatisfactionBreakdown(p).noteTemps))},\n    {label:'Satisfaction Résultats du club', get:p=>computeSatisfactionBreakdown(p).noteResultats, cell:p=>miniGauge(Math.round(computeSatisfactionBreakdown(p).noteResultats))},\n    {label:'Satisfaction Relation coach', get:p=>computeSatisfactionBreakdown(p).noteCoach, cell:p=>miniGauge(Math.round(computeSatisfactionBreakdown(p).noteCoach))},\n    {label:'Satisfaction Vie perso', get:p=>computeSatisfactionBreakdown(p).vieProScore, cell:p=>miniGauge(Math.round(computeSatisfactionBreakdown(p).vieProScore))}\n  ],\n  forme: [\n    {label:'Nom', get:p=>p.name, cell:p=>`<div class=\"player-name\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div>`},\n    {label:'Postes principaux', get:p=>POSITION_RANK[p.mainPos[0]], cell:p=>p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')},\n    {label:'I1 — Retour de blessure', get:p=>p.i1Malus||0, cell:p=>formeValueHTML(p.i1Malus||0)},\n    {label:'I2 — Forme de l\\'équipe', get:()=>computeTeamFormI2(), cell:()=>formeValueHTML(computeTeamFormI2())},\n    {label:'I3 — Intégration', get:p=>p.i3Malus||0, cell:p=>formeValueHTML(p.i3Malus||0)},\n    {label:'I4 — Moral', get:p=>computeI4(p.moral), cell:p=>formeValueHTML(computeI4(p.moral))},\n    {label:'I5 — Fatigue', get:p=>p.fatigueMalus||0, cell:p=>formeValueHTML(p.fatigueMalus||0)},\n    {label:'I6 — Hors de forme', get:p=>computeHorsDeFormeMalus(p), cell:p=>formeValueHTML(computeHorsDeFormeMalus(p))}\n  ]\n};\nfunction formeValueHTML(v){\n  const cls = v>0?'trend up':v<0?'trend down':'';\n  const txt = v>0?`+${v}`:`${v}`;\n  return `<span class=\"${cls}\">${txt}<\/span>`;\n}\nlet effectifSort = {view:'simple', colIndex:null, dir:'desc'};\nlet effectifSortOrder = null; \/\/ ordre figé des IDs de joueurs — persiste au changement de vue\nfunction getEffectifColumns(){ let cols = EFFECTIF_VIEWS[effectifView] || EFFECTIF_VIEWS.simple; if(isMobileViewport()){ cols = cols.filter(c=>c.label!=='Postes secondaires'); cols = cols.map(c=>{ var lb = c.label==='Nationalité' ? '' : c.label.replace('Postes principaux','Postes').replace('Satisfaction','Moral'); return lb===c.label ? c : Object.assign({},c,{label:lb}); }); } return cols; } function sortEffectifBy(colIndex){\n  if(effectifSort.view!==effectifView || effectifSort.colIndex!==colIndex){\n    effectifSort = {view:effectifView, colIndex, dir:'desc'}; \/\/ 1er clic : décroissant\n  } else {\n    effectifSort.dir = effectifSort.dir==='desc' ? 'asc' : 'desc'; \/\/ 2e clic : croissant\n  }\n  \/\/ Calcule l'ordre maintenant et le fige : il reste ensuite le même si on change de vue,\n  \/\/ même si la nouvelle vue n'a pas cette colonne.\n  const columns = getEffectifColumns();\n  const col = columns[colIndex];\n  const dir = effectifSort.dir==='desc' ? -1 : 1;\n  const sorted = players.slice().sort((a,b)=>{\n    const va=col.get(a), vb=col.get(b);\n    if(typeof va==='string') return va.localeCompare(vb)*dir;\n    return (va-vb)*dir;\n  });\n  effectifSortOrder = sorted.map(p=>p.id);\n  renderEffectif();\n}\nfunction setEffectifView(view){\n  effectifView = view;\n  \/\/ L'ordre de tri (effectifSortOrder) n'est volontairement PAS réinitialisé ici : il doit\n  \/\/ rester identique en changeant de vue, seule la colonne surlignée peut différer.\n  ['simple','stats','historique','contrat','transferts','sport','moral','forme'].forEach(v=>{\n    const btn = document.getElementById('effectifViewBtn-'+v);\n    if(btn) btn.classList.toggle('selected', v===view);\n  });\n  renderEffectif();\n}\nfunction renderEffectif(){\n  autoSelectStarters(); \/\/ le coach recompose seul le meilleur onze possible avec tout l'effectif\n  refreshCoachSelections();\n  renderLoanedOutThisSeason();\n\n  const head = document.getElementById('effectifTableHead');\n  const body = document.getElementById('effectifTableBody');\n  if(head && body){\n    const columns = getEffectifColumns();\n    let sorted;\n    if(effectifSortOrder){\n      \/\/ Réapplique l'ordre figé, quelle que soit la vue ; un joueur absent de l'ordre connu\n      \/\/ (recrue récente) est placé à la fin, dans l'ordre naturel des postes.\n      const orderMap = new Map(effectifSortOrder.map((id,i)=>[id,i]));\n      sorted = players.slice().sort((a,b)=>{\n        const ia = orderMap.has(a.id) ? orderMap.get(a.id) : Infinity;\n        const ib = orderMap.has(b.id) ? orderMap.get(b.id) : Infinity;\n        if(ia!==ib) return ia-ib;\n        return POSITION_RANK[a.mainPos[0]]-POSITION_RANK[b.mainPos[0]];\n      });\n    } else {\n      sorted = players.slice().sort((a,b)=>POSITION_RANK[a.mainPos[0]]-POSITION_RANK[b.mainPos[0]]);\n    }\n\n    head.innerHTML = `<tr>${columns.map((c,i)=>{\n      const active = effectifSort.view===effectifView && effectifSort.colIndex===i;\n      const arrow = active ? (effectifSort.dir==='desc' ? ' ▼' : ' ▲') : '';\n      if(c.sortable===false) return `<th>${c.label}<\/th>`;\n      return `<th onclick=\"sortEffectifBy(${i})\" style=\"cursor:pointer;user-select:none;\">${c.label}${arrow}<\/th>`;\n    }).join('')}<\/tr>`;\n\n    body.innerHTML = \"\";\n    sorted.forEach(p=>{\n      const tr=document.createElement('tr'); tr.className='row'; tr.id='effRow-'+p.id;\n      tr.onclick=()=>openModal(p.id);\n      tr.innerHTML = columns.map(c=>`<td>${c.cell(p)}<\/td>`).join('');\n      body.appendChild(tr);\n    });\n  }\n  renderDashboard();\n  renderAcademy();\n}\n\n\/* ============================================================\n   COMPOSITION (terrain + listes titulaires\/remplaçants)\n   ============================================================ *\/\n\/* Coordonnées du terrain pour un schéma (def\/mid\/att) : les milieux centraux (MDC\/MC\/MOC)\n   sont décalés verticalement selon leur profondeur (MDC le plus reculé, MOC le plus avancé),\n   pour qu'un 4-4-2 losange forme un vrai losange à l'écran plutôt qu'une ligne plate. Les\n   milieux excentrés (MG\/MD) restent sur la ligne médiane. *\/\nconst MID_DEPTH_OFFSET = { MDC:10, MC:0, MOC:-10 };\nfunction computePitchCoords(shape){\n  const coords = [{x:50,y:90}];\n  const layer=(arr,y)=>{ const n=arr.length; arr.forEach((_,i)=>{ coords.push({x:((i+1)\/(n+1))*100, y}); }); };\n  layer(shape.def, 74);\n  const nMid = shape.mid.length;\n  shape.mid.forEach((pos,i)=>{ coords.push({x:((i+1)\/(nMid+1))*100, y:50+(MID_DEPTH_OFFSET[pos]||0)}); });\n  layer(shape.att, 20);\n  return coords;\n}\nfunction renderComposition(){\n  const pitchContainer = document.getElementById('compoPitchContainer');\n  if(!pitchContainer) return; \/\/ onglet non actif dans le DOM courant\n  autoSelectStarters();\n  refreshCoachSelections();\n  const rawAssignment = state.currentTactiqueAssignment || [];\n  const shape = buildShape(state.currentTactiqueFamily, state.currentTactiqueVariant);\n  const coords = computePitchCoords(shape);\n\n  let pitchHtml = `<div class=\"pitch\">`;\n  const matchCaptainId = getMatchCaptainId();\n  rawAssignment.forEach((a,i)=>{\n    const c = coords[i];\n    const lastName = a.player.name.split(' ').slice(-1)[0];\n    const colors = pitchDotColors(a.player.mainPos[0]);\n    const isCaptain = a.player.id===matchCaptainId;\n    pitchHtml += `<div class=\"pdot us\" style=\"left:${c.x}%;top:${c.y}%;\">\n      <div class=\"circ\" style=\"background:${colors.bg};color:${colors.fg};\">${a.player.number||'–'}${isCaptain?'<span title=\"Capitaine du match\" style=\"position:absolute;top:-6px;right:-6px;font-size:12px;\">🎖️<\/span>':''}<\/div>\n      <div class=\"lbl\">${lastName}<\/div>\n      <div class=\"lvl\">${a.player.level}<\/div>\n    <\/div>`;\n  });\n  pitchHtml += '<\/div>';\n  pitchContainer.innerHTML = pitchHtml;\n\n  const tS=document.getElementById('compoStarters'); tS.innerHTML=\"\";\n  rawAssignment.slice().sort((a,b)=>POSITION_RANK[a.slot]-POSITION_RANK[b.slot]).forEach(a=>{const p = a.player; const tr=document.createElement('tr'); tr.className='row'; tr.onclick=()=>openModal(p.id); tr.innerHTML=`<td><span class=\"badge ${posClass(a.slot)}\">${displayPosLabel(a.slot)}<\/span><\/td><td><div class=\"player-name\">${p.name.split(' ').slice(-1)[0]}${injuryIconHTML(p)}${matchCaptainIconHTML(p)}${loanIconHTML(p)}<\/div><\/td><td>${mainPosBadgesMini(p)}<\/td><td style=\"font-size:18px;\">${nationFlag(p.nat)}<\/td><td>${p.age}<\/td><td><b>${p.level}<\/b><\/td>`; tS.appendChild(tr);\n  });\n\n  const tB=document.getElementById('compoBench'); tB.innerHTML=\"\";\n  players.filter(p=>!p.starter).sort((a,b)=>POSITION_RANK[a.mainPos[0]]-POSITION_RANK[b.mainPos[0]]).forEach(p=>{const tr=document.createElement('tr'); tr.className='row'; tr.onclick=()=>openModal(p.id); tr.innerHTML=`<td><div class=\"player-name\">${p.name.split(' ').slice(-1)[0]}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/div><\/td><td>${mainPosBadgesMini(p)}<\/td><td style=\"font-size:18px;\">${nationFlag(p.nat)}<\/td><td>${p.age}<\/td><td><b>${p.level}<\/b><\/td>`; tB.appendChild(tr);\n  });\n}\n\n\/* ============================================================\n   FICHE JOUEUR (MODAL)\n   ============================================================ *\/\nfunction openModal(id){\n  const p=players.find(x=>x.id===id);\n  const content=document.getElementById('modalContent');\n  content.innerHTML=`\n    <div class=\"modal-head\">\n      <div class=\"avatar\">${initials(p.name)}<\/div>\n      <div>\n        <h2>${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}${loanIconHTML(p)}<\/h2>\n        <div class=\"subline\">${nationFlag(p.nat)} ${p.nat} · <span class=\"badge ${posClass(p.mainPos[0])}\">${displayPosLabel(p.mainPos[0])}<\/span><\/div>\n        ${p.injuryWeeksLeft>0 ? `<div class=\"hint\" style=\"margin-top:4px;color:var(--danger);\">${p.injuryTier.icon} ${p.injuryTier.label} — indisponible ${p.injuryWeeksLeft} semaine(s)<\/div>` : ''}\n      <\/div>\n    <\/div>\n    <div class=\"kv-grid\" style=\"margin-top:10px;\"><div class=\"k\">Niveau<\/div><div class=\"v\"><b>${p.level}<\/b> \/ 100<\/div><\/div>\n    <div class=\"kv-grid\" style=\"margin-top:14px;\">\n      <div class=\"k\">Salaire<\/div><div class=\"v\">${formatSalaryK(p.salary)} \/ mois<\/div>\n      <div class=\"k\">Valeur<\/div><div class=\"v\">${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}<\/div>\n      <div class=\"k\">Moral<\/div><div class=\"v\">${p.moral}%<\/div>\n    <\/div>\n    <div class=\"modal-tabs\">\n      <button class=\"modal-tab active\" data-tab=\"sportif\">Sportif<\/button>\n      <button class=\"modal-tab\" data-tab=\"marche\">Marché<\/button>\n      <button class=\"modal-tab\" data-tab=\"action\">Action<\/button>\n      <button class=\"modal-tab\" data-tab=\"moral\">Moral<\/button>\n      <button class=\"modal-tab\" data-tab=\"stats\">Statistiques<\/button>\n      <button class=\"modal-tab\" data-tab=\"adn\">ADN<\/button>\n    <\/div>\n\n    <div class=\"modal-pane active\" data-pane=\"sportif\">\n      <div class=\"kv-grid\">\n        <div class=\"k\">Âge<\/div><div class=\"v\">${p.age} ans<\/div>\n        <div class=\"k\">Niveau<\/div><div class=\"v\"><b>${p.level}<\/b> \/ 100<\/div>\n        <div class=\"k\">Potentiel<\/div><div class=\"v\">${p.pot} \/ 100<\/div>\n      <\/div>\n      <span class=\"field-label\">Postes<\/span>\n      <div class=\"chip-group\">${renderPositionBadges(p)}<\/div>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"marche\">\n      <div class=\"kv-grid\">\n        <div class=\"k\">Valeur<\/div><div class=\"v\">${formatValueM(playerValue(p.level,p.age,p.pot,p.stats,p.years))}<\/div>\n        <div class=\"k\">Salaire<\/div><div class=\"v\">${formatSalaryK(p.salary)} \/ mois<\/div>\n        <div class=\"k\">Fin de contrat<\/div><div class=\"v\">${p.years} an(s)<\/div>\n      <\/div>\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Statut sur le marché<\/span>\n      <div class=\"chip-group\">\n        ${p.listedTransfer?'<span class=\"badge locked\">Transfert<\/span>':''}\n        ${p.listedPretSec?'<span class=\"badge locked\">Prêt sec<\/span>':''}\n        ${p.listedPretOA?'<span class=\"badge locked\">Prêt avec OA<\/span>':''}\n        ${(!p.listedTransfer && !p.listedPretSec && !p.listedPretOA) ? '<span class=\"hint\">Non listé — voir l\\'onglet Action.<\/span>' : ''}\n      <\/div>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"action\">\n      ${p.isLoan ? `\n      <p class=\"hint\" style=\"margin-top:0;\">Ce joueur est en prêt${p.loanClub?' de <b>'+p.loanClub+'<\/b>':''}. Sa durée de prêt est fixée par le club prêteur : vous ne pouvez ni prolonger son contrat, ni le lister sur votre marché des transferts.<\/p>\n      ${p.withOption ? `\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Option d'achat — ${formatValueM(p.optionPrice)}<\/span>\n      <p class=\"hint\" style=\"margin-top:0;\">Achetez ${p.name} définitivement, avant même la fin de son prêt.<\/p>\n      <span class=\"field-label\">Nouveau salaire mensuel : <b id=\"modalOaSalaryLabel-${p.id}\">${formatSalaryK(playerSalaryK(p.level,p.age))}<\/b><\/span>\n      <input type=\"range\" min=\"${Math.max(1,Math.round(playerSalaryK(p.level,p.age)*0.6))}\" max=\"${Math.round(playerSalaryK(p.level,p.age)*1.6)}\" value=\"${playerSalaryK(p.level,p.age)}\" oninput=\"document.getElementById('modalOaSalaryLabel-${p.id}').textContent=formatSalaryK(this.value)\" id=\"oaSalaryRange-${p.id}\">\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Durée du contrat<\/span>\n      <span id=\"oaYearsLabel-${p.id}\">3 ans<\/span>\n      <input type=\"range\" min=\"1\" max=\"4\" step=\"1\" value=\"3\" oninput=\"document.getElementById('oaYearsLabel-${p.id}').textContent=this.value+(this.value>1?' ans':' an')\" id=\"oaYearsRange-${p.id}\">\n      <div class=\"divider\"><\/div>\n      <button class=\"btn btn-accent\" style=\"width:100%;\" onclick=\"confirmExercerOptionAchat(${p.id})\" ${(p.optionPrice>state.transferBudget || (p.oaBlockedUntilWeek && absoluteWeek()<p.oaBlockedUntilWeek))?'disabled':''}>💰 Lever l'option maintenant<\/button>\n      ${(p.oaBlockedUntilWeek && absoluteWeek()<p.oaBlockedUntilWeek) ? `<p class=\"hint\" style=\"margin-top:6px;\">Négociations rompues — encore ${p.oaBlockedUntilWeek-absoluteWeek()} semaine(s) avant de retenter.<\/p>` : p.optionPrice>state.transferBudget ? `<p class=\"hint\" style=\"margin-top:6px;\">Budget transfert insuffisant (${formatValueM(p.optionPrice)} nécessaires).<\/p>` : ''}\n      ` : ''}\n      ` : `\n      <p class=\"hint\" style=\"margin-top:0;\">Proposez une prolongation. La négociation tient compte du moral du joueur et de son potentiel.<\/p>\n      <span class=\"field-label\">Nouveau salaire mensuel : <b id=\"renewSalVal\">${formatSalaryK(p.salary)}<\/b><\/span>\n      <input type=\"range\" min=\"${Math.max(3,Math.round(p.salary*0.6))}\" max=\"${Math.round(p.salary*1.8)}\" value=\"${p.salary}\" id=\"renewSal\" oninput=\"document.getElementById('renewSalVal').textContent=formatSalaryK(this.value)\">\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Durée proposée<\/span>\n      <div class=\"chip-group\">\n        <button class=\"chip selected\" data-years=\"1\">1 an<\/button>\n        <button class=\"chip\" data-years=\"2\">2 ans<\/button>\n        <button class=\"chip\" data-years=\"3\">3 ans<\/button>\n        <button class=\"chip\" data-years=\"4\">4 ans<\/button>\n      <\/div>\n      <div class=\"divider\"><\/div>\n      <button class=\"btn btn-primary\" style=\"width:100%;\" onclick=\"proposerRenouvellement(${p.id})\" ${(p.renewalBlockedUntilWeek && absoluteWeek()<p.renewalBlockedUntilWeek) || (!((p.years-1)*52+(52-state.week)<=26) && (p.years>=3 || (absoluteWeek()-(p.lastContractWeek||0))<26)) ? 'disabled' : ''}>Proposer la prolongation<\/button>\n      ${(p.renewalBlockedUntilWeek && absoluteWeek()<p.renewalBlockedUntilWeek) ? `<p class=\"hint\" style=\"margin-top:6px;\">Négociations rompues — encore ${p.renewalBlockedUntilWeek-absoluteWeek()} semaine(s) avant de retenter.<\/p>` : (p.years-1)*52+(52-state.week)<=26 ? '' : p.years>=3 ? `<p class=\"hint\" style=\"margin-top:6px;\">Encore ${p.years} ans de contrat — trop tôt pour renégocier.<\/p>` : (absoluteWeek()-(p.lastContractWeek||0))<26 ? `<p class=\"hint\" style=\"margin-top:6px;\">Contrat signé il y a moins de 6 mois — trop tôt pour le renouveler.<\/p>` : ''}\n\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Marché des transferts<\/span>\n      <button class=\"btn ${p.listedTransfer?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtn-transfert-${p.id}\" style=\"width:100%;margin-bottom:6px;\" onclick=\"toggleListing(${p.id},'transfert')\">${p.listedTransfer?'Retirer de la liste des transferts':'Mettre sur la liste des transferts'}<\/button>\n      <button class=\"btn ${p.listedPretSec?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtn-pretSec-${p.id}\" style=\"width:100%;margin-bottom:6px;\" onclick=\"toggleListing(${p.id},'pretSec')\">${p.listedPretSec?'Retirer de la liste des prêts secs':'Mettre sur la liste des prêts secs'}<\/button>\n      <button class=\"btn ${p.listedPretOA?'btn-danger':'btn-ghost'} btn-sm\" id=\"listBtn-pretOA-${p.id}\" style=\"width:100%;\" onclick=\"toggleListing(${p.id},'pretOA')\">${p.listedPretOA?\"Retirer de la liste des prêts avec OA\":\"Mettre sur la liste des prêts avec OA\"}<\/button>\n      `}\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"moral\">\n      <span class=\"field-label\">Satisfaction au club<\/span>\n      <div class=\"bar-row\">\n        <div class=\"top\"><span>Moral<\/span><b>${p.moral}%<\/b><\/div>\n        <div class=\"bar-track\"><div class=\"fill-green\" style=\"width:${p.moral}%\"><\/div><\/div>\n      <\/div>\n      <div class=\"divider\"><\/div>\n      <span class=\"field-label\">Relation avec le coach<\/span>\n      <div class=\"kv-grid\" style=\"margin-bottom:0;\">\n        <div class=\"k\">${COACH_RELATION_LABELS[p.coachRelation]}<\/div>\n        <div class=\"v\">${p.coachRelation} \/ ${COACH_RELATION_LEVELS.join('')}<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"stats\">\n      <span class=\"field-label\">Saison en cours<\/span>\n      <div class=\"kv-grid\">\n        <div class=\"k\">Matchs joués<\/div><div class=\"v\">${p.stats.m}<\/div>\n        <div class=\"k\">Buts<\/div><div class=\"v\">${p.stats.g}<\/div>\n        <div class=\"k\">Passes décisives<\/div><div class=\"v\">${p.stats.a}<\/div>\n        <div class=\"k\">Cartons jaunes<\/div><div class=\"v\">${p.stats.jc}<\/div>\n        <div class=\"k\">Cartons rouges<\/div><div class=\"v\">${p.stats.rc}<\/div>\n        ${p.mainPos.includes('GB') ? `<div class=\"k\">Clean sheets<\/div><div class=\"v\">${p.stats.cs}<\/div>` : ''}\n        <div class=\"k\">Note moyenne<\/div><div class=\"v\">${p.stats.noteCount? (p.stats.noteSum\/p.stats.noteCount).toFixed(2) : '—'}<\/div>\n      <\/div>\n      <p class=\"hint\">Les statistiques progressent au fil des matchs joués depuis l'onglet Match.<\/p>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"adn\">\n      <span class=\"field-label\">ADN du joueur<\/span>\n      <div class=\"chip-group\">${renderADNBadges(p)}<\/div>\n    <\/div>\n  `;\n  content.querySelectorAll('.modal-tab').forEach(t=>t.onclick=()=>{\n    content.querySelectorAll('.modal-tab').forEach(x=>x.classList.remove('active'));\n    content.querySelectorAll('.modal-pane').forEach(x=>x.classList.remove('active'));\n    t.classList.add('active');\n    content.querySelector(`.modal-pane[data-pane=\"${t.dataset.tab}\"]`).classList.add('active');\n  });\n  content.querySelectorAll('.chip[data-years]').forEach(c=>c.onclick=()=>{\n    content.querySelectorAll('.chip[data-years]').forEach(x=>x.classList.remove('selected'));\n    c.classList.add('selected');\n  });\n  document.getElementById('playerModal').classList.add('open'); document.body.style.overflow='hidden';\n}\nfunction renderScoutPositionBadges(s){\n  const sortedMain = s.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]);\n  return sortedMain.map(code=>`<span class=\"badge ${posClass(code)}\">${displayPosLabel(code)}<\/span>`).join(' ');\n}\nfunction openScoutModal(id){\n  const s = scouts.find(x=>x.id===id);\n  if(!s) return;\n  const content = document.getElementById('modalContent');\n  const mainBadges = s.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(p=>`<span class=\"badge ${posClass(p)}\">${displayPosLabel(p)}<\/span>`).join(' ');\n  content.innerHTML = `\n    <div class=\"modal-head\">\n      <div class=\"avatar\">${initials(s.name)}<\/div>\n      <div>\n        <h2>${s.name}<\/h2>\n        <div class=\"subline\">${nationFlag(s.nat)} ${s.nat} · ${mainBadges} · ${s.club} (${s.league})<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"kv-grid\" style=\"margin-top:14px;\">\n      <div class=\"k\">Âge<\/div><div class=\"v\">${s.age} ans<\/div>\n      <div class=\"k\">Prix demandé<\/div><div class=\"v\">${formatValueM(s.price)}<\/div>\n    <\/div>\n    <p class=\"hint\" style=\"margin-top:10px;\">⚠️ Rapport de la cellule de recrutement — ces valeurs sont des <b>estimations<\/b>. À l'arrivée du joueur, le niveau réel peut différer de ±${state.scoutingErrorMargin} et le potentiel réel de ±10.<\/p>\n    <div class=\"modal-tabs\">\n      <button class=\"modal-tab active\" data-tab=\"sportif\">Sportif<\/button>\n      <button class=\"modal-tab\" data-tab=\"marche\">Marché<\/button>\n      <button class=\"modal-tab\" data-tab=\"adn\">ADN<\/button>\n    <\/div>\n\n    <div class=\"modal-pane active\" data-pane=\"sportif\">\n      <div class=\"kv-grid\">\n        <div class=\"k\">Niveau (estimé)<\/div><div class=\"v\"><b>${s.scoutedLevel}<\/b> \/ 100<\/div>\n        <div class=\"k\">Potentiel (estimé)<\/div><div class=\"v\">${s.scoutedPot} \/ 100<\/div>\n      <\/div>\n      <span class=\"field-label\">Postes<\/span>\n      <div class=\"chip-group\">${renderScoutPositionBadges(s)}<\/div>\n      <p class=\"hint\">Postes secondaires éventuels : inconnus tant que le joueur n'a pas rejoint le club.<\/p>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"marche\">\n      <div class=\"kv-grid\">\n        <div class=\"k\">Prix demandé<\/div><div class=\"v\">${formatValueM(s.price)}<\/div>\n        <div class=\"k\">Club actuel<\/div><div class=\"v\">${s.club}<\/div>\n        <div class=\"k\">Championnat<\/div><div class=\"v\">${s.league}<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"modal-pane\" data-pane=\"adn\">\n      <span class=\"field-label\">Traits observés par les recruteurs<\/span>\n      <div class=\"chip-group\">${s.trueAdn.visible.length? s.trueAdn.visible.map(a=>`<span class=\"badge\">${a}<\/span>`).join('') : '<span class=\"hint\">Aucun trait visible identifié pour l\\'instant.<\/span>'}<\/div>\n    <\/div>\n  `;\n  content.querySelectorAll('.modal-tab').forEach(t=>t.onclick=()=>{\n    content.querySelectorAll('.modal-tab').forEach(x=>x.classList.remove('active'));\n    content.querySelectorAll('.modal-pane').forEach(x=>x.classList.remove('active'));\n    t.classList.add('active');\n    content.querySelector(`.modal-pane[data-pane=\"${t.dataset.tab}\"]`).classList.add('active');\n  });\n  document.getElementById('playerModal').classList.add('open'); document.body.style.overflow='hidden';\n}\n\/* Anime un nombre affiché de \"from\" à \"to\" sur \"duration\" ms *\/\nfunction animateNumber(id, from, to, duration){\n  const el = document.getElementById(id);\n  if(!el) return;\n  const start = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();\n  function step(now){\n    const elapsed = now - start;\n    const t = Math.min(1, elapsed\/duration);\n    const eased = 1 - Math.pow(1-t, 3); \/\/ ease-out\n    el.textContent = Math.round(from + (to-from)*eased);\n    if(t<1) requestAnimationFrame(step);\n  }\n  requestAnimationFrame(step);\n}\n\/* Carte de révélation à l'arrivée d'un joueur recruté : anime le niveau et le potentiel\n   depuis l'estimation du recruteur (scoutedLevel\/scoutedPot) jusqu'à la vraie valeur. *\/\nfunction showRecruitReveal(p, scoutedLevel, scoutedPot){\n  const content = document.getElementById('modalContent');\n  const deltaLevel = p.level - scoutedLevel, deltaPot = p.pot - scoutedPot;\n  const deltaTxt = (d)=> d===0 ? 'conforme à l\\'estimation' : (d>0?`+${d}`:`${d}`);\n  const deltaClass = (d)=> d===0 ? '' : (d>0?'trend up':'trend down');\n  content.innerHTML = `\n    <div style=\"text-align:center;margin-bottom:6px;\">\n      <div class=\"avatar\" style=\"margin:0 auto 10px;\">${initials(p.name)}<\/div>\n      <h2 style=\"margin-bottom:2px;\">${p.name}<\/h2>\n      <p class=\"hint\" style=\"margin-top:0;\">Rejoint ${CLUB_NAME} — voici ce que révèle son profil réel<\/p>\n    <\/div>\n    <div class=\"divider\"><\/div>\n    <span class=\"field-label\">Niveau<\/span>\n    <div class=\"bar-row\">\n      <div class=\"top\"><span>Estimé par les recruteurs : ${scoutedLevel}<\/span><b id=\"revealLevelNum\">${scoutedLevel}<\/b><\/div>\n    <\/div>\n    <p class=\"${deltaClass(deltaLevel)}\" style=\"text-align:right;margin:2px 0 14px;font-size:12.5px;\">${deltaTxt(deltaLevel)}<\/p>\n\n    <span class=\"field-label\">Potentiel<\/span>\n    <div class=\"bar-row\">\n      <div class=\"top\"><span>Estimé par les recruteurs : ${scoutedPot}<\/span><b id=\"revealPotNum\">${scoutedPot}<\/b><\/div>\n    <\/div>\n    <p class=\"${deltaClass(deltaPot)}\" style=\"text-align:right;margin:2px 0 18px;font-size:12.5px;\">${deltaTxt(deltaPot)}<\/p>\n\n    ${p.sec.length ? `\n    <div class=\"divider\"><\/div>\n    <span class=\"field-label\">Postes secondaires découverts<\/span>\n    <div class=\"chip-group\" style=\"margin-bottom:6px;\">${p.sec.map(code=>`<span class=\"badge sec-pos\">${displayPosLabel(code)}<\/span>`).join(' ')}<\/div>\n    ` : ''}\n\n    <button class=\"btn btn-primary\" style=\"width:100%;margin-top:10px;\" onclick=\"closeModal()\">OK<\/button>\n  `;\n  document.getElementById('playerModal').classList.add('open'); document.body.style.overflow='hidden';\n  requestAnimationFrame(()=>{\n    setTimeout(()=>{\n      animateNumber('revealLevelNum', scoutedLevel, p.level, 1300);\n      animateNumber('revealPotNum', scoutedPot, p.pot, 1300);\n    }, 50);\n  });\n}\nfunction closeModal(){ document.getElementById('playerModal').classList.remove('open'); document.body.style.overflow=''; }\ndocument.getElementById('playerModal').addEventListener('click',e=>{ if(e.target.id==='playerModal') closeModal(); });\nfunction proposerRenouvellement(id){\n  const p=players.find(x=>x.id===id);\n  if(p.isLoan){ toast(`🚫 ${p.name} est en prêt${p.loanClub?' de '+p.loanClub:''} — impossible de prolonger son contrat, sa durée est fixée par le club prêteur.`); closeModal(); return; }\n  if(p.renewalBlockedUntilWeek && absoluteWeek() < p.renewalBlockedUntilWeek){ toast(`🚫 ${p.name} a rompu les négociations — patientez encore ${p.renewalBlockedUntilWeek-absoluteWeek()} semaine(s) avant de retenter.`); closeModal(); return; }\n  \/\/ Semaines restantes avant la fin du contrat actuel (en tenant compte de l'avancement de la\n  \/\/ saison en cours) — si le contrat expire dans les 6 prochains mois (26 semaines) ou moins,\n  \/\/ aucune des deux interdictions ci-dessous ne s'applique : il faut pouvoir le renouveler.\n  const weeksRemaining = (p.years-1)*52 + (52-state.week);\n  const nearExpiry = weeksRemaining <= 26;\n  if(!nearExpiry && p.years>=3){ toast(`🚫 ${p.name} a encore ${p.years} ans de contrat — trop tôt pour renégocier.`); closeModal(); return; }\n  const weeksSinceContract = absoluteWeek() - (p.lastContractWeek||0);\n  if(!nearExpiry && weeksSinceContract < 26){ toast(`🚫 ${p.name} a signé son contrat il y a moins de 6 mois — trop tôt pour le renouveler.`); closeModal(); return; }\n  const salVal=parseInt(document.getElementById('renewSal').value);\n  const selectedChip = document.querySelector('.chip[data-years].selected');\n  const proposedYears = selectedChip ? parseInt(selectedChip.dataset.years) : 1;\n  const chance = (salVal>=p.salary ? 0.75 : 0.3) + (p.moral\/500);\n  if(Math.random()<chance){\n    p.salary=salVal; p.years=Math.max(p.years, proposedYears); p.lastContractWeek=absoluteWeek();\n    toast(`✅ ${p.name} accepte la prolongation de ${proposedYears} an(s) à ${formatSalaryK(salVal)} \/ mois.`);\n    renderEffectif(); renderComposition(); renderOffers(); renderFinances();\n  } else {\n    if(Math.random() < 1\/3){\n      p.renewalBlockedUntilWeek = absoluteWeek() + 2;\n      toast(`❌ ${p.name} rompt les négociations, vexé par l'offre — il faudra patienter 2 semaines avant de retenter.`);\n    } else {\n      toast(`❌ ${p.name} refuse l'offre — son entourage réclame un salaire plus élevé.`);\n    }\n  }\n  closeModal();\n}\n\n\/* ============================================================\n   FINANCES (dynamique)\n   ============================================================ *\/\nfunction renderFinances(){\n  if(!document.getElementById('salLabel')) return; \/\/ onglet Finances retiré temporairement\n  const totalSalary = players.reduce((s,p)=>s+p.salary,0);\n  document.getElementById('salLabel').textContent = formatSalaryK(totalSalary)+' \/ '+formatSalaryK(state.salaryCap);\n  document.getElementById('salBar').style.width = clamp(totalSalary\/state.salaryCap*100,0,100)+'%';\n  const spent = +(state.transferBudgetTotal - state.transferBudget).toFixed(2);\n  document.getElementById('transLabel').textContent = spent.toFixed(1).replace('.',',')+' M€ \/ '+formatValueM(state.transferBudgetTotal);\n  document.getElementById('transBar').style.width = clamp(spent\/state.transferBudgetTotal*100,0,100)+'%';\n  document.getElementById('finTransferOut').textContent = '− '+formatValueM(spent);\n  document.getElementById('finSalaryOut').textContent = '− '+formatValueM(totalSalary*12\/1000);\n}\n\n\/* ============================================================\n   DASHBOARD (dynamique)\n   ============================================================ *\/\nfunction renderDashboard(){\n  document.getElementById('sidebarWeekNum').textContent = state.week;\n  setText('sidebarLeague', DIVISION_NAMES[state.division]);\n  setText('dashBudget', formatValueM(state.transferBudget));\n  const totalSalary = players.reduce((s,p)=>s+p.salary,0);\n  setText('dashSalaryTrend', `Plafond salarial : ${Math.round(totalSalary\/state.salaryCap*100)}% utilisé`);\n  setText('dashEffectif', players.length);\n  const avgMoral = Math.round(players.reduce((s,p)=>s+p.moral,0)\/players.length);\n  setText('dashMoral', avgMoral+'%');\n  setText('dateLine', `Saison 2025–${2025+state.season} · Semaine ${state.week}\/${WEEKS_TOTAL} · ${weekBlock(state.week).label}`);\n  renderRecrutHeader();\n  renderNextMatchInfo();\n}\n\n\/* ============================================================\n   CLASSEMENT\n   ============================================================ *\/\nfunction computeRankedTable(){\n  return LEAGUE_TEAMS.map(t=>({name:t,...standings[t]}))\n    .sort((a,b)=> (b.pts-a.pts) || ((b.bp-b.bc)-(a.bp-a.bc)) || (b.bp-a.bp));\n}\n\/* ============================================================\n   R - TABLEAU DE BORD \/ ACCUEIL\n   ============================================================ *\/\nfunction renderDashboardR(){\n  \/\/ R1 : Niveau de l'équipe = moyenne du onze actuel (choisi par le coach)\n  const starters = players.filter(p=>p.starter);\n  const niveauEquipe = starters.length ? Math.round(starters.reduce((s,p)=>s+p.level,0)\/starters.length) : 0;\n  setText('rNiveauEquipe', niveauEquipe);\n\n  \/\/ R2 : Potentiel de l'équipe = moyenne du potentiel de tout l'effectif\n  const potentielEquipe = players.length ? Math.round(players.reduce((s,p)=>s+p.pot,0)\/players.length) : 0;\n  setText('rPotentielEquipe', potentielEquipe);\n\n  \/\/ R3 : Âge de l'équipe = âge moyen de tout l'effectif\n  const ageEquipe = players.length ? (players.reduce((s,p)=>s+p.age,0)\/players.length).toFixed(1) : '0';\n  setText('rAgeEquipe', ageEquipe+' ans');\n\n  \/\/ R4 : Valeur de l'effectif = valeur totale\n  const valeurEffectif = players.reduce((s,p)=>s+playerValue(p.level,p.age,p.pot,p.stats,p.years),0);\n  setText('rValeurEffectif', formatValueM(valeurEffectif));\n\n  \/\/ R5 : Moral de l'effectif = moyenne\n  const moralEffectif = players.length ? Math.round(players.reduce((s,p)=>s+p.moral,0)\/players.length) : 0;\n  setText('rMoralEffectif', moralEffectif+'%');\n\n  \/\/ R6 : Classement (3e sauf si dans le top3, 2 au-dessus, nous, 2 en dessous, 1er relégable sauf si dans les 3 derniers)\n  const ranked = computeRankedTable();\n  const ourIdx = ranked.findIndex(t=>t.name===CLUB_NAME);\n  const rowsIdx = new Set();\n  if(ourIdx>2) rowsIdx.add(2); \/\/ 3e place (zone de promotion), sauf si on y est déjà\n  for(let i=Math.max(0,ourIdx-2); i<ourIdx; i++) rowsIdx.add(i); \/\/ 2 équipes au-dessus\n  rowsIdx.add(ourIdx);\n  for(let i=ourIdx+1; i<=Math.min(ranked.length-1,ourIdx+2); i++) rowsIdx.add(i); \/\/ 2 équipes en dessous\n  if(ourIdx<ranked.length-3) rowsIdx.add(ranked.length-3); \/\/ 1er relégable, sauf si on y est déjà\n  const sortedRows = [...rowsIdx].sort((a,b)=>a-b);\n  const standingsBody = document.getElementById('rStandingsTable');\n  if(standingsBody){\n    standingsBody.innerHTML = '';\n    let prevIdx = null;\n    sortedRows.forEach(idx=>{\n      if(prevIdx!==null && idx>prevIdx+1){\n        const trGap = document.createElement('tr');\n        trGap.innerHTML = `<td colspan=\"3\" style=\"text-align:center;color:var(--text-soft);\">···<\/td>`;\n        standingsBody.appendChild(trGap);\n      }\n      const t = ranked[idx];\n      const tr = document.createElement('tr');\n      if(t.name===CLUB_NAME) tr.className='me';\n      tr.innerHTML = `<td><span class=\"rank-cell ${idx<3?'top':''}\">${idx+1}<\/span><\/td><td><b>${t.name}<\/b><\/td><td style=\"text-align:right;\"><b>${t.pts}<\/b> pts<\/td>`;\n      standingsBody.appendChild(tr);\n      prevIdx = idx;\n    });\n  }\n\n  \/\/ R7 : Prochain match (adversaire + son classement + D\/E)\n  const nextMatchEl = document.getElementById('rNextMatch');\n  if(nextMatchEl){\n    const fx = getUserFixture();\n    if(fx){\n      const isHome = fx[0]===CLUB_NAME;\n      const opp = isHome ? fx[1] : fx[0];\n      const oppRank = ranked.findIndex(t=>t.name===opp)+1;\n      nextMatchEl.innerHTML = `<h3 style=\"margin-bottom:4px;\">${opp}<\/h3><p class=\"hint\" style=\"margin:0;\">${oppRank>0?oppRank+'e de '+DIVISION_NAMES[state.division]:''} — ${isHome?'Domicile (D)':'Extérieur (E)'}<\/p>`;\n    } else {\n      const next = findNextFixtureFromWeek(state.week+1);\n      if(next){\n        const isHome = next.fx[0]===CLUB_NAME;\n        const opp = isHome ? next.fx[1] : next.fx[0];\n        const oppRank = ranked.findIndex(t=>t.name===opp)+1;\n        nextMatchEl.innerHTML = `<h3 style=\"margin-bottom:4px;\">${opp}<\/h3><p class=\"hint\" style=\"margin:0;\">${oppRank>0?oppRank+'e de '+DIVISION_NAMES[state.division]:''} — ${isHome?'Domicile (D)':'Extérieur (E)'} · Semaine ${next.week}<\/p>`;\n      } else {\n        nextMatchEl.innerHTML = `<p class=\"hint\">Aucun match à venir cette saison.<\/p>`;\n      }\n    }\n  }\n\n  \/\/ R8 \/ R9 : Budget transfert & marge salariale\n  setText('rBudgetTransfert', formatValueM(state.transferBudget));\n  setText('rMargeSalariale', formatSalaryK(salaryCapRemaining()));\n\n  \/\/ R10 : forme récente (5 derniers résultats)\n  const formeMap = { V:'✅', N:'➖', D:'❌' };\n  setText('rFormeRecente', state.recentForm.length ? state.recentForm.map(r=>formeMap[r]).join(' ') : '—');\n\n  \/\/ R11 \/ R12 : meilleur buteur \/ passeur du club\n  const topScorer = players.slice().sort((a,b)=>b.stats.g-a.stats.g)[0];\n  const topAssist = players.slice().sort((a,b)=>b.stats.a-a.stats.a)[0];\n  setText('rMeilleurButeur', topScorer && topScorer.stats.g>0 ? `${topScorer.name} (${topScorer.stats.g})` : 'Aucun but marqué');\n  setText('rMeilleurPasseur', topAssist && topAssist.stats.a>0 ? `${topAssist.name} (${topAssist.stats.a})` : 'Aucune passe décisive');\n  const topScorerCard = document.getElementById('rMeilleurButeurCard');\n  if(topScorerCard) topScorerCard.onclick = topScorer ? ()=>goToPlayerInEffectif(topScorer.id) : null;\n  const topAssistCard = document.getElementById('rMeilleurPasseurCard');\n  if(topAssistCard) topAssistCard.onclick = topAssist ? ()=>goToPlayerInEffectif(topAssist.id) : null;\n\n  \/\/ R13 : alertes\n  const blesses = players.filter(p=>p.injuryWeeksLeft>0);\n  setText('rAlertBlesses', blesses.length);\n  setText('rAlertContrats', players.filter(p=>p.years<=1).length);\n  setText('rAlertOffres', receivedOffers.length);\n  setText('rAlertOptions', pendingLoanOptions.length);\n\n  \/\/ Coupe de France\n  const cupEl = document.getElementById('rCupStatus');\n  if(cupEl && state.cup){\n    if(state.cup.wonTrophy) cupEl.textContent = `🏆 Vainqueur de la Coupe de France cette saison !`;\n    else if(state.cup.eliminated) cupEl.textContent = `Éliminé en ${CUP_ROUND_NAMES[state.cup.bestRoundReached+1] || CUP_ROUND_NAMES[0]}.`;\n    else if(state.cup.opponent) cupEl.textContent = `${CUP_ROUND_NAMES[state.cup.roundIndex]} : ${state.cup.opponent} (${state.cup.isHomeThisRound?'domicile':'extérieur'}), Semaine ${CUP_ROUND_WEEKS[state.cup.roundIndex]}.`;\n    else cupEl.textContent = `Prochain tour : ${CUP_ROUND_NAMES[state.cup.roundIndex]}, Semaine ${CUP_ROUND_WEEKS[state.cup.roundIndex]}.`;\n  }\n\n  \/\/ Le président\n  setText('rPresidentSaleShare', state.presidentSaleSharePct+'%');\n  setText('rPresidentAcademy', state.academyQualityBonus>0 ? `+${state.academyQualityBonus} niveau` : 'Standard');\n  setText('rPresidentScouting', `±${state.scoutingErrorMargin} niveau`);\n  const st = state.stadiumExpansion;\n  setText('rPresidentStadium', st.active ? `Travaux en cours (${st.yearsRemaining} saison${st.yearsRemaining>1?'s':''} restante${st.yearsRemaining>1?'s':''})` : st.expanded ? 'Agrandi ✅' : 'Standard');\n}\nfunction renderClassement(){\n  const ranked = computeRankedTable();\n  setText('classementLeagueName', DIVISION_NAMES[state.division]); document.getElementById('classementHead').innerHTML = isMobileViewport() ? `<tr><th>#<\/th><th>Club<\/th><th>Pts<\/th><th>J<\/th><th>G<\/th><th>N<\/th><th>P<\/th><th>BP<\/th><th>BC<\/th><th>Diff<\/th><\/tr>` : `<tr><th>#<\/th><th>Club<\/th><th>J<\/th><th>G<\/th><th>N<\/th><th>P<\/th><th>BP<\/th><th>BC<\/th><th>Diff<\/th><th>Pts<\/th><\/tr>`;\n  const tbody=document.getElementById('classementTable'); tbody.innerHTML=\"\";\n  ranked.forEach((t,i)=>{\n    const tr=document.createElement('tr');\n    tr.id = 'clsRow-'+encodeURIComponent(t.name);\n    if(t.name===CLUB_NAME){ tr.className='me'; tr.style.cursor='pointer'; tr.title='Aller au Tableau de bord'; tr.onclick=()=>goToTab('dashboard'); }\n    tr.innerHTML = isMobileViewport() ? `<td><span class=\"rank-cell ${i<3?'top':''}\">${i+1}<\/span><\/td><td><b>${t.name}<\/b><\/td><td><b>${t.pts}<\/b><\/td><td>${t.j}<\/td><td>${t.g}<\/td><td>${t.n}<\/td><td>${t.p}<\/td><td>${t.bp}<\/td><td>${t.bc}<\/td><td>${t.bp-t.bc>0?'+':''}${t.bp-t.bc}<\/td>` : `<td><span class=\"rank-cell ${i<3?'top':''}\">${i+1}<\/span><\/td><td><b>${t.name}<\/b><\/td><td>${t.j}<\/td><td>${t.g}<\/td><td>${t.n}<\/td><td>${t.p}<\/td><td>${t.bp}<\/td><td>${t.bc}<\/td><td>${t.bp-t.bc>0?'+':''}${t.bp-t.bc}<\/td><td><b>${t.pts}<\/b><\/td>`;\n    tbody.appendChild(tr);\n  });\n  document.getElementById('classementJournee').textContent = `Journée ${Math.min(standings[CLUB_NAME].j,SCHEDULE.length)} \/ ${SCHEDULE.length}`;\n  const ourRank = ranked.findIndex(t=>t.name===CLUB_NAME)+1;\n  setText('dashRankPill', ourRank+'ᵉ au classement');\n}\n\/* Va au Classement et surligne brièvement une équipe précise (la nôtre par défaut). *\/\nfunction goToClassement(teamName){\n  goToTab('classement');\n  setTimeout(()=>{\n    const row = document.getElementById('clsRow-'+encodeURIComponent(teamName||CLUB_NAME));\n    if(row){\n      row.scrollIntoView({block:'center', behavior:'smooth'});\n      row.classList.add('row-highlight');\n      setTimeout(()=>row.classList.remove('row-highlight'), 1000);\n    }\n  }, 60);\n}\n\n\/* ============================================================\n   PROCHAIN MATCH \/ INFOS\n   ============================================================ *\/\n\/* Liste tous les matchs applicables à la semaine en cours (championnat, coupe, Europe) — il peut\n   y en avoir plusieurs la même semaine, joués les uns après les autres avant de passer à la\n   semaine suivante. Ordre de priorité : championnat, puis Coupe de France, puis Europe. *\/\nfunction getPendingFixturesThisWeek(){\n  const fixtures = [];\n  const idx = weekMatchIndex(state.week);\n  \/\/ standings[CLUB_NAME].j <= idx : le nombre de matchs déjà joués n'a pas encore atteint cette\n  \/\/ journée (idx est 0-based) — sinon le match de cette semaine a déjà été résolu, et le\n  \/\/ reproposer indéfiniment bloquerait la progression des semaines (bug).\n  if(idx!==null && idx<SCHEDULE.length && standings[CLUB_NAME].j<=idx){\n    const fx = SCHEDULE[idx].find(pair=>pair.includes(CLUB_NAME));\n    if(fx) fixtures.push({type:'league', fx});\n  }\n  if(state.cup && !state.cup.eliminated && !state.cup.wonTrophy && state.cup.opponent && CUP_ROUND_WEEKS[state.cup.roundIndex]===state.week){\n    fixtures.push({type:'cup', fx: state.cup.isHomeThisRound ? [CLUB_NAME, state.cup.opponent] : [state.cup.opponent, CLUB_NAME]});\n  }\n  if(state.euro && !state.euro.eliminated && !state.euro.wonTrophy && state.euro.opponent){\n    const isEuroWeek = state.euro.phase==='league' ? EURO_LEAGUE_PHASE_WEEKS[state.euro.matchesPlayed]===state.week : EURO_KNOCKOUT_WEEKS[state.euro.knockoutRoundIndex]===state.week;\n    if(isEuroWeek) fixtures.push({type:'euro', fx: state.euro.isHomeThisMatch ? [CLUB_NAME, state.euro.opponent] : [state.euro.opponent, CLUB_NAME]});\n  }\n  return fixtures;\n}\nfunction getUserFixture(){\n  const pending = getPendingFixturesThisWeek();\n  return pending.length ? pending[0].fx : null;\n}\nfunction findNextFixtureFromWeek(week){\n  for(let w=week; w<=WEEKS_TOTAL; w++){\n    const idx = weekMatchIndex(w);\n    if(idx!==null && idx<SCHEDULE.length){\n      const fx = SCHEDULE[idx].find(pair=>pair.includes(CLUB_NAME));\n      if(fx) return {fx, week:w};\n    }\n    if(state.cup && !state.cup.eliminated && !state.cup.wonTrophy && CUP_ROUND_WEEKS[state.cup.roundIndex]===w){\n      \/\/ L'adversaire de coupe n'est tiré qu'au début du tour ; on l'affiche une fois connu.\n      if(state.cup.opponent) return { fx: state.cup.isHomeThisRound ? [CLUB_NAME, state.cup.opponent] : [state.cup.opponent, CLUB_NAME], week:w, isCup:true };\n    }\n  }\n  return null;\n}\nfunction renderNextMatchInfo(){\n  const fx = getUserFixture();\n  if(!fx){\n    const next = findNextFixtureFromWeek(state.week+1);\n    if(next){\n      const isHome = next.fx[0]===CLUB_NAME;\n      const opp = isHome? next.fx[1] : next.fx[0];\n      const txt = `vs ${opp} — Semaine ${next.week}`;\n      setText('dashNextPill', 'Prochain match : '+txt);\n      document.getElementById('sidebarNext').innerHTML = `Prochain match<br><b>${txt}<\/b>`;\n      setHTML('mobileNextMatch', `Prochain match<br><b>${txt}<\/b>`);\n    } else {\n      setText('dashNextPill', 'Prochain match : saison terminée');\n      document.getElementById('sidebarNext').innerHTML = 'Prochain match<br><b>Saison terminée<\/b>';\n      setHTML('mobileNextMatch', 'Prochain match<br><b>Saison terminée<\/b>');\n    }\n    return;\n  }\n  const isHome = fx[0]===CLUB_NAME;\n  const opp = isHome? fx[1] : fx[0];\n  const txt = `vs ${opp} (${isHome?'D':'E'})`;\n  setText('dashNextPill', 'Prochain match : '+txt);\n  document.getElementById('sidebarNext').innerHTML = `Prochain match<br><b>${txt}<\/b>`;\n  setHTML('mobileNextMatch', `Prochain match<br><b>${txt}<\/b>`);\n}\n\n\/* ============================================================\n   MOTEUR DE MATCH\n   ============================================================ *\/\nlet matchState = null;\n\n\/* ---------- CHOIX AUTOMATIQUE DE LA TACTIQUE (FORMATION) PAR LE COACH ---------- *\/\n\/* ============================================================\n   Q - CALCUL DES MATCHS\n   ============================================================ *\/\n\/* Q1 : niveau ajusté d'un joueur = niveau brut + Forme complète (I1 retour de blessure,\n   I2 forme de l'équipe, I3 intégration, I4 moral) + chimie avec le coach (E9, ADN\n   affinité\/incompatibilité). Utilisé à la fois pour composer le onze (fitScore) et pour\n   calculer le résultat du match : la Forme influence donc directement les deux. *\/\n\/* ADN Irrégulier (D10) : à chaque semaine de match, 50% de chances de +10, sinon −10 — tiré une\n   seule fois par semaine et mémorisé sur le joueur, pour que tous les calculs de cette semaine\n   (choix du onze, scores d'attaque\/défense) utilisent la même valeur. *\/\nfunction getIrregulierMatchMod(p){\n  if(p.irregWeek !== state.week){\n    p.irregWeek = state.week;\n    p.irregMod = Math.random()<0.5 ? 10 : -10;\n  }\n  return p.irregMod;\n}\n\/* Niveau de référence de notre équipe (moyenne des Niveaux bruts des titulaires), utilisé\n   uniquement pour comparer à l'adversaire (ADN Fort contre les forts\/faibles) — basé sur le\n   Niveau brut, pas le Niveau ajusté, pour éviter toute dépendance circulaire. *\/\nfunction computeOwnReferenceLevel(){\n  const starters = players.filter(p=>p.starter);\n  const pool = starters.length ? starters : players;\n  if(!pool.length) return 50;\n  return pool.reduce((s,p)=>s+p.level,0)\/pool.length;\n}\n\/* Niveau (CLUB_STRENGTH) de l'adversaire du match de la semaine en cours, ou null hors contexte\n   de match (ex. écran effectif consulté une semaine sans rencontre programmée). *\/\nfunction getCurrentOpponentLevel(){\n  const fx = getUserFixture();\n  if(!fx) return null;\n  const opponent = fx[0]===CLUB_NAME ? fx[1] : fx[0];\n  return CLUB_STRENGTH[opponent]!==undefined ? CLUB_STRENGTH[opponent] : null;\n}\n\/* ADN Fort contre les forts \/ Fort contre les faibles (D10) : ±10 selon que l'adversaire du jour\n   est mieux ou moins bien noté (CLUB_STRENGTH) que notre propre effectif titulaire. *\/\nfunction computeVsOpponentADNDelta(adn){\n  const oppLvl = getCurrentOpponentLevel();\n  if(oppLvl===null) return 0;\n  const oppIsStronger = oppLvl > computeOwnReferenceLevel();\n  if(adn.includes('Fort contre les forts')) return oppIsStronger ? 10 : -10;\n  if(adn.includes('Fort contre les faibles')) return oppIsStronger ? -10 : 10;\n  return 0;\n}\nfunction computeAdjustedLevel(p){\n  const i1 = p.i1Malus||0;\n  const i2 = computeTeamFormI2();\n  const i3 = p.i3Malus||0;\n  const i4 = computeI4(p.moral);\n  const i5 = p.fatigueMalus||0;\n  const i6 = computeHorsDeFormeMalus(p);\n  const adn = actualADN(p);\n  let chemistry = 0;\n  if(adn.some(a=>coach.adnAffinity.includes(a))) chemistry += 15;\n  if(adn.includes(coach.adnIncompatibility)) chemistry -= 5;\n  if(p.starter && knownADN(p).includes(\"Joueur de l'ombre\")) chemistry -= 10; try{ chemistry += players.filter(q=>q.starter && q.id!==p.id && knownADN(q).includes(\"Joueur de l'ombre\")).length * 2; }catch(eTDZ){} if(knownADN(p).includes('Chouchou du coach')) chemistry -= 6;\n  if(adn.includes('Irrégulier')) chemistry += getIrregulierMatchMod(p);\n  if(adn.includes('Fort contre les forts') || adn.includes('Fort contre les faibles')) chemistry += computeVsOpponentADNDelta(adn);\n  return p.level + i1 + i2 + i3 + i4 + i5 + i6 + chemistry;\n}\n\/* I6 : hors de forme — un joueur qui n'a pas joué depuis longtemps devient de plus en plus\n   rouillé, par paliers selon le nombre de matchs consécutifs sans jouer. *\/\nfunction computeHorsDeFormeMalus(p){\n  if(p.mainPos.includes('GB')) return 0; \/\/ les gardiens ne sont jamais concernés par le hors de forme\n  const streak = p.consecutiveMatchesBenched||0;\n  if(streak>=20) return -4;\n  if(streak>=15) return -3;\n  if(streak>=10) return -2;\n  if(streak>=5) return -1;\n  return 0;\n}\n\/* I5 (fatigue) \/ I6 (hors de forme) : mis à jour une fois par match réellement joué (pas par\n   semaine, pour bien compter les matchs consécutifs quel que soit le nombre de matchs joués\n   une semaine donnée — championnat, coupe ou Europe confondus). Les gardiens ne sont jamais\n   concernés par ces deux facteurs. *\/\nfunction updateFatigueAndForme(){\n  players.forEach(p=>{\n    if(p.mainPos.includes('GB')) return;\n    if(p.starter){\n      p.consecutiveMatchesStarted = (p.consecutiveMatchesStarted||0) + 1;\n      p.consecutiveMatchesBenched = 0;\n      if(p.consecutiveMatchesStarted>=7){\n        p.fatigueMalus = (p.fatigueMalus||0) - 1; \/\/ le malus continue de s'accumuler chaque match titulaire\n      }\n    } else {\n      p.consecutiveMatchesStarted = 0;\n      p.consecutiveMatchesBenched = (p.consecutiveMatchesBenched||0) + 1;\n      if((p.fatigueMalus||0) < 0){\n        p.fatigueMalus = Math.min(0, p.fatigueMalus + 2); \/\/ récupération de 2 par match de repos, plafonnée à 0\n      }\n    }\n  });\n}\n\/* Q2 : bonus du coach dérivé de son Vrai Niveau \"Match\" cachée (E3, échelle ~40-60) *\/\nfunction computeCoachMatchBonus(){\n  return (coach.trueLevelMatch - 50) \/ 2;\n}\n\/* Répartition Attaque \/ Défense selon le poste occupé dans la tactique du match :\n   BU\/AiD\/AiG\/MOC = 100% attaque ; G\/DC\/DD\/DG\/MDC = 100% défense ; MC\/MD\/MG = moitié-moitié. *\/\nconst ATTACK_WEIGHT  = { BU:1, AiD:1, AiG:1, MOC:1, MC:0.5, MD:0.5, MG:0.5, GB:0, DC:0, DD:0, DG:0, MDC:0 };\nconst DEFENSE_WEIGHT = { BU:0, AiD:0, AiG:0, MOC:0, MC:0.5, MD:0.5, MG:0.5, GB:1, DC:1, DD:1, DG:1, MDC:1 };\nfunction computeAttackDefenseScores(){\n  refreshCoachSelections(); \/\/ assure une assignation à jour avec le onze actuel\n  const assignment = state.currentTactiqueAssignment || [];\n  const coachBonus = computeCoachMatchBonus();\n  const styleBonus = computeStyleAdnDelta(coach.style); \/\/ E2 : adéquation ADN de l'e
