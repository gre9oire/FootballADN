 1 serait manqué\n  state.ceremonyShownThisSeason = false;\n  generateWeeklyScouts();\n  handlePromotionRelegation(); \/\/ montée\/relégation : renouvelle LEAGUE_TEAMS\/SCHEDULE pour la saison prochaine\n  processPresidentDecisions(); \/\/ le président gère ses propres leviers financiers, indépendamment du DS\n  LEAGUE_TEAMS.forEach(t=>standings[t]={j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0});\n  players.forEach(p=>{ p.moral = computeSatisfaction(p); });\n\n  \/\/ Évolution tactique du coach (formations connues), pondérée par les taux d'apparition\n  const allFamilies = Object.keys(TACTIQUES);\n  const unknown = allFamilies.filter(f=>!coach.primaryTactiques.includes(f) && !coach.secondaryTactiques.includes(f));\n  if(unknown.length && Math.random()<0.5){\n    const totalRate = unknown.reduce((s,f)=>s+TACTIQUES[f].rate,0);\n    let r = Math.random()*totalRate, found = unknown[unknown.length-1];\n    for(const f of unknown){ r-=TACTIQUES[f].rate; if(r<=0){ found=f; break; } }\n    coach.secondaryTactiques.push(found);\n    toast(`📘 ${coach.name} a ajouté le ${found} à son répertoire tactique.`);\n  }\n  if(coach.secondaryTactiques.length && Math.random()<0.3){\n    const idx = Math.floor(Math.random()*coach.secondaryTactiques.length);\n    const promoted = coach.secondaryTactiques.splice(idx,1)[0];\n    coach.primaryTactiques.push(promoted);\n    toast(`⭐ Le ${promoted} devient une tactique principale de ${coach.name} !`);\n  }\n  autoSelectStarters();\n  refreshCoachSelections();\n\n  \/\/ E7 - Fin de contrat du coach : c'est le club qui décide, pas le DS. Il est simplement informé.\n  coach.contractYears = Math.max(0, coach.contractYears - 1);\n  if(coach.contractYears <= 0){\n    const previousCoachName = coach.name;\n    coach = generateCoach();\n    autoSelectStarters();\n    refreshCoachSelections();\n    toast(`📋 Fin de contrat de ${previousCoachName} : le club a nommé ${coach.name} comme nouvel entraîneur.`);\n  }\n\n  setText('tenureText', `Saison ${Math.min(state.season,5)} \/ 5`);\n  const tenureFillEl = document.getElementById('tenureFill');\n  if(tenureFillEl) tenureFillEl.style.width=(Math.min(state.season,5)\/5*100)+'%';\n  renderEffectif(); renderComposition(); renderOffers(); renderClassement(); renderDashboard(); renderDashboardR(); renderPreMatch(); renderCoachTab(); renderRecrutHeader();\n  toast(`🏁 Fin de saison : effectif vieilli, contrats mis à jour, nouveau calendrier de ${DIVISION_NAMES[state.division]} lancé.`); autoSaveGame();\n}\n\n\/* ============================================================\n   INIT\n   ============================================================ *\/\nlet _autoSelectCache = null;\nfunction autoSelectStarters(){\n  const hash = computeXIStateHash();\n  if(_autoSelectCache && _autoSelectCache.hash===hash){\n    const ids = _autoSelectCache.starterIds;\n    players.forEach(p=>{ p.starter = ids.has(p.id); });\n    return;\n  }\n  const families = [\n    ...coach.primaryTactiques.map(f=>({f,isPrimary:true})),\n    ...coach.secondaryTactiques.map(f=>({f,isPrimary:false}))\n  ];\n  let best=null;\n  families.forEach(({f,isPrimary})=>{\n    Object.keys(TACTIQUES[f].variants).forEach(variantName=>{\n      const shape = buildShape(f, variantName);\n      const res = assignStartersToShape(players, shape.flat);\n      if(!res.feasible) return;\n      const finalAvg = isPrimary ? res.avg : res.avg-3;\n      if(!best || finalAvg>best.avg) best={assignment:res.assignment, avg:finalAvg};\n    });\n  });\n  if(!best){\n    \/\/ Aucune tactique connue n'est réalisable avec l'effectif actuel : on tente de faire\n    \/\/ monter un jeune du centre de formation pour combler le(s) poste(s) vide(s), puis on\n    \/\/ retente une fois avant de se rabattre sur une affectation dégradée.\n    fillEmptyPositionGaps(0);\n    families.forEach(({f,isPrimary})=>{\n      Object.keys(TACTIQUES[f].variants).forEach(variantName=>{\n        const shape = buildShape(f, variantName);\n        const res = assignStartersToShape(players, shape.flat);\n        if(!res.feasible) return;\n        const finalAvg = isPrimary ? res.avg : res.avg-3;\n        if(!best || finalAvg>best.avg) best={assignment:res.assignment, avg:finalAvg};\n      });\n    });\n  }\n  if(!best){\n    \/\/ Dernier recours absolu (ne devrait jamais se produire) : affectation d'urgence silencieuse.\n    const family = coach.primaryTactiques[0];\n    const variantName = Object.keys(TACTIQUES[family].variants)[0];\n    const shape = buildShape(family, variantName);\n    const pool = players.slice();\n    const assignment = shape.flat.map(slotPos=>{\n      let bestIdx=0, bestScore=-Infinity;\n      pool.forEach((p,idx)=>{\n        const isGBSlot=slotPos===\"GB\", isGBPlayer=p.mainPos.includes(\"GB\");\n        const adjLvl = computeAdjustedLevel(p); let sc = (p.injuryWeeksLeft>0) ? -99999 : (isGBSlot!==isGBPlayer) ? -9999 : (p.mainPos.includes(slotPos)?adjLvl : p.sec.includes(slotPos)?adjLvl-5 : adjLvl-25);\n        if(sc>bestScore){ bestScore=sc; bestIdx=idx; }\n      });\n      const chosen = pool.splice(bestIdx,1)[0];\n      return { slot:slotPos, player:chosen, score:bestScore };\n    });\n    const avg = assignment.reduce((s,a)=>s+a.score,0)\/shape.flat.length;\n    best = { assignment, avg };\n  }\n  players.forEach(p=>p.starter=false);\n  if(best) best.assignment.forEach(a=>{ if(a && a.player) a.player.starter=true; });\n  _autoSelectCache = { hash: computeXIStateHash(), starterIds: new Set(players.filter(p=>p.starter).map(p=>p.id)) };\n}\nautoSelectStarters();\nrenderChips();\nrenderScouts();\nrenderRecrutHeader();\nrenderOffers();\nrenderEffectif();\nrenderComposition();\nrenderCoachTab();\nrenderGlossary();\nrenderClassement();\nrenderFinances();\nrenderDashboard();\nrenderDashboardR();\nupdateSaveUI();\nrenderPreMatch();\n\n\/* ============================================================\n   MENU DE DÉMARRAGE : choix du pays, de la division, puis du club parmi 3 propositions\n   ============================================================ *\/\nconst START_MENU_COUNTRIES = [ { key:'France', label:'France', divisions: [ { key:'L1', label:\"Division Élite\", pool: L1_POOL }, { key:'L2', label:'Division Excellence', pool: L2_POOL }, { key:'N', label:'Division Honneur', pool: NATIONAL_POOL }, { key:'N1', label:'Division Promotion 1', pool: N1_POOL }, { key:'N2', label:'Division Promotion 2', pool: N2_POOL } ] } ]; function buildStartCandidate(clubName, divisionKey){\n  const savedDivision = state.division;\n  state.division = divisionKey;\n  const cand = { clubName, division:divisionKey, squad: generateInitialSquad(), coach: generateCoach() };\n  state.division = savedDivision;\n  return cand;\n}\nfunction evaluateStartCandidate(cand){\n  const savedPlayers = players, savedCoach = coach, savedClub = CLUB_NAME, savedDivision = state.division;\n  players = cand.squad; coach = cand.coach; CLUB_NAME = cand.clubName; state.division = cand.division;\n  autoSelectStarters();\n  refreshCoachSelections();\n  cand.avgLevel = Math.round(cand.squad.reduce((s,p)=>s+p.level,0)\/cand.squad.length);\n  cand.styleTitle = STYLES[state.currentStyle] ? STYLES[state.currentStyle].title : '—';\n  players = savedPlayers; coach = savedCoach; CLUB_NAME = savedClub; state.division = savedDivision;\n}\nlet START_CANDIDATES = [];\nfunction generateStartCandidates(countryKey, divisionKey){\n  const country = START_MENU_COUNTRIES.find(c=>c.key===countryKey);\n  const division = country.divisions.find(d=>d.key===divisionKey);\n  const pool = division.pool.slice();\n  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }\n  START_CANDIDATES = pool.slice(0,3).map(name=>buildStartCandidate(name, divisionKey));\n  START_CANDIDATES.forEach(evaluateStartCandidate);\n  renderStartMenu();\n}\nfunction populateStartSelectors(){\n  const countrySelect = document.getElementById('startCountrySelect');\n  if(!countrySelect) return;\n  countrySelect.innerHTML = START_MENU_COUNTRIES.map(c=>`<option value=\"${c.key}\">${c.label}<\/option>`).join('');\n  onStartCountryChange();\n}\nfunction onStartCountryChange(){\n  const countryKey = document.getElementById('startCountrySelect').value;\n  const country = START_MENU_COUNTRIES.find(c=>c.key===countryKey);\n  const divisionSelect = document.getElementById('startDivisionSelect');\n  divisionSelect.innerHTML = country.divisions.map(d=>`<option value=\"${d.key}\">${d.label}<\/option>`).join('');\n  divisionSelect.disabled = country.divisions.length<=1;\n  onStartDivisionChange();\n}\nfunction onStartDivisionChange(){\n  const countryKey = document.getElementById('startCountrySelect').value;\n  const divisionKey = document.getElementById('startDivisionSelect').value;\n  generateStartCandidates(countryKey, divisionKey);\n}\n\nfunction renderStartMenu(){\n  const grid = document.getElementById('startClubGrid');\n  if(!grid) return;\n  grid.innerHTML = START_CANDIDATES.map((c,i)=>`\n    <div class=\"start-club-card\" onclick=\"chooseStartClub(${i})\">\n      <div class=\"crest\">${clubCode(c.clubName)}<\/div>\n      <h3>${c.clubName}<\/h3>\n      <div class=\"kv-grid\">\n        <div class=\"k\">Niveau moyen<\/div><div class=\"v\">${c.avgLevel}<\/div>\n        <div class=\"k\">Style du coach<\/div><div class=\"v\">${c.styleTitle}<\/div>\n      <\/div>\n    <\/div>\n  `).join('');\n}\n\nfunction chooseStartClub(idx){\n  const c = START_CANDIDATES[idx];\n  players = c.squad; coach = c.coach; CLUB_NAME = c.clubName; state.division = c.division;\n  \/\/ Reconstruit le championnat pour le pool réel de la division choisie (notre club en fait\n  \/\/ déjà partie, puisque les candidats sont tirés directement de ce pool).\n  LEAGUE_TEAMS = (DIVISION_POOLS[c.division] || []).slice();\n  standings = {};\n  LEAGUE_TEAMS.forEach(t=>standings[t]={j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0});\n  SCHEDULE = generateRoundRobin(LEAGUE_TEAMS);\n  academy = generateInitialAcademy();\n  state.matchNotesHistory = [];\n  scouts = []; receivedOffers = []; pendingLoanOptions = [];\n  initClubDivisions(); \/\/ mémoire persistante : qui est actuellement dans quelle division\n  initCup(); \/\/ Coupe de France : initialisation pour la nouvelle partie\n  state.loanedOutThisSeason = [];\n  state.matchesThisWeekCount = 0;\n  state.euro = null; state.nextSeasonEuroCompetition = null; \/\/ pas de coupe d'Europe la 1ère saison\n  drawNewCaptains(); \/\/ S - Capitanat : tirage initial\n  generateWeeklyScouts();\n  autoSelectStarters();\n  refreshCoachSelections();\n  setText('sidebarCrest', clubCode(CLUB_NAME));\n  setText('sidebarClubName', CLUB_NAME);\n  setText('preMatchUsCrest', clubCode(CLUB_NAME));\n  setText('preMatchUsName', CLUB_NAME);\n  setText('liveUsCrest', clubCode(CLUB_NAME));\n  renderChips(); renderScouts(); renderRecrutHeader(); renderOffers(); renderEffectif();\n  renderComposition(); renderCoachTab(); renderGlossary(); renderClassement(); renderFinances();\n  renderDashboard(); renderDashboardR(); renderPreMatch();\n  const overlay = document.getElementById('startMenuOverlay');\n  if(overlay) overlay.style.display = 'none';\n}\npopulateStartSelectors();\n<\/script>\n\n\n<\/body><\/html>"</script>
