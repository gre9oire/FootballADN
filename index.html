  const ia = Math.floor(Math.random()*arr.length);\n  let ib = arr.length>1 ? Math.floor(Math.random()*(arr.length-1)) : 0;\n  if(arr.length>1 && ib>=ia) ib++;\n  return [arr[ia], arr[ib]];\n}\n\n\/* ---- Assemblage d'un joueur complet ---- *\/\n\/* ---------- Numéro de maillot : attribué une fois pour toutes à l'arrivée du joueur ---------- *\/\nconst JERSEY_POSITION_MAP = {\n  1: ['GB'],\n  2: ['DC','DG','DD'], 3: ['DC','DG','DD'], 4: ['DC','DG','DD'], 5: ['DC','DG','DD'],\n  6: ['MDC','MC','MOC','MG','MD'], 8: ['MDC','MC','MOC','MG','MD'], 10: ['MDC','MC','MOC','MG','MD'],\n  7: ['AiD','AiG'], 11: ['AiD','AiG'],\n  9: ['BU']\n};\nfunction eligibleJerseyNumbersFor(pos){\n  return Object.keys(JERSEY_POSITION_MAP).map(Number).filter(n=>JERSEY_POSITION_MAP[n].includes(pos));\n}\nfunction assignJerseyNumber(player, squadRef){\n  const pool = squadRef || players;\n  const used = new Set(pool.filter(p=>p.number).map(p=>p.number));\n  const pos = player.mainPos[0];\n  const squadSize = Math.max(pool.length+1, 18);\n  const pick = (candidates)=>{\n    const avail = candidates.filter(n=>!used.has(n));\n    return avail.length ? avail[Math.floor(Math.random()*avail.length)] : null;\n  };\n  const roll = Math.random();\n  let num = null;\n  if(roll < 0.90) num = pick(eligibleJerseyNumbersFor(pos)); \/\/ 90% : un numéro 1-11 compatible avec son poste\n  if(num===null){\n    const midRange = []; for(let n=12;n<=squadSize;n++) midRange.push(n);\n    num = pick(midRange); \/\/ 5% (ou repli) : entre 12 et l'effectif du club\n  }\n  if(num===null){\n    let n = squadSize+1; \/\/ 5% (ou dernier repli) : un autre numéro, au-delà de l'effectif\n    while(used.has(n)) n++;\n    num = n;\n  }\n  player.number = num;\n}\nfunction generatePlayer(opts){\n  opts = opts || {};\n  const {pos, mainPos, sec} = opts.forcePos ? generatePositionsFrom(opts.forcePos) : generatePositions(!!opts.forceGB);\n  const age = generateAge(!!opts.isYouth);\n  const adn = generateADN();\n  const knownNow = [...adn.visible, ...adn.hidden.map(h=>h.name)];\n  const {potential, truePotential, level} = generatePotentialAndLevel(age, knownNow, divisionLevelCeiling(opts.division));\n  const newPlayerNat = generateNationality(opts.division);\n  const newPlayer = {\n    id: nextPlayerId++,\n    name: generateName(newPlayerNat),\n    pos, mainPos, sec, age,\n    retirementAge: generateRetirementAge(pos),\n    level, pot: potential, truePot: truePotential,\n    nat: newPlayerNat,\n    salary: playerSalaryK(level, age),\n    years: 1+Math.floor(Math.random()*4),\n    moral: 65+Math.floor(Math.random()*20),\n    adnVisible: adn.visible, adnHidden: adn.hidden,\n    starter:false,\n    injuryWeeksLeft:0, injuryTier:null,\n    coachRelation:'C', vieProScore: 30+Math.floor(Math.random()*71), listedTransfer:false, listedPretSec:false, listedPretOA:false,\n    i1Malus:0, i3Malus: opts.alreadyIntegrated ? 0 : -2,\n    levelAtSeasonStart: level, departureAlertShown:false, retirementAlertShown:false, weeksAtClub: opts.alreadyIntegrated ? 52 : 0,\n    consecutiveMatchesStarted:0, consecutiveMatchesBenched:0, fatigueMalus:0, lastContractWeek:absoluteWeek(),\n    stats:{m:0,g:0,a:0,jc:0,rc:0,cs:0,e:0,noteSum:0,noteCount:0}, statsHistory:[],\n    axes: generateAxes(pos)\n  };\n  assignJerseyNumber(newPlayer, opts.squadRef);\n  return newPlayer;\n}\nfunction squadIsPlayable(squad){\n  return Object.keys(TACTIQUES).some(f=>\n    Object.keys(TACTIQUES[f].variants).some(v=>{\n      const shape = buildShape(f, v);\n      return assignStartersToShape(squad, shape.flat).feasible;\n    })\n  );\n}\n\/* Garantit une couverture minimale par poste (nécessaire pour qu'au moins une\n   formation reste toujours composable), en remplaçant ciblément le joueur de\n   champ le plus faible par un profil généré exprès pour le poste manquant. *\/\nconst MIN_POSITION_COVERAGE = { DC:3, DD:2, DG:2, MDC:2, MC:3, MOC:2, MG:1, MD:1, AiG:2, AiD:2, BU:2 };\nfunction repairSquadCoverage(squad){\n  Object.entries(MIN_POSITION_COVERAGE).forEach(([pos,min])=>{\n    let guard=0;\n    while(squad.filter(p=>p.mainPos.includes(pos)||p.sec.includes(pos)).length < min && guard<10){\n      const outfield = squad.filter(p=>!p.mainPos.includes('GB'));\n      if(!outfield.length) break;\n      const weakest = outfield.sort((a,b)=>a.level-b.level)[0];\n      const idx = squad.indexOf(weakest);\n      squad.splice(idx, 1, generatePlayer({forcePos:pos, squadRef:squad, division:state.division, alreadyIntegrated:true}));\n      guard++;\n    }\n  });\n}\nfunction generateInitialSquad(){\n  let squad, attempts=0;\n  do{\n    nextPlayerId = 1;\n    squad = [generatePlayer({forceGB:true, squadRef:[], division:state.division, alreadyIntegrated:true})];\n    squad.push(generatePlayer({forceGB:true, squadRef:squad, division:state.division, alreadyIntegrated:true}));\n    for(let i=0;i<16;i++) squad.push(generatePlayer({squadRef:squad, division:state.division, alreadyIntegrated:true}));\n    repairSquadCoverage(squad);\n    attempts++;\n  } while(!squadIsPlayable(squad) && attempts<60);\n  \/\/ Club modeste : la masse salariale de départ est réduite de 50% par rapport au taux du marché\n  \/\/ (les joueurs déjà en place ont accepté des salaires bien en dessous de leur valeur réelle).\n  squad.forEach(p=>{ p.salary = Math.max(1, Math.round(p.salary*0.5)); });\n  return squad;\n}\n\n\/* ---------- EFFECTIF (18 joueurs generes : 11 titulaires + 7 remplacants) ---------- *\/\nlet nextPlayerId = 1;\nconst state = {\n  season:1,\n  week:1,\n  transferBudgetTotal:0.4,\n  transferBudget:0.4,\n  salaryCap:85,\n  currentTactiqueFamily:\"4-3-3\",\n  currentTactiqueVariant:\"équilibré\",\n  currentTactiqueIsPrimary:true,\n  currentTactiqueAvg:70,\n  currentTactiqueAssignment:null,\n  currentStyle:\"2B\",\n  supporterSatisfaction:65,\n  matchNotesHistory:[], \/\/ D8 : historique des \"Note du Match\" (la plus récente en dernier)\n  division:'N', \/\/ L2 (Division Excellence), L1 (Division Élite) ou N (Division Honneur \/ National) — on démarre désormais en National\n  unusedSalaryAccum:0, \/\/ cumul de la marge salariale mensuelle non utilisée, converti en budget transfert en fin de saison\n  recentForm:[], \/\/ R10 : historique des 5 derniers résultats (V\/N\/D)\n  captainId:null, viceCaptainId:null, \/\/ S - Capitanat\n  nbScouts:3, \/\/ A1 : 3 scouts au départ, chacun propose 1 joueur par semaine\n  ceremonyShownThisSeason:false,\n  nextSeasonEuroCompetition:null, euro:null,\n  presidentSaleSharePct:100, \/\/ part des ventes reversée au budget transfert, décidée par le président (60\/80\/100%)\n  academyQualityBonus:0, \/\/ amélioration du centre de formation, décidée par le président\n  scoutingErrorMargin:4, \/\/ marge d'erreur du scouting sur le niveau réel (±), réduite par le président\n  stadiumExpansion:{active:false, yearsRemaining:0, expanded:false}, \/\/ agrandissement du stade en cours ou achevé\n  loanedOutThisSeason:[], \/\/ joueurs partis en prêt (sec ou avec OA) pendant la saison en cours\n  matchesThisWeekCount:0 \/\/ nombre de matchs déjà résolus pour la semaine en cours (fatigue I5)\n};\n\n\nlet nextScoutId = 1001;\nlet scouts = [];\n\n\/* ---- A2 : statuts des joueurs proposés au marché (répartition + effets) ---- *\/\nconst STATUS_POOL = { libre:8, avendre:30, pretSec:14, avendrePretOA:14, avendrePretSecOA:4, aucun:30 };\nconst STATUS_DEFS = {\n  libre:              { label:\"Libre de tout contrat\", valueMult:1,    levelDelta:0,  ageDelta:0, salaryMult:1.5, actions:['acheter'] },\n  avendre:             { label:\"À vendre\",              valueMult:0.8,  levelDelta:-2, ageDelta:2, salaryMult:1,   actions:['acheter'] },\n  pretSec:             { label:\"Prêt sec\",               valueMult:1,    levelDelta:2,  ageDelta:-2,salaryMult:1,   actions:['preter'] },\n  avendrePretOA:       { label:\"À vendre + Prêt (OA)\",    valueMult:0.8,  levelDelta:-2, ageDelta:2, salaryMult:1,   actions:['acheter','preterOA'] },\n  avendrePretSecOA:    { label:\"À vendre + Prêt sec + Prêt (OA)\", valueMult:0.7, levelDelta:0, ageDelta:0, salaryMult:1, actions:['acheter','preter','preterOA'] },\n  aucun:               { label:null, valueMult:1,    levelDelta:0,  ageDelta:0, salaryMult:1,   actions:['acheter'] }\n};\nfunction pickStatus(){ return weightedPick(STATUS_POOL); }\n\n\/* ---- Fiche de scoutisme : profil affiché (estimé) vs profil réel (caché), avec marge d'erreur ---- *\/\nfunction clamp01(v){ return Math.max(0,Math.min(1,v)); }\n\/* Génère l'ADN d'une cible de scoutisme en tenant compte des affinités du coach (+10% de chance) *\/\nfunction generateADNBoosted(){\n  const visiblePool = {...VISIBLE_ADN};\n  const invisiblePool = {...INVISIBLE_ADN};\n  coach.adnAffinity.forEach(trait=>{\n    if(visiblePool[trait]!==undefined) visiblePool[trait] = clamp01(visiblePool[trait]+0.10);\n    if(invisiblePool[trait]!==undefined) invisiblePool[trait] = clamp01(invisiblePool[trait]+0.10);\n  });\n  if(visiblePool[coach.adnIncompatibility]!==undefined) visiblePool[coach.adnIncompatibility]=0; if(invisiblePool[coach.adnIncompatibility]!==undefined) invisiblePool[coach.adnIncompatibility]=0; const visible = rollADNSet(visiblePool, VISIBLE_PAIRS);\n  const hidden = rollADNSet(invisiblePool, INVISIBLE_PAIRS).map(name=>({name, revealed:false}));\n  return { visible, hidden };\n}\nconst LEAGUE_TARGET_LEVEL = { 'Élite Anglaise':70, 'Élite Italienne':62, 'Élite Espagnole':62, 'Championnat National Allemand':62, 'Division Élite':55, 'Division Excellence':40, 'Division Honneur':28 }; function pickOfferingClub(playerLevel){ const weighted = SCOUT_CLUBS.map(c=>{ const target = LEAGUE_TARGET_LEVEL[c.league] ?? 40; const dist = Math.abs(playerLevel - target); return { c, w: 1\/(1+Math.pow(dist,1.4)*0.025) }; }); const tot = weighted.reduce((s,o)=>s+o.w,0); let r = Math.random()*tot; for(const o of weighted){ r-=o.w; if(r<=0) return o.c.club; } return weighted[weighted.length-1].c.club; } const SCOUT_CLUBS = [\n  {club:\"US Aubrangsec\", league:\"Division Excellence\"}, {club:\"CD Villaenseo\", league:\"Élite Espagnole\"}, {club:\"SC Waldstadter\", league:\"Championnat National Allemand\"},\n  {club:\"AC Novanoa\", league:\"Élite Italienne\"}, {club:\"Morwicke City\", league:\"Élite Anglaise\"}, {club:\"Stade Valtelland\", league:\"Division Excellence\"},\n  {club:\"CA Gartellbourg\", league:\"Division Élite\"}, {club:\"UD Atlrealo\", league:\"Élite Espagnole\"}, {club:\"Fortuna Mühlstadter\", league:\"Championnat National Allemand\"},\n  {club:\"Calcio Monelloa\", league:\"Élite Italienne\"}, {club:\"Morhamleigh Wanderers\", league:\"Élite Anglaise\"}, {club:\"Olympique de Belessyac\", league:\"Division Honneur\"},\n  {club:\"SM Chamignolsec\", league:\"Division Élite\"}, {club:\"Olympique de Solrangé\", league:\"Division Excellence\"}, {club:\"SM Vereraccourt\", league:\"Division Excellence\"}\n];\n\n\/* ---- A1\/A3 : génération d'une cible de scoutisme hebdomadaire ---- *\/\nfunction generateScoutCandidate(){\n  const weights = {...POSITION_WEIGHTS, GB:1};\n  selectedPostes.forEach(p=>{ if(weights[p]!==undefined) weights[p]*=3; }); \/\/ priorités du mercato : apparition boostée\n  const pos = weightedPick(weights);\n  const age = 17+Math.floor(Math.random()*18); \/\/ 17-34 ans, âges typiques du marché des transferts\n  const positions = generatePositionsFrom(pos);\n  const rawBase = generatePotentialAndLevel(age);\n  \/\/ Redimensionne la plage normale (38-60, calibrée L2) vers le plafond accessible avec le\n  \/\/ budget transfert actuel, en conservant la forme de la distribution d'origine. Le niveau de\n  \/\/ jeu reste plafonné à 99 (réaliste), mais le PRIX utilise la valeur non plafonnée : au-delà\n  \/\/ de 99, un joueur \"générationnel\" coûte toujours plus cher par rareté, même à niveau égal.\n  const ceiling = budgetLevelCeiling() * computeRankingScoutFactor();\n  const scale = (ceiling-30) \/ (60-30);\n  const rescaledLevel = 30 + (rawBase.level-30)*scale;\n  const rescaledPotential = 30 + (rawBase.potential-30)*scale;\n  const rescaledTruePotential = Math.min(rescaledPotential, 30 + (rawBase.truePotential-30)*scale);\n  const base = {\n    potential: clamp(Math.round(rescaledPotential), 25, 99),\n    truePotential: clamp(Math.round(rescaledTruePotential), 25, 99),\n    level: clamp(Math.round(Math.min(rescaledLevel, rescaledTruePotential)), 25, 99)\n  };\n  base.truePotential = Math.min(base.truePotential, base.potential);\n  base.level = Math.min(base.level, base.truePotential);\n\n  const statusKey = pickStatus();\n  const statusDef = STATUS_DEFS[statusKey];\n\n  const scoutedAge = clamp(age + statusDef.ageDelta, 15, 41);\n  const scoutedLevel = clamp(base.level + statusDef.levelDelta, 20, 99);\n  const scoutedPot = base.potential;\n  \/\/ Niveau \"de marché\" (non plafonné) utilisé uniquement pour le prix, afin que le plafond de\n  \/\/ budget (budget x 1,1) reste atteignable même quand le niveau de jeu affiché sature à 99.\n  const marketLevel = Math.max(scoutedLevel, rescaledLevel + statusDef.levelDelta);\n  const hardPriceCeiling = +(Math.max(0.15, state.transferBudget) * 1.1).toFixed(2);\n  const price = statusKey==='libre' ? 0 : Math.min(+(playerValue(marketLevel, scoutedAge, scoutedPot) * statusDef.valueMult).toFixed(2), hardPriceCeiling);\n  const salaryDemand = Math.round(playerSalaryK(scoutedLevel, scoutedAge) * statusDef.salaryMult);\n\n  \/\/ L'erreur de niveau doit toujours être strictement respectée dans la marge configurée\n  \/\/ (±4 par défaut, réduite par les investissements du président dans la cellule de recrutement).\n  \/\/ Le Vrai Potentiel a sa propre marge d'erreur, mais ne doit jamais plafonner le Vrai Niveau en\n  \/\/ dessous de cette plage : si besoin, c'est le potentiel qui remonte (un joueur ne peut pas\n  \/\/ avoir un niveau réel supérieur à son propre potentiel).\n  const margin = state.scoutingErrorMargin;\n  const potError = clamp(scoutedPot + (Math.floor(Math.random()*21)-10), 45, 99); \/\/ erreur potentiel : -10 à +10\n  const levelNoise = clamp(Math.round(gaussianRandom() * (margin\/2)), -margin, margin); \/\/ erreur niveau : loi normale, ±marge au maximum (extrêmes rares)\n  const trueLevel = clamp(scoutedLevel + levelNoise, 20, 99);\n  const truePot = Math.max(potError, trueLevel);\n\n  const clubFlavor = SCOUT_CLUBS[Math.floor(Math.random()*SCOUT_CLUBS.length)];\n  const isPriority = positions.mainPos.some(p=>selectedPostes.has(p)) && Math.random()<0.20; \/\/ A3 : priorité de recrutement\n\n  const scoutNat = generateNationality(state.division);\n  return {\n    id: nextScoutId++,\n    name: generateName(scoutNat),\n    nat: scoutNat,\n    club: clubFlavor.club, league: clubFlavor.league,\n    pos, mainPos: positions.mainPos, trueSec: positions.sec,\n    age: scoutedAge,\n    scoutedPot, truePot, scoutedLevel, trueLevel,\n    price, salaryDemand,\n    statusKey, statusDef,\n    isPriority,\n    trueAdn: generateADNBoosted(),\n    followed:false\n  };\n}\n\/* A1 : chaque semaine, chaque scout propose 1 nouvelle cible (3 scouts au départ = 3 cibles) *\/\nfunction generateWeeklyScouts(){\n  scouts = [];\n  for(let i=0;i<state.nbScouts;i++) scouts.push(generateScoutCandidate());\n}\n\n\nconst POSTES = [\"GB\",\"DG\",\"DC\",\"DD\",\"MDC\",\"MC\",\"MG\",\"MD\",\"MOC\",\"AiG\",\"AiD\",\"BU\"];\nlet selectedPostes = new Set([\"MDC\",\"BU\"]);\nlet effectifView = 'simple'; \/\/ 'simple' (G1) ou 'stats' (G2)\n\n\n\/* ---------- COACH ---------- *\/\n\/* ---------- Génération aléatoire du coach (E0-E9) : régénéré à chaque nouvelle partie ---------- *\/\nconst ALL_ADN_TRAITS = [...Object.keys(VISIBLE_ADN), ...Object.keys(INVISIBLE_ADN)];\nlet coach = generateCoach();\nlet players = generateInitialSquad();\n\/* ============================================================\n   CENTRE DE FORMATION (15-18 ans, hors effectif professionnel)\n   ============================================================ *\/\nconst ACADEMY_TARGET_SIZE = 6;\nfunction generateAcademyLevel(ceiling, truePotential){ const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)\/arr.length : null; const starterLevels = players.filter(p=>p.starter).map(p=>p.level); const benchLevels = players.filter(p=>!p.starter).map(p=>p.level); const tTit = avg(starterLevels) ?? ceiling*0.65; const tRemp = Math.min(avg(benchLevels) ?? ceiling*0.55, tTit-4); const r = Math.random(); let lvl; if(r < 0.10){ lvl = tTit + Math.random()*6; } else if(r < 0.50){ lvl = tRemp + Math.random()*Math.max(2, tTit-tRemp-1); } else { lvl = 15 + Math.random()*Math.max(4, tRemp-16); } return clamp(Math.round(lvl), 15, Math.min(ceiling, truePotential)); } function generateAcademyProspect(){\n  const p = generatePlayer({isYouth:true, division:state.division, squadRef:[]});\n  \/\/ Amélioration du centre de formation (décidée par le président) : relève le niveau\/potentiel\n  \/\/ plafond des jeunes prospects générés.\n  if(state.academyQualityBonus>0){\n    p.pot = clamp(p.pot + state.academyQualityBonus, 25, 99);\n    p.truePot = clamp(p.truePot + state.academyQualityBonus, 25, p.pot);\n    p.level = Math.min(p.level, p.truePot);\n  }\n  p.level = generateAcademyLevel(divisionLevelCeiling(state.division), p.truePot); if(p.age>=18) p.readyForDecision = true;\n  return p;\n}\nfunction generateInitialAcademy(){\n  const squad = [];\n  for(let i=0;i<ACADEMY_TARGET_SIZE;i++) squad.push(generateAcademyProspect());\n  return squad;\n}\nlet academy = generateInitialAcademy();\n\n\/* ============================================================\n   MON COMPTE — SAUVEGARDE DE LA PROGRESSION\n   ============================================================ *\/\nconst SAVE_KEY = 'directeurSportif_save_v1';\n\/* Rassemble tout l'état de la partie en cours dans un objet sérialisable en JSON. *\/\nfunction getSaveableState(){\n  return {\n    version: 1,\n    savedAt: Date.now(),\n    CLUB_NAME, players, coach, academy, scouts, receivedOffers, pendingLoanOptions,\n    state, LEAGUE_TEAMS, CLUB_STRENGTH, standings, SCHEDULE,\n    nextPlayerId, nextScoutId,\n    selectedPostes: [...selectedPostes], effectifView\n  };\n}\n\/* Restaure une partie depuis un objet précédemment obtenu via getSaveableState(). *\/\nfunction applyLoadedState(data){\n  CLUB_NAME = data.CLUB_NAME;\n  players = data.players;\n  coach = data.coach;\n  academy = data.academy || [];\n  scouts = data.scouts || [];\n  receivedOffers = data.receivedOffers || [];\n  pendingLoanOptions = data.pendingLoanOptions || [];\n  Object.keys(state).forEach(k=>delete state[k]);\n  Object.assign(state, data.state);\n  LEAGUE_TEAMS = data.LEAGUE_TEAMS;\n  CLUB_STRENGTH = data.CLUB_STRENGTH;\n  standings = data.standings;\n  SCHEDULE = data.SCHEDULE;\n  nextPlayerId = data.nextPlayerId;\n  nextScoutId = data.nextScoutId;\n  selectedPostes = new Set(data.selectedPostes || [\"MDC\",\"BU\"]);\n  effectifView = data.effectifView || 'simple';\n  oaNegOpenId = null;\n\n  \/\/ Bascule sur l'écran de jeu (une sauvegarde implique toujours une partie déjà démarrée)\n  document.getElementById('startMenuOverlay').style.display = 'none';\n  document.querySelectorAll('.navlist button').forEach(b=>b.classList.toggle('active', b.dataset.view==='dashboard'));\n  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='dashboard'));\n  renderChips(); renderScouts(); renderRecrutHeader(); renderOffers(); renderEffectif();\n  renderComposition(); renderCoachTab(); renderGlossary(); renderClassement(); renderFinances();\n  renderDashboard(); renderDashboardR(); renderPreMatch(); renderAcademy();\n  updateSaveUI();\n}\nfunction autoSaveGame(){\n  try{\n    localStorage.setItem(SAVE_KEY, JSON.stringify(getSaveableState()));\n    updateSaveUI();\n  }catch(e){ \/* stockage indisponible ou plein : on n'interrompt pas la partie pour autant *\/ }\n}\nfunction saveGameManual(){\n  try{\n    localStorage.setItem(SAVE_KEY, JSON.stringify(getSaveableState()));\n    toast('💾 Progression sauvegardée dans ce navigateur.');\n    updateSaveUI();\n  }catch(e){ toast('🚫 Impossible de sauvegarder (stockage du navigateur indisponible ou plein).'); }\n}\nfunction loadGameManual(){\n  const raw = localStorage.getItem(SAVE_KEY);\n  if(!raw){ toast('🚫 Aucune sauvegarde trouvée dans ce navigateur.'); return; }\n  try{\n    applyLoadedState(JSON.parse(raw));\n    toast('📂 Progression chargée avec succès.');\n  }catch(e){ toast('🚫 La sauvegarde est corrompue ou illisible.'); }\n}\nfunction deleteSaveGame(){\n  localStorage.removeItem(SAVE_KEY);\n  toast('🗑️ Sauvegarde supprimée.');\n  updateSaveUI();\n}\nfunction updateSaveUI(){\n  const label = document.getElementById('lastSaveLabel');\n  const loadBtn = document.getElementById('loadGameBtn');\n  const deleteBtn = document.getElementById('deleteSaveBtn');\n  if(!label) return;\n  const raw = localStorage.getItem(SAVE_KEY);\n  let savedAt = null;\n  if(raw){ try{ savedAt = JSON.parse(raw).savedAt; }catch(e){} }\n  if(savedAt){\n    const d = new Date(savedAt);\n    label.textContent = d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});\n    if(loadBtn) loadBtn.disabled = false;\n    if(deleteBtn) deleteBtn.disabled = false;\n  } else {\n    label.textContent = 'Aucune sauvegarde';\n    if(loadBtn) loadBtn.disabled = true;\n    if(deleteBtn) deleteBtn.disabled = true;\n  }\n}\nfunction saveTextFallback(json){ const w = window.open('', '_blank'); if(w){ w.document.write('<textarea style=\"width:100%;height:100%;font-family:monospace;font-size:12px;padding:10px;box-sizing:border-box;\" readonly>'+json.replace(\/<\/g,'&lt;')+'<\/textarea>'); toast('📄 Sauvegarde ouverte dans un nouvel onglet — copiez tout le texte manuellement.'); } else { toast('🚫 Export impossible sur cet appareil. Réessayez depuis un ordinateur si besoin.'); } } function exportSaveFile(){ const data = getSaveableState(); const json = JSON.stringify(data); const filename = `directeur-sportif-${CLUB_NAME.replace(\/\\s+\/g,'_')}-${new Date().toISOString().slice(0,10)}.json`; let downloadTried = false; try{ const blob = new Blob([json], {type:'application\/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1500); downloadTried = true; }catch(e){} if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(json).then(()=>{ toast(downloadTried ? '⬇️ Fichier exporté (et copié dans le presse-papiers en secours).' : '📋 Téléchargement indisponible ici — sauvegarde copiée dans le presse-papiers.'); }).catch(()=>{ if(downloadTried) toast('⬇️ Fichier de sauvegarde exporté.'); else saveTextFallback(json); }); } else if(downloadTried){ toast('⬇️ Fichier de sauvegarde exporté.'); } else { saveTextFallback(json); } } function importSaveFile(event){\n  const file = event.target.files && event.target.files[0];\n  if(!file) return;\n  const reader = new FileReader();\n  reader.onload = ()=>{\n    try{\n      applyLoadedState(JSON.parse(reader.result));\n      toast('⬆️ Sauvegarde importée avec succès.');\n    }catch(e){ toast('🚫 Fichier de sauvegarde invalide.'); }\n  };\n  reader.readAsText(file);\n  event.target.value = ''; } function importSaveFromText(){ const ta = document.getElementById('importPasteArea'); const txt = ta ? ta.value.trim() : ''; if(!txt){ toast('🚫 Collez d'+String.fromCharCode(39)+'abord le texte de la sauvegarde.'); return; } try{ applyLoadedState(JSON.parse(txt)); toast('⬆️ Sauvegarde importée avec succès.'); if(ta) ta.value=''; }catch(e){ toast('🚫 Texte de sauvegarde invalide.'); } }\n\/* Fin de saison : les jeunes vieillissent d'un an ; à 18 ans, ils attendent une décision du DS\n   (signer ou libérer) au lieu de continuer à vieillir. Le vivier se renouvelle ensuite avec de\n   nouveaux jeunes de 15 ans pour revenir à l'effectif cible. *\/\nfunction processAcademySeasonEnd(){\n  academy.forEach(p=>{\n    if(p.age<18) p.age++;\n    if(p.age>=18 && !p.readyForDecision){\n      p.readyForDecision = true;\n      toastPlayer(`A 18 ans : à signer ou à libérer depuis le Centre de formation.`, p, '🎓');\n    }\n  });\n  while(academy.length < ACADEMY_TARGET_SIZE) academy.push(generateAcademyProspect());\n}\n\/* Signe un jeune de 18 ans : rejoint l'effectif professionnel avec un numéro de maillot dédié. *\/\nfunction signerJeune(id){\n  const idx = academy.findIndex(p=>p.id===id);\n  if(idx<0) return;\n  const p = academy.splice(idx,1)[0];\n  assignJerseyNumber(p, players);\n  players.push(p);\n  toastPlayer(`Signe son premier contrat professionnel avec ${CLUB_NAME} !`, p, '✍️');\n  while(academy.length < ACADEMY_TARGET_SIZE) academy.push(generateAcademyProspect());\n  renderEffectif(); renderAcademy(); renderComposition(); renderDashboardR();\n}\n\/* Libère un jeune de 18 ans : quitte le club, remplacé au centre de formation. *\/\nfunction libererJeune(id){\n  const idx = academy.findIndex(p=>p.id===id);\n  if(idx<0) return;\n  const p = academy.splice(idx,1)[0];\n  toast(`👋 ${p.name} est libéré du Centre de formation à 18 ans, sans contrat professionnel.`);\n  while(academy.length < ACADEMY_TARGET_SIZE) academy.push(generateAcademyProspect());\n  renderAcademy();\n}\nfunction renderAcademy(){\n  const tbody = document.getElementById('academyTableBody');\n  if(!tbody) return;\n  tbody.innerHTML = '';\n  academy.slice().sort((a,b)=>b.age-a.age).forEach(p=>{\n    const tr = document.createElement('tr');\n    const actionCell = p.readyForDecision\n      ? `<button class=\"btn btn-accent btn-sm\" onclick=\"signerJeune(${p.id})\">Signer<\/button> <button class=\"btn btn-danger btn-sm\" onclick=\"libererJeune(${p.id})\">Libérer<\/button>`\n      : `<span class=\"hint\">En formation<\/span>`;\n    tr.innerHTML = `\n      <td><div class=\"player-name\">${p.name}<\/div><\/td>\n      <td>${p.age} ans<\/td>\n      <td>${p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')}<\/td>\n      <td><b>${p.level}<\/b><\/td>\n      <td>${p.pot}<\/td>\n      <td style=\"text-align:right;\">${actionCell}<\/td>`;\n    tbody.appendChild(tr);\n  });\n}\nfunction pickDistinctTraits(n, exclude){\n  const pool = ALL_ADN_TRAITS.filter(t=>!exclude.includes(t));\n  const picked = [];\n  while(picked.length<n && pool.length){\n    const idx = Math.floor(Math.random()*pool.length);\n    picked.push(pool.splice(idx,1)[0]);\n  }\n  return picked;\n}\nfunction pickWeightedFamily(pool){\n  const weights = {}; pool.forEach(f=>weights[f]=TACTIQUES[f].rate);\n  return weightedPick(weights);\n}\n\/* ---------- E10 : Relation joueur - coach (5 états) ---------- *\/\nconst COACH_RELATION_LEVELS = ['E','D','C','B','A'];\nconst COACH_RELATION_LABELS = { E:'Méprisé', D:'Distant', C:'Sympathie', B:'Apprécié', A:'Adoré' };\nconst COACH_RELATION_SCORE = { E:10, D:35, C:60, B:75, A:90 };\n\/* Chaque semaine, 1% de chance qu'un joueur se déplace d'un cran vers A ou vers E (tirage 50\/50). *\/\nfunction processWeeklyCoachRelations(){\n  players.forEach(p=>{\n    if(Math.random() < 0.01){\n      const idx = COACH_RELATION_LEVELS.indexOf(p.coachRelation);\n      const dir = Math.random()<0.5 ? 1 : -1; \/\/ vers A (+1) ou vers E (-1)\n      const newIdx = clamp(idx+dir, 0, COACH_RELATION_LEVELS.length-1);\n      p.coachRelation = COACH_RELATION_LEVELS[newIdx];\n    }\n  });\n}\n\/* Vie perso (D8) : commence entre 30 et 100, 10% de chance par semaine de changer de +10 ou -10 *\/\nfunction processWeeklyVieProScore(){\n  players.forEach(p=>{\n    if(p.vieProScore===undefined) p.vieProScore = 30+Math.floor(Math.random()*71);\n    if(Math.random() < 0.10){\n      const delta = Math.random()<0.5 ? 10 : -10;\n      p.vieProScore = clamp(p.vieProScore + delta, 0, 100);\n    }\n  });\n  if(coach.vieProScore===undefined) coach.vieProScore = 30+Math.floor(Math.random()*71);\n  if(Math.random() < 0.10){\n    const delta = Math.random()<0.5 ? 10 : -10;\n    coach.vieProScore = clamp(coach.vieProScore + delta, 0, 100);\n  }\n}\nfunction generateCoach(){\n  const affinity = pickDistinctTraits(2, []); \/\/ E9 : 2 affinités ADN\n  const incompatibility = pickDistinctTraits(1, affinity)[0]; \/\/ E9 : 1 incompatibilité ADN\n\n  const allFamilies = Object.keys(TACTIQUES);\n  const primary = pickWeightedFamily(allFamilies); \/\/ tactique principale, pondérée par les taux d'apparition\n  const remaining = allFamilies.filter(f=>f!==primary);\n  const secondaryCount = 1 + Math.floor(Math.random()*2); \/\/ 1 ou 2 tactiques secondaires\n  const secondary = [];\n  for(let i=0; i<secondaryCount && remaining.length; i++){\n    const pick = pickWeightedFamily(remaining);\n    secondary.push(pick);\n    remaining.splice(remaining.indexOf(pick),1);\n  }\n\n  const coachNat = generateNationality();\n  return {\n    name: generateName(coachNat),\n    age: 36 + Math.floor(Math.random()*37), \/\/ E1 : 36 à 72 ans\n    nat: coachNat,\n    style: Object.keys(STYLES)[Math.floor(Math.random()*Object.keys(STYLES).length)], \/\/ E2 : propre au coach, ne change pas avant un match\n    salary: 15 + Math.floor(Math.random()*35), \/\/ 15 à 49 k€\/mois\n    contractYears: 1 + Math.floor(Math.random()*4), \/\/ 1 à 4 ans, décrémenté chaque saison (E7)\n    relationDS: 50 + Math.floor(Math.random()*40),\n    relationPresident: 40 + Math.floor(Math.random()*45),\n    vieProScore: 30 + Math.floor(Math.random()*71), \/\/ E8 : vie perso du coach\n    \/\/ E3 : \"Vrai Niveau\" caché du coach, sur une échelle similaire au niveau de la ligue (40-60)\n    trueLevelMatch: 40 + Math.floor(Math.random()*21),\n    trueLevelManagement: 40 + Math.floor(Math.random()*21),\n    trueLevelProgression: 40 + Math.floor(Math.random()*21),\n    adnAffinity: affinity,\n    adnIncompatibility: incompatibility,\n    primaryTactiques: [primary],\n    secondaryTactiques: secondary\n  };\n}\n\/* E3 : convertit un \"Vrai Niveau\" caché (échelle ~40-60) en indicateur affiché au DS, de -4 à +4 *\/\ngenerateWeeklyScouts(); \/\/ premières cibles de scoutisme de la Semaine 1\n\nlet standings = {};\nLEAGUE_TEAMS.forEach(t=>standings[t]={j:0,g:0,n:0,p:0,bp:0,bc:0,pts:0});\n\n\/* ---------- CALENDRIER (round-robin aller-retour : 34 journées pour 18 équipes) ---------- *\/\nfunction generateRoundRobin(teamsIn){\n  let teams = teamsIn.slice();\n  if(teams.length % 2 !== 0) teams.push(\"BYE\");\n  const n = teams.length, rounds = n-1, half = n\/2;\n  let arr = teams.slice();\n  const firstLeg = [];\n  for(let r=0;r<rounds;r++){\n    const round=[];\n    for(let i=0;i<half;i++){\n      const home=arr[i], away=arr[n-1-i];\n      if(home!==\"BYE\" && away!==\"BYE\") round.push(r%2===0?[home,away]:[away,home]);\n    }\n    firstLeg.push(round);\n    arr=[arr[0], arr[n-1], ...arr.slice(1,n-1)];\n  }\n  \/\/ Match retour : mêmes affiches, domicile\/extérieur inversés (34 journées au total pour 18 équipes)\n  const secondLeg = firstLeg.map(round => round.map(([home,away]) => [away,home]));\n  return [...firstLeg, ...secondLeg];\n}\nlet SCHEDULE = generateRoundRobin(LEAGUE_TEAMS);\nconst TOTAL_JOURNEES = SCHEDULE.length; \/\/ 34\n\n\/* ---------- CALENDRIER DE SAISON : 52 SEMAINES ----------\n   S1–S9   : 🟢 Mercato d'été (préparation + début de championnat)\n   S10–S26 : 🔴 Marché fermé (matchs allers, 17 journées)\n   S27–S31 : 🟢 Mercato d'hiver\n   S32–S48 : 🔴 Marché fermé (matchs retours, 17 journées)\n   S49–S52 : 🟢 Mercato d'été \/ bilan de fin de saison\n------------------------------------------------------------ *\/\nconst WEEKS_TOTAL = 52;\nconst WEEK_BLOCKS = [\n  {start:1,  end:9,  mercato:true,  label:\"Mercato d'été\"},\n  {start:10, end:26, mercato:false, label:\"Marché fermé — matchs allers\"},\n  {start:27, end:31, mercato:true,  label:\"Mercato d'hiver\"},\n  {start:32, end:48, mercato:false, label:\"Marché fermé — matchs retours\"},\n  {start:49, end:52, mercato:true,  label:\"Mercato d'été \/ bilan de fin de saison\"}\n];\n\/* ---------- Coupe de France : disputée en parallèle du championnat, quelle que soit la\n   division (L1, L2, Division Honneur), sur des semaines sans match de championnat. ---------- *\/\nconst CUP_ROUND_WEEKS = [2, 5, 12, 18, 24, 34, 41, 50];\nconst CUP_ROUND_NAMES = [\"Tour de qualification\",\"64èmes de finale\",\"32èmes de finale\",\"16èmes de finale\",\"8èmes de finale\",\"Quarts de finale\",\"Demi-finale\",\"Finale\"];\nconst CUP_PRIZE_BY_ROUND = [0.03, 0.06, 0.1, 0.2, 0.35, 0.6, 1.0, 2.0]; \/\/ M€ gagnés en cas de victoire à ce tour\n\/* ---------- Coupes européennes : Ligue des Champions et Ligue Europa. Nouveau format à phase\n   de ligue (10 matchs contre 10 adversaires différents), puis élimination directe (quarts,\n   demies, finale). Une seule compétition possible par saison, déterminée par le classement\n   national de la saison précédente — les équipes qualifiées changent donc chaque année. ---------- *\/\nconst EURO_LEAGUE_PHASE_WEEKS = [1,2,3,4,5,6,7,8,27,46];\nconst EURO_KNOCKOUT_WEEKS = [48,49,51];\nconst EURO_KNOCKOUT_NAMES = [\"Quarts de finale\",\"Demi-finale\",\"Finale\"];\nconst EURO_PRIZES = {\n  UCL: { participation:1.5, win:0.3, draw:0.1, knockout:[0.8,1.5,3.5], champion:5 },\n  UEL: { participation:0.6, win:0.15, draw:0.05, knockout:[0.3,0.6,1.5], champion:2 }\n};\n\/* Pool \"continental\" : mélange de tous les pays déjà présents dans le jeu, pour un vrai tirage\n   européen varié (un club français peut affronter un club anglais, marocain, brésilien...). *\/\nfunction euroOpponentPool(){\n  const all = [...L1_POOL, ...L2_POOL, ...NATIONAL_POOL];\n  Object.values(FOREIGN_COUNTRIES).forEach(info=>{ all.push(...info.pool); });\n  return [...new Set(all)].filter(n=>n!==CLUB_NAME);\n}\nfunction weekBlock(week){ return WEEK_BLOCKS.find(b=>week>=b.start && week<=b.end) || WEEK_BLOCKS[WEEK_BLOCKS.length-1]; }\nfunction weekMatchIndex(week){\n  if(week>=10 && week<=26) return week-10;        \/\/ 0..16 (matchs allers)\n  if(week>=29 && week<=45) return 17+(week-29);    \/\/ 17..33 (matchs retours) — reprennent dès la semaine 29, pendant le mercato d'hiver (27-31), comme en vrai championnat. Trêve hivernale réelle : semaines 27-28 uniquement.\n  return null;                                     \/\/ pas de match cette semaine\n}\nfunction isMercatoOpen(){ return weekBlock(state.week).mercato; }\n\/* Initialise\/réinitialise la Coupe de France pour une nouvelle saison. *\/\nfunction initCup(){\n  state.cup = { roundIndex:0, eliminated:false, opponent:null, isHomeThisRound:true, wonTrophy:false, bestRoundReached:-1 };\n}\n\/* Tire un adversaire de coupe parmi n'importe quel club des 3 divisions (tirage au sort\n   intégral, comme en vrai Coupe de France — un club de Division Honneur peut affronter un cador de L1). *\/\nfunction generateCupOpponent(){\n  const allClubs = [...L1_POOL, ...L2_POOL, ...NATIONAL_POOL].filter(n=>n!==CLUB_NAME);\n  const pick = allClubs[Math.floor(Math.random()*allClubs.length)];\n  if(CLUB_STRENGTH[pick]===undefined) CLUB_STRENGTH[pick] = 40+Math.floor(Math.random()*30);\n  return pick;\n}\n\/* Tire l'adversaire du tour de coupe en cours, une seule fois par tour. *\/\nfunction processCupRound(){\n  if(!state.cup) initCup();\n  if(state.cup.eliminated || state.cup.wonTrophy) return;\n  if(CUP_ROUND_WEEKS[state.cup.roundIndex] !== state.week) return;\n  if(state.cup.opponent) return; \/\/ déjà tiré pour ce tour\n  state.cup.opponent = generateCupOpponent();\n  state.cup.isHomeThisRound = Math.random()<0.5;\n  toast(`🏆 Coupe de France (${CUP_ROUND_NAMES[state.cup.roundIndex]}) : vous affrontez ${state.cup.opponent} ${state.cup.isHomeThisRound?'à domicile':\"à l'extérieur\"} !`);\n}\n\/* Résout le tour de coupe en cours après un match (victoire, élimination, ou tirs au but en cas\n   d'égalité — pas de match nul possible en coupe). *\/\n\/* Simule une véritable séance de tirs au but (5 tirs chacun, puis mort subite en cas d'égalité),\n   et détermine le vainqueur à partir du score obtenu — pas d'un simple tirage à pile ou face. *\/\nfunction simulatePenaltyShootout(){\n  let us=0, opp=0;\n  for(let round=1; round<=5; round++){\n    if(Math.random()<0.75) us++;\n    if(Math.random()<0.75) opp++;\n  }\n  let guard=0;\n  while(us===opp && guard<10){\n    if(Math.random()<0.75) us++;\n    if(Math.random()<0.75) opp++;\n    guard++;\n  }\n  if(us===opp) us++; \/\/ filet de sécurité si la mort subite s'éternise (extrêmement improbable)\n  return { us, opp, won: us>opp };\n}\nfunction resolveCupRound(ourGoals, oppGoals){\n  const roundName = CUP_ROUND_NAMES[state.cup.roundIndex];\n  let won = ourGoals>oppGoals;\n  let pensLabel = '';\n  if(ourGoals===oppGoals){\n    const pens = simulatePenaltyShootout();\n    won = pens.won;\n    pensLabel = ` (${pens.us}-${pens.opp} T.A.B.)`;\n  }\n  if(won){\n    const prize = CUP_PRIZE_BY_ROUND[state.cup.roundIndex];\n    state.transferBudget = +(state.transferBudget + prize).toFixed(2);\n    state.cup.bestRoundReached = state.cup.roundIndex;\n    if(state.cup.roundIndex === CUP_ROUND_WEEKS.length-1){\n      state.cup.wonTrophy = true;\n      toast(`🏆🎉 ${CLUB_NAME} remporte la Coupe de France${pensLabel} ! +${formatValueM(prize)}.`);\n    } else {\n      toast(`✅ ${roundName} de Coupe de France remporté${pensLabel} ! +${formatValueM(prize)}. Prochain tour : ${CUP_ROUND_NAMES[state.cup.roundIndex+1]}.`);\n      state.cup.roundIndex++;\n      state.cup.opponent = null;\n    }\n  } else {\n    state.cup.eliminated = true;\n    toast(`❌ Élimination en Coupe de France (${roundName})${pensLabel}.`);\n  }\n}\n\/* ============================================================\n   COUPES EUROPÉENNES : LIGUE DES CHAMPIONS \/ LIGUE EUROPA\n   ============================================================ *\/\n\/* Initialise la campagne européenne pour la saison qui commence, selon la qualification\n   déterminée au classement final de la saison précédente (state.nextSeasonEuroCompetition). *\/\nfunction setupEuroForNewSeason(){\n  const comp = state.nextSeasonEuroCompetition;\n  if(!comp){ state.euro = null; return; }\n  state.euro = {\n    competition: comp, phase:'league', matchesPlayed:0, points:0, wins:0, draws:0, losses:0,\n    opponent:null, isHomeThisMatch:false, knockoutRoundIndex:-1, qualifiedForKnockout:false,\n    eliminated:false, wonTrophy:false\n  };\n  toast(`${comp==='UCL'?'🏆 Ligue des Champions':'🥈 Ligue Europa'} : qualifié pour la phase de ligue de la saison à venir (10 matchs) !`);\n}\n\/* Tire l'adversaire du prochain match européen (phase de ligue ou tour à élimination directe),\n   une seule fois par match, parmi un vaste pool continental mêlant tous les pays du jeu. *\/\nfunction processEuroWeek(){\n  if(!state.euro || state.euro.eliminated || state.euro.wonTrophy) return;\n  const e = state.euro;\n  if(e.phase==='league' && EURO_LEAGUE_PHASE_WEEKS[e.matchesPlayed]===state.week && !e.opponent){\n    const pool = euroOpponentPool();\n    e.opponent = pool[Math.floor(Math.random()*pool.length)];\n    e.isHomeThisMatch = Math.random()<0.5;\n    const label = e.competition==='UCL' ? 'Ligue des Champions' : 'Ligue Europa';\n    toast(`⚽ ${label} (match ${e.matchesPlayed+1}\/10) : vous affrontez ${e.opponent} ${e.isHomeThisMatch?'à domicile':\"à l'extérieur\"} !`);\n  } else if(e.phase==='knockout' && EURO_KNOCKOUT_WEEKS[e.knockoutRoundIndex]===state.week && !e.opponent){\n    const pool = euroOpponentPool();\n    e.opponent = pool[Math.floor(Math.random()*pool.length)];\n    e.isHomeThisMatch = Math.random()<0.5;\n    const label = e.competition==='UCL' ? 'Ligue des Champions' : 'Ligue Europa';\n    toast(`⚽ ${label} (${EURO_KNOCKOUT_NAMES[e.knockoutRoundIndex]}) : vous affrontez ${e.opponent} ${e.isHomeThisMatch?'à domicile':\"à l'extérieur\"} !`);\n  }\n}\n\/* Résout un match européen : accumule points\/prime pendant la phase de ligue, ou avance\/élimine\n   pendant la phase à élimination directe (tirs au but en cas d'égalité, comme la Coupe). *\/\nfunction resolveEuroMatch(ourGoals, oppGoals){\n  const e = state.euro;\n  const prizes = EURO_PRIZES[e.competition];\n  const label = e.competition==='UCL' ? 'Ligue des Champions' : 'Ligue Europa';\n  if(e.phase==='league'){\n    let gain = prizes.participation;\n    if(ourGoals>oppGoals){ e.points+=3; e.wins++; gain+=prizes.win; }\n    else if(ourGoals===oppGoals){ e.points+=1; e.draws++; gain+=prizes.draw; }\n    else { e.losses++; }\n    state.transferBudget = +(state.transferBudget+gain).toFixed(2);\n    e.matchesPlayed++;\n    e.opponent = null;\n    toast(`${label} : match ${e.matchesPlayed}\/10 terminé (${ourGoals}-${oppGoals}). +${formatValueM(gain)}. Total : ${e.points} pts.`);\n    if(e.matchesPlayed>=10){\n      e.qualifiedForKnockout = e.points >= 13; \/\/ seuil approximatif de qualification (proche du réel top 8\/24)\n      if(e.qualifiedForKnockout){\n        e.phase = 'knockout'; e.knockoutRoundIndex = 0;\n        toast(`🎉 ${label} : phase de ligue terminée avec ${e.points} points — qualifié pour les ${EURO_KNOCKOUT_NAMES[0]} !`);\n      } else {\n        e.eliminated = true;\n        toast(`👋 ${label} : phase de ligue terminée avec ${e.points} points — élimination, pas de qualification pour la suite.`);\n      }\n    }\n  } else {\n    const roundName = EURO_KNOCKOUT_NAMES[e.knockoutRoundIndex];\n    let won = ourGoals>oppGoals;\n    let pensLabel = '';\n    if(ourGoals===oppGoals){\n      const pens = simulatePenaltyShootout();\n      won = pens.won;\n      pensLabel = ` (${pens.us}-${pens.opp} T.A.B.)`;\n    }\n    if(won){\n      const prize = prizes.knockout[e.knockoutRoundIndex];\n      state.transferBudget = +(state.transferBudget+prize).toFixed(2);\n      if(e.knockoutRoundIndex === EURO_KNOCKOUT_NAMES.length-1){\n        e.wonTrophy = true;\n        state.transferBudget = +(state.transferBudget+prizes.champion).toFixed(2);\n        toast(`🏆🎉 ${CLUB_NAME} remporte la ${label}${pensLabel} ! +${formatValueM((prize+prizes.champion))}.`);\n      } else {\n        toast(`✅ ${roundName} de ${label} remporté${pensLabel} ! +${formatValueM(prize)}. Prochain tour : ${EURO_KNOCKOUT_NAMES[e.knockoutRoundIndex+1]}.`);\n        e.knockoutRoundIndex++;\n        e.opponent = null;\n      }\n    } else {\n      e.eliminated = true;\n      toast(`❌ Élimination en ${label} (${roundName})${pensLabel}.`);\n    }\n  }\n}\nfunction mercatoStatusText(){\n  const b = weekBlock(state.week);\n  return b.mercato ? `Mercato ouvert (${b.label}) jusqu'à la Semaine ${b.end}.` : `Mercato fermé (${b.label}) jusqu'à la Semaine ${b.end+1}.`;\n}\n\n\/* ============================================================\n   UTILITAIRES\n   ============================================================ *\/\nfunction posClass(p){ if(p===\"GB\") return \"pos-gk\"; if([\"DC\",\"DG\",\"DD\"].includes(p)) return \"pos-def\"; if([\"MDC\",\"MC\",\"MOC\",\"MG\",\"MD\"].includes(p)) return \"pos-mid\"; return \"pos-att\"; }\nfunction displayPosLabel(code){ const map={GB:'G', AiD:'AD', AiG:'AG'}; return map[code]||code; }\n\/* Couleur de pastille sur le terrain, basée sur le \"poste principal\" du joueur (comme en Effectif) *\/\nfunction pitchDotColors(pos){\n  const cls = posClass(pos);\n  if(cls==='pos-gk') return {bg:'linear-gradient(160deg,#ffd47a,#e6a93a)', fg:'#2a1a05'};\n  if(cls==='pos-def') return {bg:'linear-gradient(160deg,#c9b6f7,#7e3af2)', fg:'#12081f'};\n  if(cls==='pos-mid') return {bg:'linear-gradient(160deg,#e8dcff,#a99bd4)', fg:'#150a2e'};\n  return {bg:'linear-gradient(160deg,#b6f45c,#6fd12f)', fg:'#17240a'};\n}\nconst POSITION_RANK = { GB:0, DG:1, DC:1.3, DD:1.6, MDC:2, MG:3, MD:3, MC:4, MOC:5, AiG:6, AiD:6, BU:7 };\nfunction initials(name){ return name.split(\" \").map(w=>w[0]).join(\"\").slice(0,2).toUpperCase(); }\nfunction moralClass(m){ return m>=75?\"moral-high\":m>=55?\"moral-mid\":\"moral-low\"; }\nfunction clubCode(name){ return name.split(\" \").map(w=>w[0]).join(\"\").slice(0,3).toUpperCase(); }\nfunction renderADNBadges(p){\n  const parts = p.adnVisible.slice().sort().map(a=>`<span class=\"badge\">${a}<\/span>`);\n  p.adnHidden.filter(h=>h.revealed).map(h=>h.name).sort().forEach(name=>{ parts.push(`<span class=\"badge\">${name}<\/span>`); });\n  return parts.length ? parts.join(' ') : '<span class=\"hint\">Aucun trait particulier.<\/span>';\n}\nfunction mainPosBadgesMini(p){ return p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(code=>`<span class=\"badge badge-mini ${posClass(code)}\">${displayPosLabel(code)}<\/span>`).join(' '); } function renderPositionBadges(p){\n  const sortedMain = p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]);\n  const sortedSec = p.sec.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]);\n  const main = sortedMain.map(code=>`<span class=\"badge ${posClass(code)}\">${displayPosLabel(code)}<\/span>`).join(' ');\n  const sec = sortedSec.map(code=>`<span class=\"badge sec-pos\">${displayPosLabel(code)}<\/span>`).join(' ');\n  return main + (sec ? ' '+sec : '');\n}\nfunction clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }\n\/* Semaine absolue, continue d'une saison à l'autre (contrairement à state.week qui repart à 1\n   chaque saison) — nécessaire pour mesurer l'ancienneté réelle d'un contrat en semaines. *\/\nfunction absoluteWeek(){ return (state.season-1)*52 + state.week; }\n\/* Écriture sûre : ne fait rien si l'élément n'existe pas (utile pour les onglets retirés temporairement) *\/\nfunction setText(id, text){ const el=document.getElementById(id); if(el) el.textContent=text; }\nfunction setHTML(id, html){ const el=document.getElementById(id); if(el) el.innerHTML=html; }\nfunction poissonRandom(lambda){ let L=Math.exp(-lambda),k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }\n\/* Tirage selon une loi normale centrée réduite (moyenne 0, écart-type 1), via la transformation\n   de Box-Muller — pour rendre rares les valeurs extrêmes d'un bruit aléatoire, au lieu d'une\n   distribution uniforme où chaque valeur a la même probabilité. *\/\nfunction gaussianRandom(){\n  let u = 0, v = 0;\n  while(u === 0) u = Math.random();\n  while(v === 0) v = Math.random();\n  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);\n}\nlet toastQueue = [];\nlet toastCurrentEl = null;\nlet toastCurrentType = null;\nlet desktopToastIdCounter = 0;\nfunction isMobileViewport(){ return window.innerWidth <= 780; }\n\n\/* Notification générique (texte simple). Sur PC : empilée en haut à droite, avec une croix,\n   ne disparaît qu'au clic sur la croix ou au changement de semaine. Sur mobile : file\n   d'attente, une seule notification affichée à la fois avec un bouton OK. *\/\nfunction toast(msg){\n  if(isMobileViewport()){\n    toastQueue.push({type:'text', msg});\n    if(!toastCurrentType) showNextToast(); else updateToastPeek();\n  } else {\n    renderDesktopToast(`<span>${msg}<\/span>`);\n  }\n}\n\/* Alerte concernant un joueur précis (symbole dédié, Nom, Âge, Niveau, Nationalité, description).\n   Sur PC comme sur mobile : jamais plein écran — une notification compacte, en file d'attente\n   sur mobile (une seule affichée à la fois avec un bouton OK), empilée sur PC. *\/\nfunction toastPlayer(desc, player, icon){\n  const html = `\n    <div style=\"display:flex;gap:10px;align-items:flex-start;\">\n      <div style=\"font-size:22px;line-height:1;\">${icon || '📋'}<\/div>\n      <div style=\"flex:1;min-width:0;\">\n        <b>${player.name}<\/b>\n        <div class=\"hint\" style=\"margin:2px 0 4px;color:#e7dcfb;\">${player.age} ans · Niveau ${player.level} · ${nationFlag(player.nat)} ${player.nat}<\/div>\n        <div>${desc}<\/div>\n      <\/div>\n    <\/div>`;\n  if(isMobileViewport()){\n    toastQueue.push({type:'text', msg: html});\n    if(!toastCurrentType) showNextToast(); else updateToastPeek();\n  } else {\n    renderDesktopToast(html);\n  }\n}\n\/* PC uniquement : empile une notification compacte en haut à droite (la nouvelle en tête,\n   les précédentes descendent), avec une croix de fermeture individuelle. *\/\nfunction renderDesktopToast(innerHTML){\n  const container = document.getElementById('toastContainer');\n  if(!container) return;\n  const id = 'dtoast-' + (desktopToastIdCounter++);\n  const el = document.createElement('div');\n  el.className = 'toast-item';\n  el.id = id;\n  el.innerHTML = `${innerHTML}<button class=\"toast-close\" onclick=\"dismissDesktopToast('${id}')\" title=\"Fermer\">✕<\/button>`;\n  container.insertBefore(el, container.firstChild);\n  requestAnimationFrame(()=>{ el.classList.add('show'); });\n}\nfunction dismissDesktopToast(id){\n  const el = document.getElementById(id);\n  if(!el) return;\n  el.classList.remove('show');\n  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 200);\n}\n\/* Appelé à chaque changement de semaine : efface toute notification affichée ET réinitialise\n   complètement l'état de la file d'attente. Sans cette réinitialisation, une notification en\n   cours au moment du changement de semaine laissait toastCurrentType \"coincé\" indéfiniment,\n   empêchant silencieusement toute notification future de s'afficher. *\/\nfunction clearAllDesktopToasts(){\n  const container = document.getElementById('toastContainer');\n  if(container) container.innerHTML = '';\n  const overlay = document.getElementById('playerAlertOverlay');\n  if(overlay) overlay.classList.remove('show');\n  toastQueue = [];\n  toastCurrentEl = null;\n  toastCurrentType = null;\n}\nfunction showNextToast(){\n  if(toastQueue.length===0){ toastCurrentType=null; toastCurrentEl=null; return; }\n  const item = toastQueue.shift();\n  toastCurrentType = item.type;\n  if(item.type==='player') renderPlayerAlert(item.desc, item.player, item.icon);\n  else renderTextToast(item.msg);\n}\n\/* Ajoute ou retire le repère visuel indiquant que d'autres notifications attendent, sans\n   toucher à la notification actuellement affichée. Appelé au premier rendu, ET à chaque fois\n   qu'une nouvelle notification s'ajoute à la file pendant qu'une autre est déjà affichée. *\/\nfunction updateToastPeek(){\n  const container = document.getElementById('toastContainer');\n  if(!container) return;\n  const existingPeek = container.querySelector('.toast-peek');\n  if(toastQueue.length>0 && !existingPeek){\n    const peek = document.createElement('div');\n    peek.className = 'toast-peek';\n    container.appendChild(peek);\n  } else if(toastQueue.length===0 && existingPeek){\n    existingPeek.remove();\n  }\n}\nfunction renderTextToast(msg){\n  const container = document.getElementById('toastContainer');\n  if(!container) return;\n  const el = document.createElement('div');\n  el.className = 'toast-item';\n  el.innerHTML = `<div style=\"flex:1;min-width:0;\">${msg}<\/div><button class=\"toast-ok\" onclick=\"dismissCurrentToast()\">OK<\/button>`;\n  container.innerHTML = \"\"; \/\/ une seule notification pleinement visible à la fois\n  container.appendChild(el);\n  updateToastPeek();\n  toastCurrentEl = el;\n  requestAnimationFrame(()=>{ el.classList.add('show'); });\n}\nfunction renderPlayerAlert(desc, player, icon){\n  const overlay = document.getElementById('playerAlertOverlay');\n  if(!overlay) return;\n  setText('alertSymbol', icon || '📋');\n  setText('alertAvatar', initials(player.name));\n  setText('alertName', player.name);\n  setText('alertAge', player.age+' ans');\n  setText('alertLevel', player.level);\n  setHTML('alertNat', `${nationFlag(player.nat)} ${player.nat}`);\n  setText('alertDesc', desc);\n  overlay.classList.add('show');\n  toastCurrentEl = overlay;\n}\nfunction dismissCurrentToast(){\n  if(!toastCurrentEl) return;\n  const el = toastCurrentEl, wasPlayerAlert = toastCurrentType==='player';\n  el.classList.remove('show');\n  setTimeout(()=>{\n    if(!wasPlayerAlert && el.parentNode) el.parentNode.removeChild(el);\n    toastCurrentEl = null; toastCurrentType = null;\n    showNextToast();\n  }, 200);\n}\n\n\/* ============================================================\n   NAVIGATION\n   ============================================================ *\/\n\/* Change d'onglet et rafraîchit son contenu — réutilisée par la nav ET par tous les liens\n   de redirection entre les pages (ex. cliquer sur \"Prochain match\" au tableau de bord). *\/\nfunction goToTab(viewId){\n  document.querySelectorAll('.navlist button').forEach(b=>b.classList.toggle('active', b.dataset.view===viewId));\n  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id===viewId));\n  if(viewId==='classement') renderClassement();\n  if(viewId==='match') renderPreMatch();\n  if(viewId==='coach') renderCoachTab();\n  if(viewId==='recrutement') renderRecrutHeader();\n  if(viewId==='composition') renderComposition();\n  if(viewId==='dashboard') renderDashboardR();\n  if(viewId==='effectif') renderEffectif();\n  if(viewId==='compte') updateSaveUI();\n}\ndocument.querySelectorAll('.navlist button').forEach(btn=>{\n  btn.addEventListener('click',()=>goToTab(btn.dataset.view));\n});\n\n\/* ============================================================\n   RECRUTEMENT : CHIPS\n   ============================================================ *\/\nfunction renderChips(){\n  const pWrap=document.getElementById('postChips'); pWrap.innerHTML=\"\";\n  POSTES.forEach(p=>{\n    const c=document.createElement('button');\n    c.className='chip'+(selectedPostes.has(p)?' selected':'');\n    c.textContent=displayPosLabel(p);\n    c.onclick=()=>{ selectedPostes.has(p)?selectedPostes.delete(p):selectedPostes.add(p); renderChips(); renderScouts(); };\n    pWrap.appendChild(c);\n  });\n}\n\n\/* ============================================================\n   RECRUTEMENT : SCOUTING & SIGNATURE RÉELLE\n   ============================================================ *\/\nfunction renderScouts(){\n  const wrap=document.getElementById('scoutList'); wrap.innerHTML=\"\";\n  if(scouts.length===0){ wrap.innerHTML='<p class=\"hint\">Aucune cible en cours — élargissez votre politique de recrutement.<\/p>'; return; }\n  const open = isMercatoOpen();\n  scouts.forEach(s=>{\n    const el=document.createElement('div');\n    const matchesRequest = s.mainPos.some(p=>selectedPostes.has(p));\n    el.className='scout-card'+(matchesRequest?' priority':''); el.style.cursor='pointer'; el.onclick=(e)=>{ if(!e.target.closest('button') && !e.target.closest('input')) openScoutModal(s.id); };\n    const canBuy = s.statusDef.actions.includes('acheter');\n    const canLoan = s.statusDef.actions.includes('preter') || s.statusDef.actions.includes('preterOA');\n    const isFree = s.statusKey==='libre';\n    const unavailable = s.statusDef.actions.length===0;\n\n    let actionsHtml = '';\n    const tooStrong = levelGapTooHigh(s);\n    if(unavailable){\n      actionsHtml = `<p class=\"hint\" style=\"margin:8px 0 0;\">Ce joueur n'est pas disponible cette semaine.<\/p>`;\n    } else if(tooStrong){\n      actionsHtml = `<p class=\"hint\" style=\"margin:8px 0 0;color:var(--danger,#e74c3c);\">🚫 Trop fort pour ${CLUB_NAME} (écart de plus de 10 avec le niveau moyen de l'effectif).<\/p>`;\n    } else {\n      actionsHtml += `<div class=\"scout-top\" style=\"align-items:center;\">\n        <span class=\"scout-price\">${canBuy? (isFree?'Libre — 0€':formatValueM(s.price)) : 'Prêt uniquement'}<\/span>\n        <button class=\"btn btn-ghost btn-sm follow-btn\">${s.followed?'★ Suivi':'☆ Suivre'}<\/button>\n      <\/div>`;\n      if(canBuy && isFree){\n        actionsHtml += `<div class=\"neg-panel\" style=\"display:block;\">\n          <div class=\"neg-row\"><span>Salaire mensuel proposé<\/span><span id=\"negSalaryLabelFree-${s.id}\">${formatSalaryK(s.salaryDemand)}<\/span><\/div>\n          <input type=\"range\" min=\"${Math.max(1,Math.round(s.salaryDemand*0.6))}\" max=\"${Math.round(s.salaryDemand*1.6)}\" value=\"${s.salaryDemand}\" oninput=\"document.getElementById('negSalaryLabelFree-${s.id}').textContent=formatSalaryK(this.value)\" id=\"negSalaryRangeFree-${s.id}\">\n          <p class=\"hint\" style=\"margin:4px 0 0;\">Salaire demandé par le joueur : ${formatSalaryK(s.salaryDemand)} — offrir moins reste possible mais risqué.<\/p>\n          <div class=\"neg-row\"><span>Durée du contrat<\/span><span id=\"negYearsLabelFree-${s.id}\">3 ans<\/span><\/div>\n          <input type=\"range\" min=\"1\" max=\"4\" step=\"1\" value=\"3\" oninput=\"document.getElementById('negYearsLabelFree-${s.id}').textContent=this.value+(this.value>1?' ans':' an')\" id=\"negYearsRangeFree-${s.id}\">\n        <\/div>\n        <button class=\"btn ${matchesRequest?'btn-primary':'btn-ghost'} btn-sm\" style=\"width:100%;margin-top:6px;\" onclick=\"signFreeAgent(${s.id})\" ${open?'':'disabled'}>${open?'✍️ Signer librement':'🔒 Mercato fermé'}<\/button>`;\n      } else if(canBuy){\n        actionsHtml += `\n        <div class=\"neg-panel\" id=\"neg-${s.id}\">\n          <div class=\"neg-row\"><span>Offre de transfert<\/span><span id=\"negPriceLabel-${s.id}\">${formatValueM(s.price)}<\/span><\/div>\n          <input type=\"range\" min=\"${Math.max(1,Math.round(s.price*70))}\" max=\"${Math.round(s.price*140)+5}\" value=\"${Math.round(s.price*100)}\" oninput=\"document.getElementById('negPriceLabel-${s.id}').textContent=formatValueM(this.value\/100)\" id=\"negRange-${s.id}\">\n          <div class=\"neg-row\"><span>Salaire mensuel proposé<\/span><span id=\"negSalaryLabel-${s.id}\">${formatSalaryK(s.salaryDemand)}<\/span><\/div>\n          <input type=\"range\" min=\"${Math.max(1,Math.round(s.salaryDemand*0.6))}\" max=\"${Math.round(s.salaryDemand*1.6)}\" value=\"${s.salaryDemand}\" oninput=\"document.getElementById('negSalaryLabel-${s.id}').textContent=formatSalaryK(this.value)\" id=\"negSalaryRange-${s.id}\">\n          <div class=\"neg-row\"><span>Durée du contrat<\/span><span id=\"negYearsLabel-${s.id}\">3 ans<\/span><\/div>\n          <input type=\"range\" min=\"1\" max=\"4\" step=\"1\" value=\"3\" oninput=\"document.getElementById('negYearsLabel-${s.id}').textContent=this.value+(this.value>1?' ans':' an')\" id=\"negYearsRange-${s.id}\">\n          <button class=\"btn ${matchesRequest?'btn-primary':'btn-ghost'} btn-sm\" onclick=\"envoyerOffre(${s.id})\" ${open?'':'disabled'}>Envoyer l'offre<\/button>\n        <\/div>\n        <button class=\"btn ${matchesRequest?'btn-primary':'btn-ghost'} btn-sm\" onclick=\"toggleNeg(${s.id})\" ${open?'':'disabled'}>${open?\"Négocier l'achat\":'🔒 Mercato fermé'}<\/button>`;\n      }\n      if(canLoan){\n        const withOA = s.statusDef.actions.includes('preterOA');\n        const oaTxt = withOA ? \" (option d'achat)\" : \"\";\n        actionsHtml += `\n        <div class=\"neg-panel\" style=\"display:block;\">\n          <div class=\"neg-row\"><span>Part du salaire prise en charge<\/span><span id=\"loanPctLabel-${s.id}\">70%<\/span><\/div>\n          <input type=\"range\" min=\"20\" max=\"100\" step=\"5\" value=\"70\" oninput=\"document.getElementById('loanPctLabel-${s.id}').textContent=this.value+'%'\" id=\"loanPctRange-${s.id}\">\n          ${withOA ? `\n          <div class=\"neg-row\"><span>Option d'achat proposée<\/span><span id=\"loanOAPriceLabel-${s.id}\">${formatValueM(s.price)}<\/span><\/div>\n          <input type=\"range\" min=\"${Math.max(1,Math.round(s.price*60))}\" max=\"${Math.round(s.price*140)}\" value=\"${Math.round(s.price*100)}\" oninput=\"document.getElementById('loanOAPriceLabel-${s.id}').textContent=formatValueM(this.value\/100)\" id=\"loanOAPriceRange-${s.id}\">\n          ` : `\n          <p class=\"hint\" style=\"margin:4px 0 0;\">Plus la part prise en charge est élevée, plus le club prêteur accepte facilement.<\/p>`}\n        <\/div>\n        <button class=\"btn ${matchesRequest?'btn-primary':'btn-ghost'} btn-sm\" style=\"width:100%;margin-top:6px;\" onclick=\"demanderPret(${s.id})\" ${open?'':'disabled'}>${open?'📄 Demander un prêt'+oaTxt:'🔒 Mercato fermé'}<\/button>`;\n      }\n    }\n\n    el.innerHTML=`\n      <div class=\"scout-top\">\n        <div><div class=\"player-name\">${s.name}<\/div><div class=\"scout-club\">${s.club} · ${s.league} · ${s.nat}<\/div><\/div>\n        <span>${s.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(p=>`<span class=\"badge ${posClass(p)}\">${displayPosLabel(p)}<\/span>`).join(' ')}<\/span>\n      <\/div>\n      <div class=\"chip-group\" style=\"margin:2px 0 4px;\">\n        ${s.statusDef.label ? `<span class=\"badge locked\">${s.statusDef.label}<\/span>` : ''}\n        ${matchesRequest?'<span class=\"badge starter\">🎯 Priorité de recrutement<\/span>':''}\n      <\/div>\n      <div class=\"scout-stats\"><span>Âge <b>${s.age}<\/b><\/span><span>Niveau <b>${s.scoutedLevel}<\/b><\/span><span>Potentiel <b>${s.scoutedPot}<\/b><\/span><\/div>\n      ${actionsHtml}\n      \n    `;\n    const followBtn = el.querySelector('.follow-btn');\n    if(followBtn) followBtn.onclick=()=>{ s.followed=!s.followed; renderScouts(); };\n    wrap.appendChild(el);\n  });\n}\nfunction toggleNeg(id){\n  document.querySelectorAll('.neg-panel').forEach(p=>{ if(p.id!=='neg-'+id) p.classList.remove('open'); });\n  document.getElementById('neg-'+id).classList.toggle('open');\n}\nconst SCOUT_SALARY_K = 10; \/\/ k€\/mois par scout\nconst MAX_SCOUTS = 9;\n\/* Recrute un scout supplémentaire (max 9), coût soumis au plafond salarial du club au même\n   titre que les salaires des joueurs. Effet immédiat : 1 cible de plus proposée dès la semaine\n   suivante. *\/\nfunction recruterScout(){\n  if(state.nbScouts>=MAX_SCOUTS){ toast(`🚫 Effectif de scouts déjà au maximum (${MAX_SCOUTS}).`); return; }\n  if(SCOUT_SALARY_K > salaryCapRemaining()){ toast(`🚫 Masse salariale insuffisante pour recruter un scout (${formatSalaryK(SCOUT_SALARY_K)}, marge restante : ${formatSalaryK(salaryCapRemaining())}).`); return; }\n  state.nbScouts++;\n  toast(`🔍 Un scout supplémentaire rejoint la cellule de recrutement (${state.nbScouts}\/${MAX_SCOUTS}) — 1 cible de plus proposée chaque semaine.`);\n  renderRecrutHeader();\n}\nfunction totalScoutSalary(){ return state.nbScouts * SCOUT_SALARY_K; }\nfunction salaryCapRemaining(){ return state.salaryCap - players.reduce((s,p)=>s+p.salary,0) - totalScoutSalary(); }\n\/* Chance qu'un joueur accepte le salaire mensuel proposé, comparé à son salaire demandé.\n   Offrir exactement le montant demandé n'est pas une garantie (les joueurs visent une petite\n   prime), une offre généreuse au-delà du demandé est quasi certaine d'être acceptée. *\/\nfunction salaryNegotiationChance(proposedSalary, askingSalary){\n  const ratio = proposedSalary \/ Math.max(1, askingSalary);\n  return clamp(0.3 + (ratio-0.7)*1.2, 0.05, 0.95);\n}\n\/* Impossible de signer un joueur dont le niveau dépasse de plus de 10 points le niveau moyen de\n   l'effectif actuel — un club ne peut pas soudainement attirer un joueur bien trop fort pour lui. *\/\nfunction levelGapTooHigh(s){\n  return s.scoutedLevel > computeTeamAvgLevel() + 10;\n}\nfunction envoyerOffre(id){\n  if(!isMercatoOpen()){ toast(`🔒 Le mercato est fermé — impossible de recruter. ${mercatoStatusText()}`); return; }\n  const s=scouts.find(x=>x.id===id);\n  if(!s) return;\n  if(levelGapTooHigh(s)){ toast(`🚫 ${s.name} (niveau estimé ${s.scoutedLevel}) est bien trop fort pour ${CLUB_NAME} — écart de plus de 10 avec le niveau moyen de l'effectif (${computeTeamAvgLevel().toFixed(1)}).`); return; }\n  const range=document.getElementById('negRange-'+id);\n  const offeredPrice = range ? parseFloat(range.value)\/100 : s.price;\n  const yearsRange=document.getElementById('negYearsRange-'+id);\n  const contractYears = yearsRange ? parseInt(yearsRange.value) : 3;\n  const salaryRange=document.getElementById('negSalaryRange-'+id);\n  const proposedSalary = salaryRange ? parseInt(salaryRange.value) : s.salaryDemand;\n  if(offeredPrice > state.transferBudget){ toast(`Budget transfert insuffisant : il vous manque ${formatValueM((offeredPrice-state.transferBudget))}.`); return; }\n  if(proposedSalary > salaryCapRemaining()){ toast(`🚫 Masse salariale insuffisante pour ce salaire proposé (${formatSalaryK(proposedSalary)}, marge restante : ${formatSalaryK(salaryCapRemaining())}).`); return; }\n  let clubAccepts;\n  if(s.acceptedPrice!==undefined && offeredPrice >= s.acceptedPrice){\n    \/\/ Le club vendeur a déjà accepté un prix lors d'une tentative précédente : il ne revient\n    \/\/ jamais en arrière sur ce point, tant que la nouvelle offre couvre au moins ce montant.\n    clubAccepts = true;\n  } else {\n    \/\/ Le prix demandé affiché n'est qu'une indication : le prix de réserve réel du club vendeur\n    \/\/ varie à chaque tentative, entre 60% et 140% de ce prix demandé (le club peut se montrer\n    \/\/ exceptionnellement conciliant, ou au contraire particulièrement gourmand ce jour-là).\n    const reservationFactor = 0.6 + Math.random()*0.8;\n    const reservationPrice = s.price * reservationFactor;\n    const ratio = offeredPrice \/ Math.max(0.01, reservationPrice);\n    const clubChance = clamp(0.3 + (ratio-0.85)*1.3, 0.05, 0.95);\n    clubAccepts = Math.random() < clubChance;\n    if(clubAccepts) s.acceptedPrice = offeredPrice; \/\/ acquis définitivement pour la suite des négociations\n  }\n  if(!clubAccepts){\n    if(Math.random() < 1\/3){\n      scouts = scouts.filter(x=>x.id!==s.id);\n      toast(`❌ ${s.club} refuse l'offre pour ${s.name} et met fin aux négociations — le joueur n'est plus disponible.`);\n      renderScouts();\n    } else {\n      toast(`${s.club} refuse l'offre pour ${s.name}. Essayez une offre plus généreuse.`);\n    }\n    return;\n  }\n  const salaryChance = salaryNegotiationChance(proposedSalary, s.salaryDemand);\n  if(Math.random() >= salaryChance){\n    \/\/ C'est désormais le JOUEUR (pas le club, déjà acquis à la vente) qui peut mettre fin aux\n    \/\/ négociations si le salaire ne lui convient décidément pas.\n    if(Math.random() < 1\/3){\n      scouts = scouts.filter(x=>x.id!==s.id);\n      toast(`❌ ${s.name} refuse définitivement le salaire proposé et met fin aux négociations — le transfert n'aura pas lieu.`);\n      renderScouts();\n    } else {\n      toast(`💬 ${s.club} maintient son accord sur le transfert (${formatValueM(s.acceptedPrice)}, acquis), mais ${s.name} refuse le salaire proposé (${formatSalaryK(proposedSalary)}) — tentez une proposition plus généreuse.`);\n    }\n    return;\n  }\n  recruitPlayer(s, offeredPrice, {loan:false, negotiatedSalary: proposedSalary, years: contractYears});\n}\nfunction demanderPret(id){\n  if(!isMercatoOpen()){ toast(`🔒 Le mercato est fermé — impossible de conclure un prêt. ${mercatoStatusText()}`); return; }\n  const s = scouts.find(x=>x.id===id);\n  if(!s) return;\n  if(levelGapTooHigh(s)){ toast(`🚫 ${s.name} (niveau estimé ${s.scoutedLevel}) est bien trop fort pour ${CLUB_NAME} — écart de plus de 10 avec le niveau moyen de l'effectif (${computeTeamAvgLevel().toFixed(1)}).`); return; }\n  const pctRange = document.getElementById('loanPctRange-'+id);\n  const salaryPct = pctRange ? parseInt(pctRange.value) : 70;\n  const withOption = s.statusDef.actions.includes('preterOA');\n  const oaRange = document.getElementById('loanOAPriceRange-'+id);\n  const negotiatedOptionPrice = (withOption && oaRange) ? parseFloat(oaRange.value)\/100 : null;\n  const loanFee = +(s.price*0.15).toFixed(2);\n  if(loanFee > state.transferBudget){ toast(`Budget transfert insuffisant pour ce prêt (indemnité ${formatValueM(loanFee)}).`); return; }\n  const ourSalaryShare = Math.round(s.salaryDemand * salaryPct\/100);\n  if(ourSalaryShare > salaryCapRemaining()){ toast(`🚫 Masse salariale insuffisante pour ce prêt (part à notre charge : ${formatSalaryK(ourSalaryShare)}, marge restante : ${formatSalaryK(salaryCapRemaining())}).`); return; }\n  \/\/ La part de salaire ET (si applicable) l'option d'achat proposée déterminent ensemble\n  \/\/ l'acceptation du club prêteur : plus elles sont généreuses, plus il accepte facilement.\n  let chance;\n  if(withOption && negotiatedOptionPrice!==null){\n    const priceRatio = negotiatedOptionPrice \/ Math.max(0.01, s.price);\n    const priceFactor = clamp((priceRatio-0.6)\/0.8, 0, 1); \/\/ 0 à 60% du prix de référence, 1 à 140%\n    chance = clamp(0.20 + (salaryPct\/100)*0.45 + priceFactor*0.35, 0.05, 0.92);\n  } else {\n    chance = clamp(0.20 + (salaryPct\/100)*0.65, 0.05, 0.90);\n  }\n  if(Math.random() < chance){\n    recruitPlayer(s, loanFee, {loan:true, withOption, salaryPct, negotiatedOptionPrice});\n  } else {\n    if(Math.random() < 1\/3){\n      scouts = scouts.filter(x=>x.id!==s.id);\n      toast(`❌ ${s.club} refuse le prêt de ${s.name} et met fin aux négociations — le joueur n'est plus disponible.`);\n      renderScouts();\n    } else {\n      toast(`${s.club} refuse le prêt de ${s.name} (conditions proposées trop faibles).`);\n    }\n  }\n}\nfunction signFreeAgent(id){\n  if(!isMercatoOpen()){ toast(`🔒 Le mercato est fermé — impossible de recruter. ${mercatoStatusText()}`); return; }\n  const s = scouts.find(x=>x.id===id);\n  if(!s) return;\n  if(levelGapTooHigh(s)){ toast(`🚫 ${s.name} (niveau estimé ${s.scoutedLevel}) est bien trop fort pour ${CLUB_NAME} — écart de plus de 10 avec le niveau moyen de l'effectif (${computeTeamAvgLevel().toFixed(1)}).`); return; }\n  const salaryRange=document.getElementById('negSalaryRangeFree-'+id);\n  const proposedSalary = salaryRange ? parseInt(salaryRange.value) : s.salaryDemand;\n  const yearsRange=document.getElementById('negYearsRangeFree-'+id);\n  const contractYears = yearsRange ? parseInt(yearsRange.value) : 3;\n  if(proposedSalary > salaryCapRemaining()){ toast(`🚫 Masse salariale insuffisante pour ce salaire proposé (${formatSalaryK(proposedSalary)}, marge restante : ${formatSalaryK(salaryCapRemaining())}).`); return; }\n  const salaryChance = salaryNegotiationChance(proposedSalary, s.salaryDemand);\n  if(Math.random() >= salaryChance){\n    toast(`💬 ${s.name} refuse le salaire proposé (${formatSalaryK(proposedSalary)}) — tentez une proposition plus généreuse.`);\n    return;\n  }\n  recruitPlayer(s, 0, {loan:false, negotiatedSalary: proposedSalary, years: contractYears}); \/\/ joueur libre : aucun coût de transfert\n}\nfunction recruitPlayer(s, price, opts){\n  opts = opts || {};\n  state.transferBudget = +(state.transferBudget - price).toFixed(2);\n  const pos = s.mainPos[0], mainPos = s.mainPos, sec = s.trueSec;\n  const level = s.trueLevel, truePot = s.truePot;\n  const newPlayer = {\n    id: nextPlayerId++,\n    name: s.name, pos, mainPos, sec, age: s.age,\n    retirementAge: generateRetirementAge(pos),\n    level, pot: truePot, truePot: truePot,\n    nat: s.nat, salary: opts.loan ? Math.round(playerSalaryK(level, s.age) * (opts.salaryPct||100)\/100) : (opts.negotiatedSalary!==undefined ? opts.negotiatedSalary : playerSalaryK(level, s.age)), years: opts.loan?1:(opts.years||3), loanWeeksLeft: opts.loan?52:undefined, moral: 78, consecutiveMatchesStarted:0, consecutiveMatchesBenched:0, fatigueMalus:0, lastContractWeek:absoluteWeek(),\n    adnVisible: s.trueAdn.visible, adnHidden: s.trueAdn.hidden, starter:false,\n    injuryWeeksLeft:0, injuryTier:null,\n    coachRelation:'C', vieProScore: 30+Math.floor(Math.random()*71), listedTransfer:false, listedPretSec:false, listedPretOA:false,\n    i1Malus:0, i3Malus:-2,\n    levelAtSeasonStart: level, departureAlertShown:false, retirementAlertShown:false, weeksAtClub: 0,\n    isLoan: !!opts.loan, loanClub: opts.loan ? s.club : null,\n    withOption: !!(opts.loan && opts.withOption),\n    optionPrice: (opts.loan && opts.withOption) ? (opts.negotiatedOptionPrice!==null && opts.negotiatedOptionPrice!==undefined ? opts.negotiatedOptionPrice : playerValue(level, s.age, truePot)) : 0,\n    stats:{m:0,g:0,a:0,jc:0,rc:0,cs:0,e:0,noteSum:0,noteCount:0}, statsHistory:[],\n    axes: generateAxes(pos)\n  };\n  assignJerseyNumber(newPlayer);\n  players.push(newPlayer);\n  scouts = scouts.filter(x=>x.id!==s.id);\n  if(opts.loan){\n    toast(`✅ ${s.name} rejoint ${CLUB_NAME} en prêt${opts.withOption?\" (avec option d'achat)\":\"\"} pour ${formatValueM(price)} (${opts.salaryPct||100}% du salaire à notre charge) !`);\n  } else {\n    toast(`✅ ${s.name} rejoint ${CLUB_NAME} pour ${formatValueM(price)} !`);\n  }\n  const ecartNiveau = level - s.scoutedLevel, ecartPot = truePot - s.scoutedPot;\n  if(ecartNiveau!==0 || ecartPot!==0 || newPlayer.sec.length>0){\n    setTimeout(()=>showRecruitReveal(newPlayer, s.scoutedLevel, s.scoutedPot), 500);\n  }\n  renderEffectif(); renderComposition(); renderScouts(); renderDashboard(); renderFinances(); renderRecrutHeader();\n}\n\/* Joueurs actuellement au club en prêt avec option d'achat : levée possible à tout moment. *\/\nlet oaNegOpenId = null;\nfunction toggleOANeg(playerId){\n  oaNegOpenId = (oaNegOpenId===playerId) ? null : playerId;\n  renderOAClubTable();\n}\nfunction renderOAClubTable(){\n  const tbody = document.getElementById('oaClubTable');\n  const emptyHint = document.getElementById('oaClubEmptyHint');\n  if(!tbody) return;\n  const oaPlayers = players.filter(p=>p.isLoan && p.withOption);\n  tbody.innerHTML = '';\n  if(emptyHint) emptyHint.style.display = oaPlayers.length ? 'none' : 'block';\n  oaPlayers.forEach(p=>{\n    const tr = document.createElement('tr');\n    const isBlocked = p.oaBlockedUntilWeek && absoluteWeek() < p.oaBlockedUntilWeek;\n    const canAfford = p.optionPrice <= state.transferBudget && !isBlocked;\n    const marketSalary = playerSalaryK(p.level, p.age);\n    if(oaNegOpenId===p.id){\n      tr.innerHTML = `\n        <td colspan=\"6\">\n          <div class=\"neg-panel\" style=\"display:block;\">\n            <div class=\"neg-row\"><span>${p.name} — lever l'option pour ${formatValueM(p.optionPrice)}<\/span><\/div>\n            <div class=\"neg-row\"><span>Salaire mensuel proposé<\/span><span id=\"oaSalaryLabel-${p.id}\">${formatSalaryK(marketSalary)}<\/span><\/div>\n            <input type=\"range\" min=\"${Math.max(1,Math.round(marketSalary*0.6))}\" max=\"${Math.round(marketSalary*1.6)}\" value=\"${marketSalary}\" oninput=\"document.getElementById('oaSalaryLabel-${p.id}').textContent=formatSalaryK(this.value)\" id=\"oaSalaryRange-${p.id}\">\n            <div class=\"neg-row\"><span>Durée du contrat<\/span><span id=\"oaYearsLabel-${p.id}\">3 ans<\/span><\/div>\n            <input type=\"range\" min=\"1\" max=\"4\" step=\"1\" value=\"3\" oninput=\"document.getElementById('oaYearsLabel-${p.id}').textContent=this.value+(this.value>1?' ans':' an')\" id=\"oaYearsRange-${p.id}\">\n            <p class=\"hint\" style=\"margin:4px 0 0;\">Le joueur passe d'un salaire partagé en prêt à un contrat plein — négociez son nouveau salaire et sa durée.<\/p>\n            <div style=\"display:flex;gap:8px;margin-top:8px;\">\n              <button class=\"btn btn-accent btn-sm\" onclick=\"confirmExercerOptionAchat(${p.id})\" ${canAfford?'':'disabled'}>💰 Confirmer la levée d'option<\/button>\n              <button class=\"btn btn-ghost btn-sm\" onclick=\"toggleOANeg(${p.id})\">Annuler<\/button>\n            <\/div>\n          <\/div>\n        <\/td>`;\n    } else {\n      tr.innerHTML = `\n        <td><div class=\"player-name\" style=\"cursor:pointer;\" onclick=\"goToPlayerInEffectif(${p.id})\">${p.name}${injuryIconHTML(p)}${captainIconHTML(p)}<\/div><\/td>\n        <td>${p.mainPos.slice().sort((a,b)=>POSITION_RANK[a]-POSITION_RANK[b]).map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')}<\/td>\n        <td><b>${p.level}<\/b><\/td>\n        <td>${p.loanClub||'—'}<\/td>\n        <td><b>${formatValueM(p.optionPrice)}<\/b><\/td>\n        <td style=\"text-align:right;\"><button class=\"btn btn-accent btn-sm\" onclick=\"toggleOANeg(${p.id})\" ${canAfford?'':'disabled'} title=\"${isBlocked?`Négociations rompues, encore ${p.oaBlockedUntilWeek-absoluteWeek()} semaine(s)`:canAfford?'':'Budget transfert insuffisant'}\">💰 Lever l'option<\/button><\/td>`;\n    }\n    tbody.appendChild(tr);\n  });\n}\n\/* Affiche la liste des joueurs partis en prêt (sec ou avec OA) cette saison — dans les deux\n   onglets Effectif et Recrutement, à partir de la même source (state.loanedOutThisSeason). *\/\nfunction renderLoanedOutThisSeason(){\n  const rowsHtml = state.loanedOutThisSeason.map(r=>`\n    <tr>\n      <td>${r.name}<\/td>\n      <td>${r.mainPos.map(c=>`<span class=\"badge ${posClass(c)}\">${displayPosLabel(c)}<\/span>`).join(' ')}<\/td>\n      <td>${r.club}<\/td>\n      <td>${OFFER_TYPE_LABELS[r.type]}<\/td>\n      <td>${r.optionPrice!==null ? formatValueM(r.optionPrice) : '—'}<\/td>\n    <\/tr>`).join('');\n  ['loanedOutEffectifTable','loanedOutRecrutTable'].forEach(id=>{\n    const tbody = document.getElementById(id);\n    if(tbody) tbody.innerHTML = rowsHtml;\n  });\n  ['loanedOutEffectifEmptyHint','loanedOutRecrutEmptyHint'].forEach(id=>{\n    const hint = document.getElementById(id);\n    if(hint) hint.style.display = state.loanedOutThisSeason.length ? 'none' : 'block';\n  });\n}\nfunction renderRecrutHeader(){\n  renderLoanedOutThisSeason();\n  document.getElementById('recrutBudgetPill').textContent = formatValueM(state.transferBudget);\n  const open = isMercatoOpen();\n  const pill = document.getElementById('mercatoStatusPill');\n  pill.innerHTML = `<span class=\"dot\" style=\"background:${open?'var(--ok)':'var(--danger)'}\"><\/span>${open?'🟢 Mercato ouvert':'🔴 Mercato fermé'}`;\n  const banner = document.getElementById('mercatoBanner');\n  banner.innerHTML = '';\n  document.getElementById('recrutBudgetTransfert').textContent = formatValueM(state.transferBudget);\n  document.getElementById('recrutBudgetSalarial').textContent = formatSalaryK(salaryCapRemaining())+' \/ mois';\n  const convertRange = document.getElementById('convertRange');\n  if(convertRange){\n    const enoughBudget = state.transferBudget >= 0.1;\n    convertRange.min = 0.1;\n    convertRange.step = 0.1;\n    convertRange.max = Math.max(0.1, state.transferBudget).toFixed(1);\n    convertRange.disabled = !enoughBudget;\n    if(parseFloat(convertRange.value) > state.transferBudget || parseFloat(convertRange.value) < 0.1) convertRange.value = 0.1;\n    updateConvertPreview(convertRange.value);\n    const confirmBtn = document.querySelector('#convertPanelToSalary button.btn-accent');\n    if(confirmBtn) confirmBtn.disabled = !enoughBudget;\n    const notEnoughHint = document.getElementById('convertNotEnoughHint');\n    if(notEnoughHint) notEnoughHint.style.display = enoughBudget ? 'none' : 'block';\n  }\n  const convertRangeReverse = document.getElementById('convertRangeReverse');\n  if(convertRangeReverse){\n    const maxReverse = Math.max(0, salaryCapRemaining());\n    convertRangeReverse.max = maxReverse;\n    if(parseFloat(convertRangeReverse.value) > maxReverse) convertRangeReverse.value = 0;\n    updateConvertReversePreview(convertRangeReverse.value);\n  }\n  const nbScoutsEl = document.getElementById('nbScoutsLabel');\n  if(nbScoutsEl) nbScoutsEl.textContent = `${state.nbScouts} \/ ${MAX_SCOUTS}`;\n  const scoutCostEl = document.getElementById('scoutCostLabel');\n  if(scoutCostEl) scoutCostEl.textContent = `${formatSalaryK(totalScoutSalary())}\/mois`;\n  const recruterScoutBtn = document.getElementById('recruterScoutBtn');\n  if(recruterScoutBtn) recruterScoutBtn.disabled = state.nbScouts>=MAX_SCOUTS;\n  renderScouts(); renderOffers(); renderLoanOptions(); renderOAClubTable();\n}\n\/* Conversion budget transfert -> plafond salarial : taux défavorable, 1 M€ = 70 k€\/mois,\n   permanent et irréversible. *\/\nfunction updateConvertPreview(value){\n  const amount = parseFloat(value) || 0;\n  const amountEl = document.getElementById('convertAmountLabel');\n  const gainEl = document.getElementById('convertGainLabel');\n  if(amountEl) amountEl.textContent = formatValueM(amount);\n  if(gainEl) gainEl.textContent = '+'+formatSalaryK(Math.round(amount*70));\n}\nfunction confirmConvertBudget(){\n  const range = document.getElementById('convertRange');\n  const amount = +(Math.round((parseFloat(range.value) || 0)*10)\/10).toFixed(
