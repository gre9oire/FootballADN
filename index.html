ffectif au style du coach\n  let attackSum=0, attackWeight=0, defenseSum=0, defenseWeight=0;\n  assignment.forEach(a=>{\n    const lvl = computeAdjustedLevel(a.player);\n    const aw = ATTACK_WEIGHT[a.slot] ?? 0.5, dw = DEFENSE_WEIGHT[a.slot] ?? 0.5;\n    if(aw>0){ attackSum += lvl*aw; attackWeight += aw; }\n    if(dw>0){ defenseSum += lvl*dw; defenseWeight += dw; }\n  });\n  return {\n    niveauAttaque: (attackWeight ? attackSum\/attackWeight : 45) + coachBonus + styleBonus,\n    niveauDefense: (defenseWeight ? defenseSum\/defenseWeight : 45) + coachBonus + styleBonus\n  };\n}\n\/* Q3\/Q4 + étapes finales : buts attendus de chaque équipe. Notre attaque est multipliée par\n   la défense adverse (et inversement) — l'adversaire, sans détail individuel, a une même\n   valeur de force des deux côtés (CLUB_STRENGTH). +0,3 à domicile, ±0,3 d'aléatoire. *\/\nfunction computeExpectedGoals(fx){\n  const isHome = fx[0]===CLUB_NAME;\n  const opponent = isHome ? fx[1] : fx[0];\n  const { niveauAttaque, niveauDefense } = computeAttackDefenseScores();\n  const oppLevel = CLUB_STRENGTH[opponent] || 48;\n\n  const usScoreAttaque = niveauAttaque\/20, usScoreDefense = 20\/Math.max(1,niveauDefense);\n  const oppScoreAttaque = oppLevel\/20, oppScoreDefense = 20\/Math.max(1,oppLevel);\n\n  let usExp = usScoreAttaque * oppScoreDefense;\n  let oppExp = oppScoreAttaque * usScoreDefense;\n  const intention = coach.style[0]; \/\/ E2 : '1' offensif (+20% buts), '2' neutre, '3' défensif (-20% buts)\n  if(intention==='1') usExp *= 1.2; else if(intention==='3') usExp *= 0.8;\n  if(isHome) usExp += 0.3; else oppExp += 0.3; \/\/ Q4 : avantage du terrain\n  usExp += (Math.random()*0.6-0.3); \/\/ Q3 : aléatoire indépendant par équipe\n  oppExp += (Math.random()*0.6-0.3);\n  usExp = clamp(usExp, 0.15, 4.5);\n  oppExp = clamp(oppExp, 0.15, 4.5);\n\n  return { homeExp: isHome?usExp:oppExp, awayExp: isHome?oppExp:usExp,\n    usStrength: (niveauAttaque+niveauDefense)\/2, oppStrength: oppLevel };\n}\nfunction fitScore(p, slotPos){\n  if(p.injuryWeeksLeft>0) return -Infinity; \/\/ H3 : un joueur blessé n'est pas sélectionnable\n  const isGBSlot = slotPos===\"GB\";\n  const isGBPlayer = p.mainPos.includes(\"GB\");\n  if(isGBSlot !== isGBPlayer) return -Infinity; \/\/ un gardien ne joue jamais en dehors des cages, et inversement\n  const adjLevel = computeAdjustedLevel(p) + (knownADN(p).includes('Chouchou du coach') ? 12 : 0); \/\/ Q1 : niveau + Forme (I1-I4) + chimie coach ; +12 compense le -6 de base et ajoute le +6 de selection pour Chouchou du coach\n  if(p.mainPos.includes(slotPos)) return adjLevel;\n  if(p.sec.includes(slotPos)) return knownADN(p).includes('Polyvalent') ? adjLevel+15 : adjLevel-5;\n  return -Infinity; \/\/ un joueur ne peut jamais jouer à un poste hors de ses postes principaux\/secondaires\n}\n\/* Affectation OPTIMALE par programmation dynamique à DEUX dimensions (joueur × masque de postes).\n   Une version à une seule dimension (dp[masque] partagé entre tous les joueurs) semblait fonctionner\n   mais contenait un défaut subtil : au sein du passage d'un même joueur, deux postes différents\n   pouvaient chacun \"réclamer\" ce joueur indépendamment (chacun lisant le même état gelé), sans\n   qu'aucune des deux lectures ne sache que l'autre l'utilisait aussi — d'où un même joueur parfois\n   compté deux fois à la reconstruction. En indexant explicitement par joueur ET par masque\n   (dp[i][masque] ne dépend que de dp[i-1][...], jamais de lui-même), ce problème est structurellement\n   impossible : chaque joueur n'apparaît qu'à UNE seule \"couche\", donc qu'à UN seul poste. *\/\nfunction assignStartersToShape(pool0, shapeFlat){\n  const numSlots = shapeFlat.length;\n  const full = (1<<numSlots)-1;\n  const n = pool0.length;\n  let dpPrev = new Array(1<<numSlots).fill(-Infinity);\n  dpPrev[0] = 0;\n  const choiceLayers = [];\n  for(let i=0;i<n;i++){\n    const p = pool0[i];\n    const dpCur = dpPrev.slice();\n    const choiceLayer = new Array(1<<numSlots).fill(null);\n    for(let mask=0; mask<=full; mask++){\n      if(dpPrev[mask]===-Infinity) continue;\n      for(let s=0;s<numSlots;s++){\n        if(mask & (1<<s)) continue;\n        const sc = fitScore(p, shapeFlat[s]);\n        if(sc===-Infinity) continue;\n        const newMask = mask | (1<<s);\n        const newScore = dpPrev[mask] + sc;\n        if(newScore > dpCur[newMask]){\n          dpCur[newMask] = newScore;\n          choiceLayer[newMask] = {prevMask:mask, slotIdx:s};\n        }\n      }\n    }\n    choiceLayers.push(choiceLayer);\n    dpPrev = dpCur;\n  }\n  if(dpPrev[full]===-Infinity) return { assignment:null, avg:-Infinity, feasible:false };\n  const assignment = new Array(numSlots);\n  let mask = full;\n  for(let i=n-1;i>=0 && mask!==0;i--){\n    const c = choiceLayers[i][mask];\n    if(c){\n      assignment[c.slotIdx] = { slot:shapeFlat[c.slotIdx], player:pool0[i], score: fitScore(pool0[i], shapeFlat[c.slotIdx]) };\n      mask = c.prevMask;\n    }\n  }\n  const usedPlayerIds = new Set(assignment.filter(Boolean).map(a=>a.player.id));\n  if(usedPlayerIds.size !== numSlots) return { assignment:null, avg:-Infinity, feasible:false }; \/\/ garde-fou de cohérence\n  return { assignment, avg: dpPrev[full]\/numSlots, feasible:true };\n}\n\/* Clé de cache rapide (O(n), quelques microsecondes) résumant tout ce qui influence réellement\n   le choix du onze\/tactique optimal : effectif, forme (I1\/I3\/I4), blessures, forme d'équipe\n   (I2) et tactiques connues du coach. Le onze titulaire lui-même (p.starter) est un RÉSULTAT de\n   ce calcul, jamais une entrée — il ne doit surtout pas être inclus ici. Permet d'éviter de\n   relancer la recherche coûteuse (~100-200ms) quand rien de pertinent n'a changé depuis le\n   dernier calcul, ce qui était la cause principale des ralentissements. *\/\nfunction computeXIStateHash(){\n  let h = '';\n  for(let i=0;i<players.length;i++){\n    const p = players[i];\n    h += p.id+','+p.level+','+(p.i1Malus||0)+','+(p.i3Malus||0)+','+p.moral+','+(p.injuryWeeksLeft>0?1:0)+','+(p.fatigueMalus||0)+','+(p.consecutiveMatchesBenched||0)+';';\n  }\n  h += '|'+coach.primaryTactiques.join(',')+'|'+coach.secondaryTactiques.join(',');\n  h += '|'+(state.matchNotesHistory||[]).join(',');\n  return h;\n}\n\/* Identité du onze titulaire actuel (dépendance directe de computeBestTactique, distincte du\n   hash global puisque p.starter en est une ENTRÉE ici, pas une sortie). *\/\nfunction starterKey(){\n  return players.filter(p=>p.starter).map(p=>p.id).sort((a,b)=>a-b).join(',');\n}\nlet _bestTactiqueCache = null;\nfunction computeBestTactique(){\n  const hashBefore = computeXIStateHash();\n  if(_bestTactiqueCache && _bestTactiqueCache.starterKey===starterKey() && _bestTactiqueCache.hash===hashBefore){\n    return _bestTactiqueCache.result;\n  }\n  const starters = players.filter(p=>p.starter);\n  const candidates = [\n    ...coach.primaryTactiques.map(f=>({f,isPrimary:true})),\n    ...coach.secondaryTactiques.map(f=>({f,isPrimary:false}))\n  ];\n  let best=null;\n  candidates.forEach(({f,isPrimary})=>{\n    Object.keys(TACTIQUES[f].variants).forEach(variantName=>{\n      const shape = buildShape(f, variantName);\n      const res = assignStartersToShape(starters, shape.flat);\n      if(!res.feasible) return; \/\/ cette variante ne peut pas être composée avec l'effectif actuel\n      const finalAvg = isPrimary ? res.avg : res.avg-3;\n      if(!best || finalAvg>best.avg){ best={family:f, variant:variantName, avg:finalAvg, assignment:res.assignment, isPrimary, shape}; }\n    });\n  });\n  if(!best){\n    \/\/ Filet de sécurité : aucune variante connue n'est réalisable avec les titulaires actuels\n    \/\/ (ne devrait plus arriver, puisque refreshCoachSelections() recompose le onze via\n    \/\/ autoSelectStarters() — qui fait déjà monter un jeune du centre de formation en cas de\n    \/\/ poste vide — avant d'en arriver ici). On retente une fois après ce filet de sécurité.\n    fillEmptyPositionGaps(0);\n    const starters2 = players.filter(p=>p.starter);\n    candidates.forEach(({f,isPrimary})=>{\n      Object.keys(TACTIQUES[f].variants).forEach(variantName=>{\n        const shape = buildShape(f, variantName);\n        const res = assignStartersToShape(starters2, shape.flat);\n        if(!res.feasible) return;\n        const finalAvg = isPrimary ? res.avg : res.avg-3;\n        if(!best || finalAvg>best.avg){ best={family:f, variant:variantName, avg:finalAvg, assignment:res.assignment, isPrimary, shape}; }\n      });\n    });\n  }\n  if(!best){\n    \/\/ Dernier recours absolu (ne devrait jamais se produire) : affectation d'urgence silencieuse.\n    const family = coach.primaryTactiques[0];\n    const variantName = Object.keys(TACTIQUES[family].variants)[0];\n    const shape = buildShape(family, variantName);\n    const pool = players.filter(p=>p.starter).slice();\n    const assignment = shape.flat.map(slotPos=>{\n      let bestIdx=0, bestScore=-Infinity;\n      pool.forEach((p,idx)=>{\n        const isGBSlot=slotPos===\"GB\", isGBPlayer=p.mainPos.includes(\"GB\");\n        const adjLvl = computeAdjustedLevel(p); let sc = (p.injuryWeeksLeft>0) ? -99999 : (isGBSlot!==isGBPlayer) ? -9999 : (p.mainPos.includes(slotPos)?adjLvl : p.sec.includes(slotPos)?adjLvl-5 : adjLvl-25);\n        if(sc>bestScore){ bestScore=sc; bestIdx=idx; }\n      });\n      const chosen = pool.splice(bestIdx,1)[0];\n      return { slot:slotPos, player:chosen, score:bestScore };\n    });\n    const avg = assignment.reduce((s,a)=>s+a.score,0)\/shape.flat.length;\n    best = { family, variant:variantName, avg, assignment, isPrimary:true, shape };\n  }\n  _bestTactiqueCache = { hash:hashBefore, starterKey:starterKey(), result:best };\n  return best;\n}\n\n\/* ---------- ADÉQUATION ADN DES TITULAIRES AU STYLE FIXE DU COACH ---------- *\/\nfunction computeStyleAdnDelta(styleKey){\n  const starters = players.filter(p=>p.starter);\n  const approach = styleKey[1];\n  let delta=0;\n  starters.forEach(p=>{\n    const kn = knownADN(p);\n    if(approach==='A'){ if(kn.includes('Rapide')) delta+=8; if(kn.includes('Lent')) delta-=8; if(kn.includes('Endurant')) delta+=9; if(kn.includes('Vista')||kn.includes('Technique')) delta-=9; }\n    else if(approach==='C'){ if(kn.includes('Vista')||kn.includes('Technique')) delta+=9; if(kn.includes('Rapide')) delta-=8; if(kn.includes('Lent')) delta+=8; if(kn.includes('Endurant')) delta-=9; }\n  });\n  return starters.length ? delta\/starters.length : 0;\n}\n\nfunction refreshCoachSelections(){\n  autoSelectStarters(); \/\/ s'assure que le onze est toujours optimal et sain avant de choisir la tactique\n  const tac = computeBestTactique();\n  state.currentTactiqueFamily = tac.family;\n  state.currentTactiqueVariant = tac.variant;\n  state.currentTactiqueIsPrimary = tac.isPrimary;\n  state.currentTactiqueAvg = tac.avg;\n  state.currentTactiqueAssignment = tac.assignment;\n  \/\/ E2 : le style de jeu est propre au coach (fixé à sa nomination) — il ne change jamais avant un match.\n  const sty = { key: coach.style, avgDelta: computeStyleAdnDelta(coach.style) };\n  state.currentStyle = sty.key;\n  state.currentStyleDelta = sty.avgDelta;\n  return {tac, sty};\n}\n\/* E9 : chaque titulaire donne +5 s'il porte un ADN d'affinité du coach, -5 s'il porte son\n   ADN d'incompatibilité — cet effet s'applique même si l'ADN n'est pas révélé au joueur\/DS. *\/\n\/* ---- D8 : Satisfaction au club (coefficients Salaire 3 \/ Temps de jeu-Niveau 2.5 \/ Résultats 2 \/ Coach 1.5 \/ Vie perso 1) ---- *\/\nfunction computeTeamAvgLevel(){\n  const top18 = players.slice().sort((a,b)=>b.level-a.level).slice(0,18);\n  return top18.reduce((s,p)=>s+p.level,0)\/Math.max(1,top18.length);\n}\nfunction computeResultsScore(){\n  const hist = state.matchNotesHistory;\n  const n = hist.length;\n  const weights = [4.5,2.5,1.5,1,0.5]; \/\/ M, M-1, M-2, M-3, M-4\n  let total = 0;\n  for(let i=0;i<5;i++){\n    const val = (n-1-i>=0) ? hist[n-1-i] : 50; \/\/ valeur neutre tant que l'historique est incomplet\n    total += val*weights[i];\n  }\n  return total\/10;\n}\n\/* ---- E8 : Satisfaction du coach (Résultats du club ×3, Relation joueurs ×2, Salaire ×2,\n   Relation DS ×1,5, Relation Président ×0,5, Vie perso ×1) ---- *\/\nconst IDEAL_COACH_SALARY = { L1:45, L2:28, N:18 };\nfunction computeCoachSatisfactionBreakdown(){\n  const noteResultats = computeResultsScore();\n  const noteJoueurs = players.length ? players.reduce((s,p)=>s+COACH_RELATION_SCORE[p.coachRelation],0)\/players.length : 60;\n  const idealSalary = IDEAL_COACH_SALARY[state.division] || IDEAL_COACH_SALARY.L2;\n  const noteSalaire = clamp(Math.min(100,(coach.salary\/idealSalary)*75), 0, 100);\n  const noteDS = coach.relationDS;\n  const notePresident = coach.relationPresident;\n  const noteVie = coach.vieProScore!==undefined ? coach.vieProScore : 70;\n  return { noteResultats, noteJoueurs, noteSalaire, noteDS, notePresident, noteVie };\n}\nfunction computeCoachSatisfaction(){\n  const b = computeCoachSatisfactionBreakdown();\n  const weighted = b.noteResultats*3 + b.noteJoueurs*2 + b.noteSalaire*2 + b.noteDS*1.5 + b.notePresident*0.5 + b.noteVie*1;\n  return clamp(Math.round(weighted\/10), 0, 100);\n}\nfunction computeSatisfactionBreakdown(p){\n  \/\/ Satisfaction salaire\n  const salaireIdeal = playerSalaryK(p.level, p.age);\n  const noteSalaire = clamp(Math.min(100, (p.salary\/Math.max(1,salaireIdeal))*75), 0, 100);\n\n  \/\/ Temps de jeu \/ Niveau\n  const moyenneEquipe = computeTeamAvgLevel();\n  const tempsAttendu = Math.max(10, 50 + (p.level - moyenneEquipe)*5);\n  const totalClubMatches = standings[CLUB_NAME].j;\n  let noteTemps;\n  if(totalClubMatches===0){\n    \/\/ La saison n'a pas encore commencé : aucun jugement possible, note neutre par défaut.\n    noteTemps = 75;\n  } else {\n    const tempsReel = (p.stats.m\/totalClubMatches)*100;\n    const noteBrute = clamp((tempsReel\/tempsAttendu)*100, 0, 100);\n    \/\/ Lissage de confiance : sur un tout petit échantillon (1-2 matchs), on ne peut pas encore\n    \/\/ juger sérieusement le temps de jeu — la note brute ne pèse pleinement qu'à partir de 5\n    \/\/ matchs joués par le club, en mélangeant avec une note neutre en attendant.\n    const confiance = clamp(totalClubMatches\/5, 0, 1);\n    noteTemps = noteBrute*confiance + 75*(1-confiance);\n  }\n\n  \/\/ Résultats du club (indice de favoritisme F + moyenne pondérée des 5 dernières Notes du Match)\n  const noteResultats = computeResultsScore();\n\n  \/\/ Relation avec le coach (E10)\n  const noteCoach = COACH_RELATION_SCORE[p.coachRelation];\n\n  \/\/ Vie perso (évolution hebdomadaire indépendante, cf. processWeeklyVieProScore)\n  if(p.vieProScore===undefined) p.vieProScore = 30+Math.floor(Math.random()*71);\n\n  return { noteSalaire, noteTemps, noteResultats, noteCoach, vieProScore:p.vieProScore };\n}\nfunction computeSatisfaction(p){\n  const b = computeSatisfactionBreakdown(p);\n  const weighted = b.noteSalaire*3 + b.noteTemps*2.5 + b.noteResultats*2 + b.noteCoach*1.5 + b.vieProScore*1;\n  return clamp(Math.round(weighted\/10), 0, 100);\n}\nfunction pickScorer(){\n  const starters = players.filter(p=>p.starter);\n  const weightOf = p=>{\n    let w = p.pos==='BU'?5 : ['AiD','AiG','MOC'].includes(p.pos)?3 : ['MDC','MC'].includes(p.pos)?1.3 : p.pos==='GB'?0:0.5;\n    \n    return w*(0.6+p.level\/100);\n  };\n  const total = starters.reduce((s,p)=>s+weightOf(p),0);\n  let r = Math.random()*total;\n  for(const p of starters){ r-=weightOf(p); if(r<=0) return p; }\n  return starters[starters.length-1];\n}\nconst LEFT_SLOTS = ['DG','MG','AiG'];\nconst RIGHT_SLOTS = ['DD','MD','AiD'];\nfunction slotSideOf(playerId){\n  if(!state.currentTactiqueAssignment) return null;\n  const found = state.currentTactiqueAssignment.find(a=>a.player.id===playerId);\n  if(!found) return null;\n  if(LEFT_SLOTS.includes(found.slot)) return 'left';\n  if(RIGHT_SLOTS.includes(found.slot)) return 'right';\n  return null; \/\/ poste central : pas de côté marqué\n}\n\/* Variété des types de but pour l'animation 2D (D9\/D10 réalisme) *\/\nfunction pickFaultPlayer(){ const st = players.filter(p=>p.starter); if(!st.length) return null; const grp = p => { const m = p.mainPos[0]; if(m==='GB'||['DD','DC','DG'].includes(m)) return 3; if(['MDC','MC','MOC','MD','MG'].includes(m)) return 2; return 1; }; const w = st.map(p=>({p, x: grp(p)})); const tot = w.reduce((s,o)=>s+o.x,0); let r = Math.random()*tot; for(const o of w){ r-=o.x; if(r<=0) return o.p; } return w[w.length-1].p; } function pickGoalType(){\n  const r = Math.random();\n  if(r<0.08) return 'penalty';\n  if(r<0.20) return 'corner';\n  if(r<0.38) return 'centre';\n  if(r<0.50) return 'long_ball';\n  return 'open_play';\n}\nfunction pickAssist(excludeId){\n  const starters = players.filter(p=>p.starter && p.id!==excludeId);\n  if(starters.length===0) return null;\n  const weightOf = p=>{\n    let w = ['MOC','AiD','AiG','MC'].includes(p.pos)?4 : p.pos==='MDC'?1.8 : p.pos==='BU'?1.2 : p.pos==='GB'?0.02:0.8;\n    \n    return w*(0.6+p.level\/100);\n  };\n  const total = starters.reduce((s,p)=>s+weightOf(p),0);\n  let r = Math.random()*total;\n  for(const p of starters){ r-=weightOf(p); if(r<=0) return p; }\n  return starters[starters.length-1];\n}\n\nfunction generateMatchEvents(fx){ const isHome = fx[0]===CLUB_NAME; const opponent = isHome? fx[1] : fx[0]; const { homeExp, awayExp, usStrength, oppStrength } = computeExpectedGoals(fx); const events=[]; const cardCount = Math.floor(Math.random()*4); let redMinuteHome = null, redMinuteAway = null; function pickCardVictim(){ const st = players.filter(pl=>pl.starter); if(!st.length) return null; const w = st.map(pl=>({pl, x: actualADN(pl).includes('Rugueux')?1.4:1})); const tot = w.reduce((s,o)=>s+o.x,0); let r = Math.random()*tot; for(const o of w){ r-=o.x; if(r<=0) return o.pl; } return w[w.length-1].pl; } for(let k=0;k<cardCount;k++){ const side = Math.random()<0.5?'home':'away'; const isUsSide = (side==='home' && isHome) || (side==='away' && !isHome); const p = isUsSide ? pickCardVictim() : null; const sanguinBoost = (p && actualADN(p).includes('Sanguin')) ? 1.4 : 1; const red = Math.random()<0.12*sanguinBoost; const minute = 1+Math.floor(Math.random()*90); if(red){ if(side==='home' && (redMinuteHome===null || minute<redMinuteHome)) redMinuteHome = minute; if(side==='away' && (redMinuteAway===null || minute<redMinuteAway)) redMinuteAway = minute; } const cardBonus = red ? (p && actualADN(p).includes('Sanguin') ? 'Sanguin' : null) : (p && actualADN(p).includes('Rugueux') ? 'Rugueux' : null); events.push({minute, type: red?'red':'yellow', side, scorerId: p?p.id:null, scorerName: p?p.name:null, bonusADN: cardBonus}); } function redImpact(m){ return m===null ? 0 : (90-m)\/90; } const impactHome = redImpact(redMinuteHome), impactAway = redImpact(redMinuteAway); const grandCount = players.filter(p=>p.starter && knownADN(p).includes('Grand')).length; const rugueuxCount = players.filter(p=>p.starter && knownADN(p).includes('Rugueux')).length; const rugueuxAtkMult = Math.pow(0.85, rugueuxCount); const physiqueCount = players.filter(p=>p.starter && knownADN(p).includes('Physique')).length; const physiqueAtkMult = Math.pow(1.05, physiqueCount); const physiqueDefMult = Math.pow(0.95, physiqueCount); const matchCapId = getMatchCaptainId(); const leaderMult = players.filter(p=>p.starter && knownADN(p).includes('Leader')).reduce((m,p)=> m * (p.id===matchCapId ? 1.10 : 1.03), 1); const leaderDefMult = players.filter(p=>p.starter && knownADN(p).includes('Leader')).reduce((m,p)=> m * (p.id===matchCapId ? 0.90 : 0.97), 1); const grandDefMult = Math.pow(0.97, grandCount); const homeExpAdj = clamp(homeExp * (1-0.45*impactHome) * (1+0.25*impactAway) * (isHome?1:grandDefMult) * (isHome?rugueuxAtkMult:1) * (isHome?physiqueAtkMult:physiqueDefMult) * (isHome?leaderMult:leaderDefMult), 0.05, 6); const awayExpAdj = clamp(awayExp * (1-0.45*impactAway) * (1+0.25*impactHome) * (isHome?grandDefMult:1) * (isHome?1:rugueuxAtkMult) * (isHome?physiqueDefMult:physiqueAtkMult) * (isHome?leaderDefMult:leaderMult), 0.05, 6); const homeGoals = poissonRandom(homeExpAdj); const awayGoals = poissonRandom(awayExpAdj); function addGoals(count, side){ for(let k=0;k<count;k++){ const minute = 1+Math.floor(Math.random()*90); const isUsSide = (side==='home' && isHome) || (side==='away' && !isHome); const scorer = isUsSide ? pickScorer() : null; let assistP = null; let goalType = isUsSide ? pickGoalType() : 'open_play'; if(isUsSide && scorer && goalType!=='penalty' && Math.random()<0.85){ assistP = pickAssist(scorer.id); } if(goalType==='penalty') assistP = null; const hadDribble = isUsSide && goalType==='open_play' && Math.random()<0.55; let crossSide = null; if(goalType==='centre' || goalType==='corner'){ crossSide = (assistP && slotSideOf(assistP.id)) || (Math.random()<0.5?'left':'right'); } events.push({minute, type:'goal', side, scorerId: scorer?scorer.id:null, scorerName: scorer?scorer.name:null, assistId: assistP?assistP.id:null, assistName: assistP?assistP.name:null, hadDribble, goalType, crossSide}); } } addGoals(homeGoals,'home'); addGoals(awayGoals,'away'); const ourSide = isHome?'home':'away'; const cpaTeammate = players.find(q=>q.starter && actualADN(q).includes('Tireur de CPA')); players.filter(p=>p.starter && !p.mainPos.includes('GB') && knownADN(p).includes('Grand')).forEach(gp=>{ if(Math.random()<0.05){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:gp.id, scorerName:gp.name, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Grand', bonusPlayerId:gp.id}); } if(cpaTeammate && Math.random()<0.05){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:gp.id, scorerName:gp.name, assistId:cpaTeammate.id, assistName:cpaTeammate.name, hadDribble:false, goalType:'corner', crossSide:null, bonusADN:'Grand', bonusPlayerId:gp.id}); } }); const oppSide = isHome?'away':'home'; players.filter(p=>p.starter && knownADN(p).includes('Vista')).forEach(vp=>{ if(Math.random()<0.15){ const scorer = pickScorer() || vp; events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:scorer.id, scorerName:scorer.name, assistId:vp.id, assistName:vp.name, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Vista', bonusPlayerId:vp.id}); } if(Math.random()<0.10){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:oppSide, scorerId:null, scorerName:null, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null}); } }); players.filter(p=>p.starter && knownADN(p).includes('Technique')).forEach(tp=>{ if(Math.random()<0.05){ if(!tp.mainPos.includes('GB') && Math.random()<0.5){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:tp.id, scorerName:tp.name, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Technique', bonusPlayerId:tp.id}); } else { const scorer = pickScorer() || tp; events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:scorer.id, scorerName:scorer.name, assistId:tp.id, assistName:tp.name, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Technique', bonusPlayerId:tp.id}); } } if(Math.random()<0.05){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:oppSide, scorerId:null, scorerName:null, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null}); } }); players.filter(p=>p.starter && !p.mainPos.includes('GB') && knownADN(p).includes('Prolifique')).forEach(pp=>{ if(Math.random()<0.10){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:pp.id, scorerName:pp.name, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Prolifique', bonusPlayerId:pp.id}); } }); players.filter(p=>p.starter && knownADN(p).includes('Tireur de CPA')).forEach(cp=>{ if(Math.random()<0.10){ if(!cp.mainPos.includes('GB') && Math.random()<0.5){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:cp.id, scorerName:cp.name, assistId:null, assistName:null, hadDribble:false, goalType:'corner', crossSide:null, bonusADN:'Tireur de CPA', bonusPlayerId:cp.id}); } else { const scorer = pickScorer() || cp; events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:ourSide, scorerId:scorer.id, scorerName:scorer.name, assistId:cp.id, assistName:cp.name, hadDribble:false, goalType:'corner', crossSide:null, bonusADN:'Tireur de CPA', bonusPlayerId:cp.id}); } } }); players.filter(p=>p.starter && knownADN(p).includes('Déconcentré')).forEach(pc=>{ if(Math.random()<0.20){ events.push({minute:1+Math.floor(Math.random()*90), type:'goal', side:oppSide, scorerId:null, scorerName:null, assistId:null, assistName:null, hadDribble:false, goalType:'open_play', crossSide:null, bonusADN:'Déconcentré', bonusPlayerId:pc.id, isUsConceding:true}); } }); events.filter(ev=>ev.type==='goal' && ev.side===oppSide && !ev.bonusPlayerId).forEach(ev=>{ if(Math.random() < 2\/3){ const fp = pickFaultPlayer(); if(fp){ ev.faultPlayerId = fp.id; ev.faultPlayerName = fp.name; } } }); events.sort((a,b)=>a.minute-b.minute);\n  return {events, isHome, opponent, homeName: isHome?CLUB_NAME:opponent, awayName: isHome?opponent:CLUB_NAME, usStrength, oppStrength};\n}\n\n\/* Barre d'action fixe de l'onglet Match : toujours à la même place, quel que soit le panneau\n   affiché (pré-match, semaine sans match, match en direct, résumé) — le bouton principal\n   n'a donc plus jamais besoin d'être cherché.\n   Le gestionnaire de clic (handleMatchActionClick) réévalue l'état RÉEL des panneaux au moment\n   même du clic, plutôt que de dépendre d'un gestionnaire pré-assigné à l'avance : ainsi, même si\n   un événement différé (setTimeout d'une révélation, d'une alerte...) change l'état entre deux\n   rendus, le bouton reste toujours fiable et ne peut jamais rester bloqué sur une action obsolète. *\/\nfunction handleMatchActionClick(){\n  const liveVisible = document.getElementById('liveMatchPanel').style.display !== 'none';\n  const summaryVisible = document.getElementById('summaryPanel').style.display !== 'none';\n  const preVisible = document.getElementById('preMatchPanel').style.display !== 'none';\n  if(liveVisible) fastForward();\n  else if(summaryVisible) closeSummary();\n  else if(preVisible) startMatch(true);\n  else advanceWeek();\n}\nfunction updateMatchActionBar(){\n  const btn = document.getElementById('matchActionBtn');\n  if(!btn) return;\n  const secondaryBtn = document.getElementById('matchActionSecondaryBtn');\n  const hint = document.getElementById('matchActionHint');\n  const liveVisible = document.getElementById('liveMatchPanel').style.display !== 'none';\n  const summaryVisible = document.getElementById('summaryPanel').style.display !== 'none';\n  const preVisible = document.getElementById('preMatchPanel').style.display !== 'none';\n\n  btn.onclick = handleMatchActionClick; \/\/ fixe une fois pour toutes, jamais réassigné à une fonction différente\n  secondaryBtn.style.display = 'none';\n  btn.disabled = false;\n\n  if(liveVisible){\n    hint.textContent = 'Le match est en cours.';\n    btn.textContent = '⏭ Passer la suite du match';\n  } else if(summaryVisible){\n    hint.textContent = 'Match terminé.';\n    btn.textContent = '➡️ Continuer la saison';\n  } else if(preVisible){\n    hint.textContent = 'Regardez le match minute par minute, ou passez directement au résultat.';\n    secondaryBtn.style.display = 'inline-flex';\n    secondaryBtn.onclick = ()=>startMatch(false);\n    btn.textContent = '⏭ Passer le match';\n  } else {\n    hint.textContent = 'Pas de match cette semaine.';\n    btn.textContent = '⏭ Semaine suivante';\n  }\n}\nfunction renderPreMatch(){\n  const fx = getUserFixture();\n  document.getElementById('summaryPanel').style.display='none';\n  document.getElementById('liveMatchPanel').style.display='none';\n  const b = weekBlock(state.week);\n  const pendingNow = getPendingFixturesThisWeek();\n  const currentType = pendingNow.length ? pendingNow[0].type : null;\n  const isCupMatch = currentType==='cup';\n  const isEuroMatch = currentType==='euro';\n  const euroLabel = state.euro && state.euro.competition==='UCL' ? 'Ligue des Champions' : 'Ligue Europa';\n  document.getElementById('matchMeta').textContent = isCupMatch\n    ? `🏆 Coupe de France — ${CUP_ROUND_NAMES[state.cup.roundIndex]} · Semaine ${state.week} \/ ${WEEKS_TOTAL}`\n    : isEuroMatch\n    ? `⚽ ${euroLabel} — ${state.euro.phase==='league' ? 'Match '+(state.euro.matchesPlayed+1)+'\/10' : EURO_KNOCKOUT_NAMES[state.euro.knockoutRoundIndex]} · Semaine ${state.week} \/ ${WEEKS_TOTAL}`\n    : `${DIVISION_NAMES[state.division]} — Semaine ${state.week} \/ ${WEEKS_TOTAL} · ${b.label}`;\n  if(fx){\n    document.getElementById('preMatchPanel').style.display='block';\n    document.getElementById('offWeekPanel').style.display='none';\n    const isHome = fx[0]===CLUB_NAME;\n    const opp = isHome? fx[1]:fx[0];\n    document.getElementById('preMatchOppName').textContent = opp;\n    document.getElementById('preMatchOppName').style.cursor = 'pointer';\n    document.getElementById('preMatchOppName').title = 'Voir au classement';\n    document.getElementById('preMatchOppName').onclick = ()=>goToClassement(opp);\n    document.getElementById('preMatchOppCrest').textContent = clubCode(opp);\n    document.getElementById('preMatchUsRole').textContent = isHome?'Domicile':'Extérieur';\n    document.getElementById('preMatchOppRole').textContent = isHome?'Extérieur':'Domicile';\n    document.getElementById('preMatchUsBlock').style.order = isHome ? '1' : '3';\n    document.getElementById('preMatchOppBlock').style.order = isHome ? '3' : '1';\n    renderPreMatchPitch();\n  } else {\n    document.getElementById('preMatchPanel').style.display='none';\n    document.getElementById('offWeekPanel').style.display='block';\n    const offText = document.getElementById('offWeekText');\n    if(state.week>=WEEKS_TOTAL){\n      offText.innerHTML = `Saison terminée (Semaine 52). Passez au bilan de fin de saison depuis le <a href=\"#\" onclick=\"goToTab('dashboard');return false;\">Tableau de bord<\/a>.`;\n    } else {\n      offText.innerHTML = `Pas de match cette semaine — ${b.label}.`;\n    }\n  }\n  updateMatchActionBar();\n}\n\n\/* Aperçu de la composition avant match, sur un terrain — sans les joueurs adverses *\/\nfunction renderPreMatchPitch(){\n  const container = document.getElementById('preMatchPitchContainer');\n  if(!container) return;\n  refreshCoachSelections(); \/\/ s'assure que l'assignation reflète le onze\/tactique actuels\n  const assignment = state.currentTactiqueAssignment;\n  if(!assignment){ container.innerHTML=''; return; }\n  const shape = buildShape(state.currentTactiqueFamily, state.currentTactiqueVariant);\n  const coords = computePitchCoords(shape);\n  const matchCaptainId = getMatchCaptainId();\n  let html = `<div class=\"pitch\">`;\n  assignment.forEach((a,i)=>{\n    const c = coords[i];\n    const colors = pitchDotColors(a.player.mainPos[0]);\n    const isCaptain = a.player.id===matchCaptainId;\n    html+=`<div class=\"pdot us\" style=\"left:${c.x}%;top:${c.y}%;\"><div class=\"circ\" style=\"background:${colors.bg};color:${colors.fg};\">${a.player.number||'–'}${isCaptain?'<span title=\"Capitaine du match\" style=\"position:absolute;top:-6px;right:-6px;font-size:12px;\">🎖️<\/span>':''}<\/div><div class=\"lbl\">${a.player.name.split(' ').slice(-1)[0]}<\/div><\/div>`;\n  });\n  html+='<\/div>';\n  container.innerHTML = html;\n}\nfunction renderPitchForMatch(targetId){\n  const assignment = state.currentTactiqueAssignment;\n  const shape = buildShape(state.currentTactiqueFamily, state.currentTactiqueVariant);\n  const coords = computePitchCoords(shape);\n\n  const loggedEvents = (matchState && matchState.events) ? matchState.events.slice(0, matchState.i) : []; const goalsBy = {}, assistsBy = {}, faultBy = {}; loggedEvents.forEach(e=>{ if(e.type==='goal'){ if(e.scorerId) goalsBy[e.scorerId] = (goalsBy[e.scorerId]||0)+1; if(e.assistId) assistsBy[e.assistId] = (assistsBy[e.assistId]||0)+1; const isUsSideForFault = (e.side==='home' && matchState.isHome) || (e.side==='away' && !matchState.isHome); if(!isUsSideForFault){ const culprit = e.faultPlayerId || e.bonusPlayerId; if(culprit) faultBy[culprit] = (faultBy[culprit]||0)+1; } } }); let html = `<div class=\"pitch\">`;\n  const matchCaptainId = getMatchCaptainId();\n  assignment.forEach((a,i)=>{\n    const c = coords[i];\n    const p = a.player;\n    let icons = '';\n    if(goalsBy[p.id]) icons += '⚽'.repeat(Math.min(goalsBy[p.id],4));\n    if(assistsBy[p.id]) icons += '👟'.repeat(Math.min(assistsBy[p.id],4));\n    if(faultBy[p.id]) icons += '⚠️'.repeat(Math.min(faultBy[p.id],4)); const colors = pitchDotColors(p.mainPos[0]);\n    const isCaptain = p.id===matchCaptainId;\n    html+=`<div class=\"pdot us\" style=\"left:${c.x}%;top:${c.y}%;\"><div class=\"circ\" style=\"background:${colors.bg};color:${colors.fg};\">${p.number||'–'}${isCaptain?'<span title=\"Capitaine du match\" style=\"position:absolute;top:-6px;right:-6px;font-size:12px;\">🎖️<\/span>':''}<\/div><div class=\"lbl\">${p.name.split(' ').slice(-1)[0]}<\/div>${icons?`<div class=\"picons\">${icons}<\/div>`:''}<\/div>`;\n  });\n  html+='<\/div>';\n  document.getElementById(targetId||'pitchContainer').innerHTML = html;\n}\n\/* Écran de célébration de but : nom du buteur\/passeur + trajectoire 2D animée (passe → tir → filet) *\/\nfunction playGoalAnimation(scorer, assistPlayer, hadDribble, goalType, crossSide, bonusADN, bonusPlayerId, isConceded){ const overlay = document.getElementById('goalOverlay'); const tagEl = document.getElementById('goalTag'); tagEl.textContent = isConceded ? 'BUT ENCAISSÉ' : 'BUT !'; tagEl.classList.toggle('conceded', !!isConceded); if(isConceded){ if(scorer){ const scorerMeta = nationFlag(scorer.nat)+' '+scorer.nat+' · '+displayPosLabel(scorer.mainPos[0])+' · #'+(scorer.number||'-'); document.getElementById('goalScorerName').innerHTML = `⚠️ But encaissé<span class=\"goal-subtitle\">Erreur de ${scorer.name}.<\/span><span class=\"goal-meta\">${scorerMeta}<\/span>`; } else { document.getElementById('goalScorerName').innerHTML = `⚠️ But encaissé<span class=\"goal-subtitle\">Aucune erreur individuelle identifiée.<\/span>`; } } else if(scorer){ const scorerMeta = nationFlag(scorer.nat)+' '+scorer.nat+' · '+displayPosLabel(scorer.mainPos[0])+' · #'+(scorer.number||'-'); document.getElementById('goalScorerName').innerHTML = `⚽ ${scorer.name}<span class=\"goal-meta\">${scorerMeta}<\/span>`; } const typeLabels = { penalty:'Penalty !', corner:'Sur corner', centre:'Sur centre', long_ball:'Sur une longue balle', open_play:null }; const typeLabel = typeLabels[goalType||'open_play']; if(isConceded){ document.getElementById('goalAssistName').innerHTML = ''; } else if(assistPlayer){ const assistMeta = nationFlag(assistPlayer.nat)+' '+assistPlayer.nat+' · '+displayPosLabel(assistPlayer.mainPos[0])+' · #'+(assistPlayer.number||'-'); document.getElementById('goalAssistName').innerHTML = `<div class=\"goal-assist-player\"><b>Passe décisive : ${assistPlayer.name}${typeLabel?' ('+typeLabel+')':''}<\/b><span class=\"goal-meta-sm\">${assistMeta}<\/span><\/div>`; } else { document.getElementById('goalAssistName').textContent = typeLabel || 'But en solitaire'; } const adnLineEl = document.getElementById('goalAdnLine'); if(bonusADN && bonusPlayerId){ const bp = players.find(pl=>pl.id===bonusPlayerId); adnLineEl.textContent = (bp && knownADN(bp).includes(bonusADN)) ? ('🧬 ADN de '+bp.name+' : '+bonusADN) : ''; } else { adnLineEl.textContent = ''; } const ball = document.getElementById('goalBall');\n\n  \/\/ Le style de jeu du coach influence la longueur\/verticalité des passes en jeu ouvert :\n  \/\/ Direct (A) : passes longues et verticales. Placé (C) : passes courtes, proches de la surface.\n  const approach = (state.currentStyle && state.currentStyle[1]) || 'B';\n\n  let waypoints = [];\n  const sideX = crossSide==='right' ? 88 : 12; \/\/ centre\/corner : le joueur centre bien de son côté réel du terrain\n\n  if(goalType==='penalty'){\n    waypoints = [{x:50,y:20},{x:50,y:6}];\n  } else if(goalType==='corner'){\n    waypoints = [{x:sideX,y:3},{x:50,y:20},{x:50,y:6}];\n  } else if(goalType==='centre'){\n    waypoints = [{x:sideX,y:34},{x:50,y:20},{x:50,y:6}];\n  } else if(goalType==='long_ball'){\n    waypoints = [{x:46,y:84},{x:54,y:22},{x:50,y:6}];\n  } else {\n    \/\/ Jeu ouvert : passe → conduite de balle (si présente) → frappe, module par le style\n    if(approach==='A'){       \/\/ direct : passe longue et verticale\n      if(assistPlayer) waypoints.push({x:50, y:86});\n      waypoints.push({x:52, y:30});\n      if(hadDribble) waypoints.push({x:50, y:20});\n    } else if(approach==='C'){ \/\/ placé : passes courtes, proches\/dans la surface\n      if(assistPlayer) waypoints.push({x:38, y:38});\n      waypoints.push({x:52, y:26});\n      if(hadDribble) waypoints.push({x:50, y:18});\n    } else {                   \/\/ équilibré\n      if(assistPlayer) waypoints.push({x:25, y:74});\n      waypoints.push({x:56, y:34});\n      if(hadDribble) waypoints.push({x:50, y:22});\n    }\n    waypoints.push({x:50, y:6}); \/\/ frappe, toujours proche du but pour plus de réalisme\n  }\n\n  ball.style.transition = 'none';\n  ball.style.left = waypoints[0].x+'%';\n  ball.style.top = waypoints[0].y+'%';\n  overlay.classList.add('show');\n  void ball.offsetWidth; \/\/ force le recalcul de style avant de ré-activer la transition\n  const stepMs = 560;\n  ball.style.transition = `left ${stepMs}ms cubic-bezier(.3,.6,.3,1), top ${stepMs}ms cubic-bezier(.3,.6,.3,1)`;\n  for(let i=1;i<waypoints.length;i++){\n    setTimeout(()=>{ ball.style.left=waypoints[i].x+'%'; ball.style.top=waypoints[i].y+'%'; }, 60 + (i-1)*stepMs);\n  }\n  setTimeout(()=>{ overlay.classList.remove('show'); }, 3000);\n}\n\nfunction startMatch(instant){\n  const pending = getPendingFixturesThisWeek();\n  if(!pending.length) return;\n  const current = pending[0];\n  const fx = current.fx;\n  const gen = generateMatchEvents(fx);\n  const isCup = current.type==='cup';\n  const isEuro = current.type==='euro';\n  matchState = {...gen, i:0, minute:0, homeGoals:0, awayGoals:0, timer:null, instant:!!instant, isCup, isEuro};\n  document.getElementById('preMatchPanel').style.display='none';\n  document.getElementById('liveMatchPanel').style.display='block';\n  updateMatchActionBar();\n  document.getElementById('liveHomeName').textContent = matchState.homeName;\n  document.getElementById('liveAwayName').textContent = matchState.awayName;\n  document.getElementById('liveAwayCrest').textContent = clubCode(matchState.opponent);\n  document.getElementById('matchTicker').innerHTML='';\n  renderPitchForMatch();\n  updateScoreboard();\n  if(instant){ fastForward(); } else { tickMatch(); }\n}\nfunction tickMatch(){\n  matchState.timer = setInterval(()=>{\n    matchState.minute++;\n    while(matchState.i<matchState.events.length && matchState.events[matchState.i].minute<=matchState.minute){\n      const ev = matchState.events[matchState.i];\n      matchState.i++;\n      logEvent(ev);\n      if(matchState.paused) break; \/\/ une célébration de but a mis le direct en pause : on reprendra ensuite\n    }\n    document.getElementById('liveMinute').textContent = Math.min(matchState.minute,90);\n    if(!matchState.paused && matchState.minute>=90){ clearInterval(matchState.timer); endMatch(); }\n  },130);\n}\nfunction fastForward(){\n  if(matchState.timer) clearInterval(matchState.timer);\n  while(matchState.i<matchState.events.length){\n    const ev = matchState.events[matchState.i];\n    matchState.i++;\n    logEvent(ev);\n  }\n  matchState.minute=90;\n  document.getElementById('liveMinute').textContent='90';\n  endMatch();\n}\nfunction logEvent(e){ if(e.type==='goal'){ if(e.side==='home') matchState.homeGoals++; else matchState.awayGoals++; const isUs = (e.side==='home' && matchState.isHome) || (e.side==='away' && !matchState.isHome); const el=document.createElement('div'); el.className='tick-item'+(isUs?' goal-us':''); el.textContent = isUs ? `⚽ ${e.minute}' BUT ! ${e.scorerName} inscrit pour ${CLUB_NAME} !` : `⚽ ${e.minute}' But encaissé face à ${matchState.opponent}.`; document.getElementById('matchTicker').appendChild(el); renderPitchForMatch(); updateScoreboard(); if(!matchState.instant){ if(isUs && e.scorerId){ const scorer = players.find(p=>p.id===e.scorerId); const assistP = e.assistId ? players.find(p=>p.id===e.assistId) : null; if(scorer){ if(matchState.timer){ clearInterval(matchState.timer); matchState.timer=null; } matchState.paused = true; playGoalAnimation(scorer, assistP, e.hadDribble, e.goalType, e.crossSide, e.bonusADN, e.bonusPlayerId, false); setTimeout(()=>{ matchState.paused = false; if(!matchState.instant){ if(matchState.minute>=90) endMatch(); else tickMatch(); } }, 3000); return; } } else if(!isUs){ const faultId = e.bonusPlayerId || e.faultPlayerId; const faultP = faultId ? players.find(p=>p.id===faultId) : null; if(matchState.timer){ clearInterval(matchState.timer); matchState.timer=null; } matchState.paused = true; playGoalAnimation(faultP, null, false, null, null, e.bonusADN, e.bonusPlayerId, true); setTimeout(()=>{ matchState.paused = false; if(!matchState.instant){ if(matchState.minute>=90) endMatch(); else tickMatch(); } }, 3000); return; } } } else { const el=document.createElement('div'); el.className='tick-item card-item';\n    const label = e.type==='red' ? '🟥 Carton rouge' : '🟨 Carton jaune';\n    let cardTxt = e.scorerName ? `${label} ${e.minute}' — ${e.scorerName}` : `${label} ${e.minute}' (${matchState.opponent})`; if(e.bonusADN && e.scorerId){ const cvp = players.find(pl=>pl.id===e.scorerId); if(cvp && knownADN(cvp).includes(e.bonusADN)) cardTxt += ' · 🧬 ADN: '+e.bonusADN; } el.textContent = cardTxt;\n    document.getElementById('matchTicker').appendChild(el);\n  }\n  updateScoreboard();\n}\nfunction updateScoreboard(){\n  document.getElementById('liveHomeGoals').textContent = matchState.homeGoals;\n  document.getElementById('liveAwayGoals').textContent = matchState.awayGoals;\n}\n\nfunction applyResult(teamA, teamB, goalsA, goalsB){\n  const sa=standings[teamA], sb=standings[teamB];\n  sa.j++; sb.j++; sa.bp+=goalsA; sa.bc+=goalsB; sb.bp+=goalsB; sb.bc+=goalsA;\n  if(goalsA>goalsB){ sa.g++; sa.pts+=3; sb.p++; }\n  else if(goalsA<goalsB){ sb.g++; sb.pts+=3; sa.p++; }\n  else { sa.n++; sb.n++; sa.pts+=1; sb.pts+=1; }\n}\nfunction simulateOtherMatchdayGames(){\n  const idx = weekMatchIndex(state.week);\n  const round = (idx!==null ? SCHEDULE[idx] : null) || [];\n  round.forEach(pair=>{\n    if(pair.includes(CLUB_NAME)) return;\n    const [home,away] = pair;\n    const hs=(CLUB_STRENGTH[home]||70)+3, as=(CLUB_STRENGTH[away]||70);\n    const he=clamp(1.3+(hs-as)\/14,0.1,4.5), ae=clamp(1.0+(as-hs)\/17,0.1,4.5);\n    applyResult(home, away, poissonRandom(he), poissonRandom(ae));\n  });\n}\n\/* D10 : chaque ADN caché non révélé a 10% de chance de se révéler au cours de la saison —\n   réparti semaine par semaine (peut arriver n'importe quand), plutôt qu'en un seul tirage\n   groupé en fin de saison. Probabilité hebdomadaire p telle que (1-p)^52 ≈ 0,90. *\/\nconst WEEKLY_ADN_REVEAL_CHANCE = 1 - Math.pow(0.9, 1\/WEEKS_TOTAL);\nfunction checkWeeklyADNReveals(startDelayMs){\n  startDelayMs = startDelayMs || 0;\n  const reveals = [];\n  players.forEach(p=>{\n    p.adnHidden.forEach(h=>{\n      if(!h.revealed && Math.random() < WEEKLY_ADN_REVEAL_CHANCE){\n        h.revealed = true;\n        reveals.push({player:p, trait:h.name});\n      }\n    });\n  });\n  if(reveals.length){\n    reveals.forEach((r,i)=>{\n      setTimeout(()=>{\n        toastPlayer(`ADN révélé : est « ${r.trait} » !`, r.player, '🧬');\n      }, startDelayMs + i*3200);\n    });\n    renderEffectif(); renderComposition(); renderCoachTab();\n  }\n  return reveals.length;\n}\n\nfunction announceMercatoTransition(wasOpen, nowOpen){\n  if(wasOpen===nowOpen) return;\n  toast(nowOpen ? '🟢 Mercato ouvert' : '🔴 Mercato fermé');\n}\n\/* ============================================================\n   CÉRÉMONIE DE FIN DE SAISON\n   ============================================================ *\/\n\/* Calcule les récompenses de la saison écoulée, à partir des stats de saison (seasonNoteSum\/\n   seasonNoteCount, remises à zéro seulement à la vraie bascule de saison en semaine 52) —\n   donc toujours disponibles juste après le dernier match de championnat. *\/\nfunction computeSeasonAwards(){\n  const withNote = (list) => list.map(p=>({p, note: p.seasonNoteCount ? p.seasonNoteSum\/p.seasonNoteCount : 0})).sort((a,b)=>b.note-a.note);\n  const qualified = players.filter(p=>p.seasonNoteCount>=3);\n  const pool = qualified.length ? qualified : players;\n  const ranked = withNote(pool);\n\n  const bestPlayer = ranked[0] || null;\n\n  const youngQualified = qualified.filter(p=>p.age<=21);\n  const youngPool = youngQualified.length ? youngQualified : players.filter(p=>p.age<=21);\n  const bestYoung = withNote(youngPool)[0] || null;\n\n  \/\/ Top 5 des meilleurs joueurs de la saison — formule cachée, jamais montrée au DS :\n  \/\/ note moyenne au carré x nombre de matchs joués (récompense la régularité ET la performance).\n  const scored = players.filter(p=>p.seasonNoteCount>0).map(p=>{\n    const note = p.seasonNoteSum\/p.seasonNoteCount;\n    return { p, note, matches: p.stats.m, hiddenScore: note*note*p.stats.m };\n  }).sort((a,b)=>b.hiddenScore-a.hiddenScore);\n  const top5Players = scored.slice(0,5);\n\n  \/\/ Plus grande progression : niveau actuel vs niveau au début de la saison\n  const progressed = players.map(p=>({p, gain: p.level-(p.levelAtSeasonStart!==undefined?p.levelAtSeasonStart:p.level)})).sort((a,b)=>b.gain-a.gain);\n  const bestProgression = progressed[0] || null;\n\n  \/\/ Bilan de l'équipe dans chaque compétition disputée cette saison.\n  const ranking = getFinalStandingsRanking();\n  const ourRank = ranking.findIndex(t=>t.name===CLUB_NAME)+1;\n  const ord = ourRank===1 ? 'er' : 'ème';\n  const leagueSummary = `${ourRank}${ord} de ${DIVISION_NAMES[state.division]} (${standings[CLUB_NAME].pts} pts)`;\n\n  let cupSummary;\n  if(state.cup.wonTrophy) cupSummary = 'Vainqueur de la Coupe de France 🏆';\n  else if(state.cup.bestRoundReached>=0) cupSummary = `Éliminé en ${CUP_ROUND_NAMES[Math.min(state.cup.bestRoundReached+1, CUP_ROUND_NAMES.length-1)]}`;\n  else cupSummary = 'Éliminé au premier tour de Coupe de France';\n\n  let euroSummary = 'Non qualifié pour une coupe d\\'Europe';\n  if(state.euro){\n    const compLabel = state.euro.competition==='UCL' ? 'Ligue des Champions' : 'Ligue Europa';\n    if(state.euro.wonTrophy) euroSummary = `Vainqueur de la ${compLabel} 🏆`;\n    else if(state.euro.eliminated && state.euro.knockoutRoundIndex>=0) euroSummary = `Éliminé en ${EURO_KNOCKOUT_NAMES[state.euro.knockoutRoundIndex]} de ${compLabel}`;\n    else if(!state.euro.qualifiedForKnockout) euroSummary = `Éliminé en phase de ligue de ${compLabel}`;\n    else euroSummary = `Qualifié pour les phases finales de ${compLabel}`;\n  }\n\n  return { bestPlayer, bestYoung, top5Players, bestProgression, leagueSummary, cupSummary, euroSummary };\n}\nfunction showSeasonCeremony(){\n  const awards = computeSeasonAwards();\n  const overlay = document.getElementById('ceremonyOverlay');\n  const container = document.getElementById('ceremonyAwards');\n  if(!overlay || !container) return;\n  setText('ceremonySeasonLabel', `Bilan de la saison ${state.season||1} — ${DIVISION_NAMES[state.division]}`);\n  let html = ''; let delay = 0;\n  const addAward = (medal, label, name, detail) => {\n    html += `<div class=\"ceremony-award\" style=\"animation-delay:${delay}s;\">\n      <div class=\"medal\">${medal}<\/div>\n      <div><div class=\"label\">${label}<\/div><div class=\"name\">${name}<\/div>${detail?`<div class=\"detail\">${detail}<\/div>`:''}<\/div>\n    <\/div>`;\n    delay += 0.15;\n  };\n  addAward('🏆', 'Bilan de la saison', `Championnat : ${awards.leagueSummary}`, `Coupe de France : ${awards.cupSummary}<br>Coupe d'Europe : ${awards.euroSummary}`);\n  if(awards.bestPlayer) addAward('🥇', 'Meilleur joueur du club', awards.bestPlayer.p.name, `Note moyenne : ${awards.bestPlayer.note.toFixed(2)} \/ 10`);\n  if(awards.bestYoung) addAward('🌟', 'Meilleur jeune', awards.bestYoung.p.name, `${awards.bestYoung.p.age} ans — Note moyenne : ${awards.bestYoung.note.toFixed(2)} \/ 10`);\n  if(awards.bestProgression && awards.bestProgression.gain>0) addAward('📈', 'Plus grande progression', awards.bestProgression.p.name, `+${awards.bestProgression.gain} de niveau cette saison`);\n  if(awards.top5Players.length){\n    const list = awards.top5Players.map((t,i)=>`${i+1}. ${t.p.name} (${t.note.toFixed(2)}\/10, ${t.matches} matchs)`).join('<br>');\n    addAward('🏅', 'Top 5 des joueurs de la saison', list);\n  }\n  container.innerHTML = html || '<p class=\"hint\">Pas assez de matchs joués cette saison pour établir un bilan.<\/p>';\n  overlay.classList.add('show');\n}\nfunction closeCeremony(){\n  const overlay = document.getElementById('ceremonyOverlay');\n  if(overlay) overlay.classList.remove('show');\n}\nfunction endMatch(){\n  clearAllDesktopToasts(); \/\/ les notifications empilées s'effacent au changement de semaine (PC)\n  const startersWhoPlayed = players.filter(p=>p.starter);\n  const ourGoals = matchState.isHome ? matchState.homeGoals : matchState.awayGoals;\n  const oppGoals = matchState.isHome ? matchState.awayGoals : matchState.homeGoals;\n  if(matchState.isCup){\n    resolveCupRound(ourGoals, oppGoals); \/\/ pas de classement ni de calendrier des autres clubs pour un match de coupe\n  } else if(matchState.isEuro){\n    resolveEuroMatch(ourGoals, oppGoals); \/\/ pas de classement ni de calendrier des autres clubs pour un match européen\n  } else {\n    if(matchState.isHome) applyResult(CLUB_NAME, matchState.opponent, ourGoals, oppGoals);\n    else applyResult(matchState.opponent, CLUB_NAME, oppGoals, ourGoals);\n    simulateOtherMatchdayGames();\n    state.recentForm.push(ourGoals>oppGoals?'V':ourGoals<oppGoals?'D':'N');\n    if(state.recentForm.length>5) state.recentForm.shift();\n  }\n\n  \/\/ stats joueurs\n  players.filter(p=>p.starter).forEach(p=>{\n    p.stats.m++;\n    \/\/ Note de match réaliste : base à 6, ajustée par la contribution individuelle et le\n    \/\/ résultat collectif, avec une variance nettement plus large qu'avant pour bien distinguer\n    \/\/ une bonne d'une mauvaise performance. Toujours arrondie à une décimale (jamais au centième).\n    let rating = 6.0;\n    if(ourGoals>oppGoals) rating += 0.4;\n    else if(ourGoals<oppGoals) rating -= 0.4;\n    const goalsThisMatch = matchState.events.filter(e=>e.type==='goal'&&e.scorerId===p.id).length;\n    const assistsThisMatch = matchState.events.filter(e=>e.type==='goal'&&e.assistId===p.id).length;\n    rating += goalsThisMatch*1.2 + assistsThisMatch*0.6;\n    if(matchState.events.some(e=>e.type==='yellow'&&e.scorerId===p.id)) rating -= 0.3;\n    if(matchState.events.some(e=>e.type==='red'&&e.scorerId===p.id)) rating -= 2.0; if(matchState.events.some(e=>e.type==='goal'&&e.faultPlayerId===p.id)) rating -= 1.0;\n    const isDefensivePos = p.mainPos.includes('GB') || p.mainPos.some(pos=>['DD','DC','DG'].includes(pos));\n    if(isDefensivePos && oppGoals===0) rating += 0.8;\n    rating += (Math.random()*3.4 - 1.7); \/\/ variance individuelle large : -1,7 à +1,7\n    rating = Math.round(clamp(rating, 1, 10)*10)\/10;\n    p.stats.noteSum += rating; p.stats.noteCount++;\n    p.seasonNoteSum = (p.seasonNoteSum||0) + rating; p.seasonNoteCount = (p.seasonNoteCount||0) + 1;\n  });\n  updateFatigueAndForme(); \/\/ I5\/I6 : mis à jour une fois par match réellement joué\n  state.matchesThisWeekCount++;\n  if(state.matchesThisWeekCount>=2){\n    \/\/ 2ème match (ou plus) la même semaine : fatigue supplémentaire pour tout l'effectif,\n    \/\/ titulaires comme remplaçants — enchaîner les matchs épuise tout le monde.\n    players.forEach(p=>{ if(!p.mainPos.includes('GB')) p.fatigueMalus = Math.min(0, (p.fatigueMalus||0) - 1); });\n  }\n  matchState.events.forEach(e=>{\n    if(e.type==='goal' && e.scorerId){ const p=players.find(x=>x.id===e.scorerId); if(p) p.stats.g++; }\n    if(e.type==='goal' && e.assistId){ const ap=players.find(x=>x.id===e.assistId); if(ap) ap.stats.a++; }\n    if(e.type==='yellow' && e.scorerId){ const p=players.find(x=>x.id===e.scorerId); if(p) p.stats.jc++; }\n    if(e.type==='red' && e.scorerId){ const p=players.find(x=>x.id===e.scorerId); if(p) p.stats.rc++; } if(e.type==='goal' && e.faultPlayerId){ const fp=players.find(x=>x.id===e.faultPlayerId); if(fp) fp.stats.e++; }\n  });\n  if(oppGoals===0){ const gb=players.find(p=>p.starter && p.mainPos.includes('GB')); if(gb) gb.stats.cs++; }\n\n  \/\/ Cérémonie de fin de saison : juste après le dernier match de championnat (34e journée)\n  if(!matchState.isCup && standings[CLUB_NAME].j>=SCHEDULE.length && !state.ceremonyShownThisSeason){\n    state.ceremonyShownThisSeason = true;\n    showSeasonCeremony();\n  }\n\n  \/\/ D8 - Résultats du club : indice de favoritisme F et Note du Match\n  const F = clamp((matchState.usStrength - matchState.oppStrength)\/20, -1, 1);\n  let noteM;\n  if(ourGoals>oppGoals) noteM = 85 - 15*F;\n  else if(ourGoals===oppGoals) noteM = 50 - 25*F;\n  else noteM = 15 - 15*F;\n  state.matchNotesHistory.push(clamp(noteM,0,100));\n  if(state.matchNotesHistory.length>5) state.matchNotesHistory.shift();\n\n  state.supporterSatisfaction = clamp(state.supporterSatisfaction + (ourGoals>oppGoals?3:ourGoals<oppGoals?-2:0), 0, 100);\n  players.forEach(p=>{ p.moral = computeSatisfaction(p); });\n\n  const remainingThisWeek = getPendingFixturesThisWeek();\n  if(remainingThisWeek.length===0){\n    state.matchesThisWeekCount = 0; \/\/ remise à zéro pour la nouvelle semaine\n    const wasOpen = isMercatoOpen();\n    state.week = Math.min(state.week+1, WEEKS_TOTAL);\n    const nowOpen = isMercatoOpen();\n    processCupRound(); \/\/ Coupe de France : tire l'adversaire du tour si applicable cette semaine\n    processEuroWeek(); \/\/ Coupes europeennes : tire l'adversaire du prochain match si applicable\n    generateWeeklyScouts(); \/\/ A1 : nouvelles cibles de scoutisme pour la semaine\n    checkWeeklyADNReveals(600);\n    processWeeklyForm(); \/\/ I - Forme : fait progresser les malus I1\/I3\n    processWeeklyUnusedSalary(); \/\/ cumule la marge salariale non utilisée pour le budget transfert de fin de saison\n    applyScheduledProgression(); \/\/ applique les points de progression (D3\/D4) tombant sur cette semaine\n    processWeeklyInjuries(startersWhoPlayed); \/\/ H1 : risque entraînement (tous) + risque match (titulaires)\n    processWeeklyCoachRelations(); \/\/ E10 : 1% de chance par joueur de faire évoluer sa relation au coach\n    processWeeklyVieProScore(); \/\/ D8 : vie perso, 1% de chance par joueur de varier de ±10\n    expireReceivedOffers(); \/\/ 50% de chance chaque semaine qu une offre en attente disparaisse\n    checkContractDepartureAlerts(); checkRetirementAlerts(); \/\/ alerte 4 semaines avant un depart en fin de contrat\n    checkCaptainStillHere(); \/\/ redessine le capitanat si le capitaine ou le vice a quitte le club\n    generateWeeklyReceivedOffers(); \/\/ Offres reçues sur les joueurs listés par le DS\n    processLoanOptions(); \/\/ Résolution des options d'achat arrivant à échéance (prêts avec OA)\n    processLoanReturns(); \/\/ Fin de prêt sec apres 52 semaines pleines, independamment des bascules de saison\n    announceMercatoTransition(wasOpen, nowOpen);\n  } else {\n    \/\/ Plusieurs matchs cette semaine (championnat + coupe et\/ou Europe) : on enchaîne directement\n    \/\/ sur le suivant, sans avancer la semaine ni déclencher le traitement hebdomadaire.\n    const nextType = remainingThisWeek[0].type;\n    const label = nextType==='cup' ? 'Coupe de France' : nextType==='euro' ? (state.euro.competition==='UCL'?'Ligue des Champions':'Ligue Europa') : 'Championnat';\n    toast(`📅 Un autre match vous attend cette semaine (${label}) — passez à la semaine pour l'enchaîner.`);\n  }\n  renderClassement(); renderDashboard(); renderDashboardR(); renderEffectif(); renderComposition(); renderCoachTab(); renderRecrutHeader();\n  showSummary(ourGoals, oppGoals);\n  autoSaveGame();\n}\n\/* Semaine sans match (mercato \/ repos) : on avance simplement d'une semaine.\n   À la semaine 52, la saison s'enchaîne automatiquement (plus de bouton dédié). *\/\nfunction advanceWeek(){\n  clearAllDesktopToasts(); \/\/ les notifications empilées s'effacent au changement de semaine (PC)\n  if(state.week>=WEEKS_TOTAL){ simulerSaison(); return; }\n  state.matchesThisWeekCount = 0; \/\/ remise à zéro pour la nouvelle semaine\n  \/\/ Aucun match cette semaine : tout l'effectif récupère de la fatigue.\n  players.forEach(p=>{ if(!p.mainPos.includes('GB')) p.fatigueMalus = Math.min(0, (p.fatigueMalus||0) + 5); });\n  const wasOpen = isMercatoOpen();\n  state.week++;\n  const nowOpen = isMercatoOpen();\n  processCupRound(); \/\/ Coupe de France : tire l'adversaire du tour si applicable cette semaine\n  processEuroWeek(); \/\/ Coupes europeennes : tire l'adversaire du prochain match si applicable\n  generateWeeklyScouts();\n  checkWeeklyADNReveals(1500);\n  processWeeklyForm(); \/\/ I - Forme : fait progresser les malus I1\/I3\n  processWeeklyUnusedSalary(); \/\/ cumule la marge salariale non utilisée pour le budget transfert de fin de saison\n  applyScheduledProgression(); \/\/ applique les points de progression (D3\/D4) tombant sur cette semaine\n  processWeeklyInjuries(null); \/\/ H1 : risque entraînement uniquement, pas de match cette semaine\n  processWeeklyCoachRelations(); \/\/ E10 : 1% de chance par joueur de faire évoluer sa relation au coach\n  processWeeklyVieProScore(); \/\/ D8 : vie perso, 1% de chance par joueur de varier de ±10\n  expireReceivedOffers(); \/\/ 50% de chance chaque semaine qu une offre en attente disparaisse\n    checkContractDepartureAlerts(); checkRetirementAlerts(); \/\/ alerte 4 semaines avant un depart en fin de contrat\n    checkCaptainStillHere(); \/\/ redessine le capitanat si le capitaine ou le vice a quitte le club\n    generateWeeklyReceivedOffers(); \/\/ Offres reçues sur les joueurs listés par le DS\n  processLoanOptions(); \/\/ Résolution des options d'achat arrivant à échéance (prêts avec OA)\n    processLoanReturns(); \/\/ Fin de prêt sec apres 52 semaines pleines, independamment des bascules de saison\n  renderEffectif(); renderComposition(); renderCoachTab();\n  renderDashboard(); renderDashboardR(); renderRecrutHeader(); renderPreMatch();\n  announceMercatoTransition(wasOpen, nowOpen);\n  autoSaveGame();\n}\n\/* Bouton global \"Passer à la semaine suivante\", accessible depuis n'importe quel onglet.\n   S'il y a un match cette semaine, on l'affiche (résultat instantané) sur l'onglet Match ;\n   sinon on avance simplement d'une semaine sans quitter la page actuelle. *\/\nfunction goToNextWeek(){ if(typeof matchState!=='undefined' && matchState && matchState.events && matchState.i < matchState.events.length){ if(matchState.timer){ clearInterval(matchState.timer); matchState.timer=null; } matchState.paused = false; fastForward(); advanceWeek(); return; } const fx = getUserFixture(); if(fx){ document.querySelectorAll('.navlist button').forEach(b=>b.classList.remove('active')); const matchBtn = document.querySelector('.navlist button[data-view=\"match\"]'); if(matchBtn) matchBtn.classList.add('active'); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById('match').classList.add('active'); renderPreMatch(); startMatch(true); } else { advanceWeek(); } } function showSummary(ourGoals, oppGoals){\n  document.getElementById('liveMatchPanel').style.display='none';\n  document.getElementById('summaryPanel').style.display='block';\n  updateMatchActionBar();\n  const resultClass = ourGoals>oppGoals?'win':ourGoals<oppGoals?'loss':'draw';\n  const resultLabel = ourGoals>oppGoals?'Victoire 🎉':ourGoals<oppGoals?'Défaite':'Match nul';\n  \/\/ Domicile toujours à gauche, extérieur toujours à droite (cohérent avec le pré-match et le\n  \/\/ match en direct) — notre équipe se retrouve donc à droite quand nous jouons à l'extérieur.\n  const leftCrestClass = matchState.isHome ? 'us' : 'opp';\n  const rightCrestClass = matchState.isHome ? 'opp' : 'us';\n  document.getElementById('summaryScoreLine').innerHTML = `\n    <div class=\"match-team\"><div class=\"match-crest ${leftCrestClass}\">${clubCode(matchState.homeName)}<\/div><div><b>${matchState.homeName}<\/b><\/div><\/div>\n    <div style=\"text-align:center;\">\n      <div class=\"scoreboard\"><span class=\"digit\">${matchState.homeGoals}<\/span><span class=\"sep\">:<\/span><span class=\"digit\">${matchState.awayGoals}<\/span><\/div>\n      <div class=\"result-pill ${resultClass}\">${resultLabel}<\/div>\n    <\/div>\n    <div class=\"match-team right\"><div class=\"match-crest ${rightCrestClass}\">${clubCode(matchState.awayName)}<\/div><div><b>${matchState.awayName}<\/b><\/div><\/div>`;\n  const goalsWrap = document.getElementById('summaryGoals'); goalsWrap.innerHTML='';\n  const goalEvents = matchState.events.filter(e=>e.type==='goal');\n  if(goalEvents.length===0){ goalsWrap.innerHTML = '<p class=\"hint\">Aucun but marqué dans cette rencontre.<\/p>'; }\n  goalEvents.forEach((e,idx)=>{\n    const isUs = (e.side==='home' && matchState.isHome) || (e.side==='away' && !matchState.isHome);\n    const row=document.createElement('div'); row.className='summary-goal';\n    if(isUs && e.scorerId){\n      row.style.cursor='pointer';\n      row.title='Revoir l\\'animation';\n      row.onclick=()=>replayGoal(idx);\n      row.innerHTML = `<span>${e.minute}'<\/span><span>⚽ ${e.scorerName} — ${CLUB_NAME}${e.assistName?` <span class=\"hint\">(passe : ${e.assistName})<\/span>`:''} <span class=\"hint\">↻<\/span><\/span>`;\n    } else {\n      row.innerHTML = `<span>${e.minute}'<\/span><span>${isUs? (e.scorerName+' — '+CLUB_NAME) : ('But — '+matchState.opponent)}<\/span>`;\n    }\n    goalsWrap.appendChild(row);\n  });\n  \/\/ Terrain \/ composition finale, comme pendant le match\n  renderPitchForMatch('summaryPitchContainer');\n}\n\/* Revoit l'animation d'un but déjà marqué, à partir de son index dans les buts du match *\/\nfunction replayGoal(goalIndex){\n  const goalEvents = matchState.events.filter(e=>e.type==='goal');\n  const e = goalEvents[goalIndex];\n  if(!e || !e.scorerId) return;\n  const scorer = players.find(p=>p.id===e.scorerId);\n  const assistP = e.assistId ? players.find(p=>p.id===e.assistId) : null;\n  if(scorer) playGoalAnimation(scorer, assistP, e.hadDribble, e.goalType, e.crossSide, e.bonusADN, e.bonusPlayerId);\n}\nfunction closeSummary(){\n  document.getElementById('summaryPanel').style.display='none';\n  renderPreMatch();\n}\n\n\/* ============================================================\n   MATRICE TACTIQUE\n   ============================================================ *\/\nfunction renderCoachTab(){\n  \/\/ Identité\n  document.getElementById('coachAvatar').textContent = initials(coach.name);\n  document.getElementById('coachName').textContent = coach.name;\n  document.getElementById('coachIdSub').textContent = `${coach.age} ans · ${coach.nat}`;\n\n  \/\/ Contrat\n  document.getElementById('coachSalary').textContent = formatSalaryK(coach.salary)+' \/ mois';\n  document.getElementById('coachContractEnd').textContent = `Juin ${2025+state.season+coach.contractYears}`;\n\n  \/\/ E8 : satisfaction du coach + détail de la formule\n  const cb = computeCoachSatisfactionBreakdown();\n  const support = computeCoachSatisfaction();\n  document.getElementById('coachRelResults').textContent = Math.round(cb.noteResultats)+' \/ 100';\n  document.getElementById('coachRelPlayers').textContent = Math.round(cb.noteJoueurs)+' \/ 100';\n  document.getElementById('coachRelSalary').textContent = Math.round(cb.noteSalaire)+' \/ 100';\n  document.getElementById('coachRelDS').textContent = coach.relationDS+' \/ 100';\n  document.getElementById('coachRelPres').textContent = coach.relationPresident+' \/ 100';\n  document.getElementById('coachRelVie').textContent = Math.round(cb.noteVie)+' \/ 100';\n  document.getElementById('coachRelFans').textContent = state.supporterSatisfaction+' \/ 100';\n  document.getElementById('coachSupportBar').style.width = support+'%';\n  document.getElementById('coachSupportLabel').textContent = support+' \/ 100';\n  const supportText = support>=70 ? \"Le coach est pleinement satisfait de sa situation au club.\" : support>=45 ? \"La satisfaction reste correcte, mais une dégradation pourrait la fragiliser.\" : \"La satisfaction est fragile : résultats, salaire, relations ou vie perso posent problème.\";\n  document.getElementById('coachSupportText').textContent = supportText;\n\n  \/\/ Tactique + Style de jeu\n  refreshCoachSelections();\n  document.getElementById('coachPrimaryTactics').innerHTML = coach.primaryTactiques.map(t=>`<span class=\"chip selected\">${t}<\/span>`).join('') || '<span class=\"hint\">Aucune<\/span>';\n  document.getElementById('coachSecondaryTactics').innerHTML = coach.secondaryTactiques.map(t=>`<span class=\"chip\">${t}<\/span>`).join('') || '<span class=\"hint\">Aucune pour le moment.<\/span>';\n\n  document.getElementById('coachCurrentTactic').innerHTML = `\n    <h4>${state.currentTactiqueFamily} <span style=\"font-weight:500;\">${state.currentTactiqueVariant}<\/span><\/h4>\n    <p>Onze de départ actuel, ${state.currentTactiqueIsPrimary?'tactique principale du coach':'tactique secondaire du coach'}. <a href=\"#\" onclick=\"goToTab('composition');return false;\">Voir sur le terrain →<\/a><\/p>\n  `;\n\n  const s=STYLES[state.currentStyle];\n  document.getElementById('coachCurrentStyle').innerHTML = `\n    <h4>${s.title}<\/h4>\n    <p>${s.desc}<\/p>\n  `;\n\n  document.getElementById('coachAdnAffinity').innerHTML = coach.adnAffinity.map(a=>`<span class=\"badge\">${a}<\/span>`).join('');\n  document.getElementById('coachAdnIncompatibility').innerHTML = `<span class=\"badge incompat\">${coach.adnIncompatibility}<\/span>`;\n}\n\n\/* ============================================================\n   GLOSSAIRE ADN\n   ============================================================ *\/\nfunction renderGlossary(){\n  const wrap=document.getElementById('adnGlossary');\n  if(!wrap) return; \/\/ onglet Glossaire ADN retiré temporairement\n  wrap.innerHTML=\"\";\n  Object.entries(ADN_EFFECTS).forEach(([name,desc])=>{\n    const el=document.createElement('div'); el.className='adn-card';\n    el.innerHTML=`<h4>${name}<\/h4><p>${desc}<\/p>`;\n    wrap.appendChild(el);\n  });\n}\n\n\/* ============================================================\n   FIN DE SAISON\n   ============================================================ *\/\n\/* Progression du niveau des joueurs (D3\/D4) : de 16 à 30 ans, un joueur peut progresser de\n   +0 à +3 sur son niveau au cours de la saison, sans jamais dépasser son Vrai Potentiel\n   (valeur cachée, jamais affichée au joueur). Passé 30 ans, le niveau décline légèrement.\n   Chaque point de progression n'arrive pas d'un coup en fin de saison : il est réparti à un\n   moment aléatoire différent au cours des 52 semaines de l'année. *\/\n\/* ============================================================\n   S - CAPITANAT\n   ============================================================ *\/\n\/* Tickets = âge x nombre de matchs joués au club (p.stats.m). Tirage aléatoire pondéré parmi\n   ces tickets pour désigner un joueur (le capitaine, le vice-capitaine, ou tout autre rôle). *\/\nfunction weightedTicketDraw(pool){\n  if(!pool.length) return null;\n  const weightOf = p => Math.max(1, p.age * p.stats.m * p.level) * (actualADN(p).includes('Leader') ? 2 : 1); \/\/ au moins 1 ticket, meme a 0 match joue ; x2 pour Leader\n  const total = pool.reduce((s,p)=>s+weightOf(p), 0);\n  let r = Math.random()*total;\n  for(const p of pool){ r -= weightOf(p); if(r<=0) return p.id; }\n  return pool[pool.length-1].id;\n}\n\/* Tire un nouveau capitaine et un nouveau vice-capitaine (deux tickets distincts : le\n   vice-capitaine ne peut pas être le même joueur que le capitaine). *\/\nfunction drawNewCaptains(){\n  if(!players.length){ state.captainId=null; state.viceCaptainId=null; return; }\n  state.captainId = weightedTicketDraw(players);\n  const poolForVice = players.filter(p=>p.id!==state.captainId);\n  state.viceCaptainId = weightedTicketDraw(poolForVice.length ? poolForVice : players);\n}\n\/* S'assure qu'un capitaine et un vice-capitaine existent toujours dans l'effectif (redraw\n   obligatoire si l'un des deux a quitté le club), puis applique la rotation annuelle (1 chance\n   sur 10 pour chacun de changer). *\/\nfunction processSeasonCaptaincy(){\n  if(!state.captainId || !players.some(p=>p.id===state.captainId)){ drawNewCaptains(); return; }\n  if(!state.viceCaptainId || !players.some(p=>p.id===state.viceCaptainId)){\n    const poolForVice = players.filter(p=>p.id!==state.captainId);\n    state.viceCaptainId = weightedTicketDraw(poolForVice.length ? poolForVice : players);\n  }\n  if(Math.random()<0.10){ \/\/ rotation annuelle : 1 chance sur 10 pour le capitaine\n    state.captainId = weightedTicketDraw(players);\n  }\n  if(Math.random()<0.10){ \/\/ idem pour le vice-capitaine (peut retomber sur le même joueur, ou même sur le capitaine actuel)\n    const poolForVice = players.filter(p=>p.id!==state.captainId);\n    state.viceCaptainId = weightedTicketDraw(poolForVice.length ? poolForVice : players);\n  }\n}\n\/* Capitaine du match en cours (titulaire) : le capitaine s'il joue, sinon le vice-capitaine s'il\n   joue, sinon le joueur avec le plus de matchs joués au club parmi les titulaires (pour ce match\n   uniquement — ne change pas la désignation officielle). *\/\nfunction getMatchCaptainId(){\n  const starters = players.filter(p=>p.starter);\n  if(!starters.length) return null;\n  if(state.captainId && starters.some(p=>p.id===state.captainId)) return state.captainId;\n  if(state.viceCaptainId && starters.some(p=>p.id===state.viceCaptainId)) return state.viceCaptainId;\n  return starters.slice().sort((a,b)=>careerTotals(b).m-careerTotals(a).m)[0].id;\n}\n\/* Vérifie chaque semaine que le capitaine et le vice-capitaine sont toujours au club — un\n   transfert peut faire partir l'un des deux en cours de saison, pas seulement à la bascule de\n   saison. Un nouveau titulaire est alors tiré immédiatement. *\/\nfunction checkCaptainStillHere(){\n  if(!players.length) return;\n  if(!state.captainId || !players.some(p=>p.id===state.captainId)){\n    state.captainId = weightedTicketDraw(players);\n    const cap = players.find(p=>p.id===state.captainId);\n    if(cap){ let capMsg = `Nouveau capitaine du club, suite au départ du précédent.`; if(knownADN(cap).includes('Leader')) capMsg += ' 🧬 ADN de '+cap.name+' : Leader'; toastPlayer(capMsg, cap, '🎖️'); }\n  }\n  if(!state.viceCaptainId || !players.some(p=>p.id===state.viceCaptainId) || state.viceCaptainId===state.captainId){\n    const poolForVice = players.filter(p=>p.id!==state.captainId);\n    state.viceCaptainId = weightedTicketDraw(poolForVice.length ? poolForVice : players);\n  }\n}\n\/* Symbole de brassard pour le CAPITAINE DU MATCH (avec repli vice-capitaine \/ plus expérimenté) —\n   utilisé sur le terrain et le onze titulaire de la Composition, où un capitaine doit toujours\n   être visible même si le titulaire officiel est sur le banc. *\/\nfunction matchCaptainIconHTML(p){\n  if(getMatchCaptainId()===p.id) return ' <span title=\"Capitaine du match\" style=\"font-size:12px;\">🎖️<\/span>';\n  return '';\n}\nfunction scheduleSeasonProgression(p){\n  const isGrowth = p.age>=16 && p.age<=30;\n  let magnitude = isGrowth ? Math.floor(Math.random()*4) : Math.floor(Math.random()*3); \/\/ 0-3 en croissance, 0-2 en déclin\n  const direction = isGrowth ? 1 : -1;\n  if(direction>0 && players.some(m=>m.menteeId===p.id)) magnitude = Math.round(magnitude*1.5); \/\/ ADN Mentor (D10) : +50% de progression pour le mentoré\n  const weeksPool = [];\n  for(let w=1; w<=WEEKS_TOTAL; w++) weeksPool.push(w);\n  p.progressionWeeks = [];\n  for(let i=0; i<magnitude; i++){\n    const idx = Math.floor(Math.random()*weeksPool.length);\n    const week = weeksPool.splice(idx,1)[0];\n    p.progressionWeeks.push({week, direction});\n  }\n}\n\/* Applique, semaine par semaine, les points de progression tombant sur la semaine en cours. *\/\nfunction applyScheduledProgression(){ players.forEach(p=>{ if(!p.progressionWeeks || !p.progressionWeeks.length) return; p.progressionWeeks.filter(e=>e.week===state.week).forEach(e=>{ const before = p.level; if(e.direction>0) p.level = clamp(p.level+1, Math.min(28,p.truePot), p.truePot); else p.level = clamp(p.level-1, Math.min(25,p.truePot), p.truePot); if(p.level > before){ let msg = `Progresse et passe niveau ${p.level} !`; const mentor = players.find(m=>m.menteeId===p.id); if(mentor && knownADN(mentor).includes('Mentor')) msg += ` 🧬 ADN de ${mentor.name} : Mentor`; toastPlayer(msg, p, '📈'); } else if(p.level < before) toastPlayer(`Régresse et repasse niveau ${p.level}.`, p, '📉'); }); p.progressionWeeks = p.progressionWeeks.filter(e=>e.week!==state.week); });\n}\nfunction simulerSaison(){\n  state.season++;\n  \/\/ Le budget transfert n'augmente plus d'un montant fixe : il reçoit la part du salaire\n  \/\/ mensuel non utilisée sur l'année (12 mois cumulés), convertie de k€ en M€.\n  const salaryBonus = +(state.unusedSalaryAccum\/1000).toFixed(2);\n  state.transferBudget = +(state.transferBudget + salaryBonus).toFixed(2);\n  state.transferBudgetTotal = +(state.transferBudgetTotal + salaryBonus).toFixed(2);\n  if(salaryBonus>0) toast(`💰 ${formatValueM(salaryBonus)} de marge salariale non utilisée cette saison, ajoutés au budget transfert.`);\n  state.unusedSalaryAccum = 0; \/\/ remise à zéro pour la nouvelle saison\n  processSeasonCaptaincy(); \/\/ S - Capitanat : rotation annuelle (1 chance sur 10)\n  processAcademySeasonEnd(); \/\/ Centre de formation : vieillissement, décisions à 18 ans, renouvellement\n\n  \/\/ Vieillissement, planification de la progression lissée sur l'année, retraite (D2\/D3\/D4) —\n  \/\/ la révélation d'ADN (D10) est gérée semaine par semaine via checkWeeklyADNReveals().\n  const retirees = [];\n  players.forEach(p=>{\n    p.age++;\n    p.years=Math.max(0,p.years-1);\n    \/\/ D4 : une saison réussie fait gagner du Vrai Potentiel, selon la note moyenne de la saison écoulée\n    const seasonNote = p.seasonNoteCount ? p.seasonNoteSum\/p.seasonNoteCount : 0;\n    if(seasonNote>7.5) p.truePot = Math.min(p.pot, p.truePot+2);\n    else if(seasonNote>6.5) p.truePot = Math.min(p.pot, p.truePot+1);\n    p.seasonNoteSum = 0; p.seasonNoteCount = 0; \/\/ remise à zéro pour la nouvelle saison\n    p.levelAtSeasonStart = p.level; \/\/ référence pour mesurer la progression de la saison à venir\n    p.departureAlertShown = false; \/\/ réinitialisé pour la nouvelle saison p.retirementAlertShown = false; \/\/ idem, pour l'alerte de retraite\n    \/\/ D9 : archive les stats de la saison qui vient de s'achever, puis les remet à zéro —\n    \/\/ la \"Vue stats\" ne montre ainsi que la saison en cours, l'historique cumule tout le reste.\n    p.statsHistory = p.statsHistory || [];\n    p.statsHistory.push({ season: state.season-1, m:p.stats.m, g:p.stats.g, a:p.stats.a, jc:p.stats.jc, rc:p.stats.rc, cs:p.stats.cs, noteSum:p.stats.noteSum, noteCount:p.stats.noteCount });\n    p.stats = {m:0,g:0,a:0,jc:0,rc:0,cs:0,noteSum:0,noteCount:0};\n    if(p.age>=p.retirementAge) retirees.push(p.id);\n  });\n  if(retirees.length){\n    retirees.forEach(id=>{\n      const p = players.find(x=>x.id===id);\n      toastPlayer(`Prend sa retraite.`, p, '👋');\n    });\n    players = players.filter(p=>!retirees.includes(p.id));\n  }\n  \/\/ Fin de prêt \/ fin de contrat : tout joueur dont le contrat tombe à 0 an quitte le club\n  \/\/ (hors joueurs déjà partis en retraite) — un joueur en prêt retourne chez lui, un joueur\n  \/\/ sous contrat classique devient libre de tout engagement.\n  const departsContrat = players.filter(p=>p.years<=0 && !p.isLoan && !retirees.includes(p.id)).map(p=>p.id);\n  if(departsContrat.length){\n    departsContrat.forEach(id=>{\n      const p = players.find(x=>x.id===id);\n      if(p.isLoan) toastPlayer(`Fin de prêt : retourne à ${p.loanClub||'son club'}.`, p, '↩️');\n      else toastPlayer(`Quitte ${CLUB_NAME} en fin de contrat, libre de tout engagement.`, p, '📄');\n    });\n    players = players.filter(p=>!departsContrat.includes(p.id));\n  }\n  \/\/ Aucun remplacement automatique des départs : au DS de recruter (transfert, prêt, joueur\n  \/\/ libre) pour combler l'effectif. Un jeune du centre de formation ne monte en équipe première\n  \/\/ que si aucune composition n'est plus possible du tout avec l'effectif restant — voir le\n  \/\/ filet de sécurité minimal juste après.\n  \/\/ Garde-fou minimal : si des départs massifs ont fait tomber l'effectif sous les 11 joueurs\n  \/\/ nécessaires pour former un onze, on complète d'abord ce strict minimum — le filet de\n  \/\/ sécurité qui suit ne fait que REMPLACER des joueurs faibles, jamais qu'AJOUTER, donc aucune\n  \/\/ composition ne redeviendrait jamais possible sans cette étape.\n  let minGuard = 0;\n  while(players.length < 11 && minGuard < 15){\n    players.push(generatePlayer({ isYouth:true, squadRef:players, division: state.division }));\n    minGuard++;\n  }\n  if(minGuard>0){\n    toast(`🌱 Le centre de formation fait monter ${minGuard} jeune${minGuard>1?'s':''} joueur${minGuard>1?'s':''} (15-18 ans) : l'effectif était trop réduit pour former un onze.`);\n  }\n  \/\/ Garde-fou : s'assurer qu'il reste toujours au moins un gardien dans l'effectif\n  if(!players.some(p=>p.mainPos.includes('GB'))){\n    const weakest = players.slice().sort((a,b)=>a.level-b.level)[0];\n    players = players.filter(p=>p.id!==weakest.id);\n    players.push(generatePlayer({isYouth:true, forceGB:true, division:state.division}));\n    toast(`🌱 Le centre de formation fait monter un jeune gardien : l'effectif n'en comptait plus aucun.`);\n  }\n  \/\/ Garde-fou : s'assurer qu'au moins une formation reste composable avec l'effectif\n  repairSquadCoverage(players);\n  let rebuildAttempts=0;\n  while(!squadIsPlayable(players) && rebuildAttempts<20){\n    const outfieldWeakest = players.filter(p=>!p.mainPos.includes('GB')).sort((a,b)=>a.level-b.level)[0];\n    if(!outfieldWeakest) break;\n    players = players.filter(p=>p.id!==outfieldWeakest.id);\n    players.push(generatePlayer({isYouth:true, division:state.division}));\n    rebuildAttempts++;\n  }\n  if(rebuildAttempts>0){\n    toast(`🌱 Le centre de formation fait remonter ${rebuildAttempts} jeune${rebuildAttempts>1?'s':''} joueur${rebuildAttempts>1?'s':''} (15-18 ans) : aucune composition n'était plus possible sans eux.`);\n  }\n\n  maintainMentorLinks(); \/\/ ADN Mentor (D10) : assigne\/renouvelle les mentorés avec l'effectif définitif de la saison\n  \/\/ planifie la progression de la saison à venir, répartie sur les 52 semaines (D3\/D4) — après\n  \/\/ maintainMentorLinks pour que l'accélération de 50% (mentoré) soit prise en compte\n  players.forEach(p=>scheduleSeasonProgression(p));\n\n  state.week=1;\n  initCup(); \/\/ remise a zero de la Coupe de France pour la nouvelle saison\n  state.loanedOutThisSeason = [];\n  state.matchesThisWeekCount = 0;\n  setupEuroForNewSeason(); \/\/ Coupes européennes : qualification acquise la saison précédente\n  processCupRound(); processEuroWeek(); \/\/ tire immédiatement pour la semaine 1, sinon un tour prévu dès la semaine
